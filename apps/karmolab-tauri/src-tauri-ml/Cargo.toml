[package]
name = "karmolab-ml-sidecar"
version = "0.1.0"
description = "KarmoLab ML stack sidecar — voice(Whisper) / capture(xcap) / OCR(tesseract). 메인 바이너리에서 분리 (KL-052)."
authors = ["mascari4615"]
edition = "2021"

# Tauri externalBin: ["bin/karmolab-life-ml"] (KL-052-D 통합 시 이 바이너리명 사용).
[[bin]]
name = "karmolab-life-ml"
path = "src/main.rs"

[dependencies]
# IPC 프로토콜 = 워크스페이스 공유 crate (메인과 단일 정의 공유, drift 0).
karmolab-shared = { path = "../src-tauri-shared" }
serde_json = "1"

# 버전 = 메인 src-tauri/Cargo.toml 과 일치 (워크스페이스 단일 Cargo.lock
# — drift 0). KL-052-B voice (cpal/candle Whisper) + KL-052-C screen
# 캡처(xcap/image) + OCR(rusty-tesseract) 이관 완료.
xcap = "0.0.13"
image = "0.25"
rusty-tesseract = "1"
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
byteorder = "1"
rand = "0.9"
