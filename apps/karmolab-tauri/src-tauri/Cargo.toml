[package]
name = "karmolab-desktop"
version = "0.1.15"
description = "KarmoLab desktop shell (Tauri WebView)"
authors = ["mascari4615"]
edition = "2021"

[lib]
name = "karmolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "6"
notify-rust = "4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# TASK-LIFE-001-F (sub-F-1: capture + sub-F-2: OCR/분류/frontmatter)
# image-hasher = sub-F-3 (diff 감지) 진입 시 추가
xcap = "0.0.13"
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
rusty-tesseract = "1"
# serde_yaml 은 deprecated → 활성 fork serde_yml 사용 (memory feedback_no_legacy.md).
serde_yml = "0.0.12"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "handleapi", "minwindef", "sysinfoapi"] }

