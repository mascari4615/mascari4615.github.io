[package]
name = "karmolab-desktop"
version = "0.1.109"
description = "KarmoLab desktop shell (Tauri WebView)"
authors = ["mascari4615"]
edition = "2021"

[lib]
name = "karmolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# devtools = **release 에서도 켠다** (KL-051 → 2026-08-20 뒤집음). 이유: 이 앱은 본인 PC 전용이고,
# 릴리스에서 F12 를 못 여는 값이 「우클릭 Inspect 가 안 보인다」보다 훨씬 비쌌다 (버그 하나 볼 때마다
# Rust 재컴파일 수 분). Inspect 노출은 devtools 를 끄는 대신 **WebView2 기본 우클릭 메뉴 자체를 막고
# 자체 맥락 메뉴를 그려** 없앤다 (Discord/VSCode 방식) — `karmolab_desktop_init_script()` + `lib/context-menu.ts`.
default = ["dev-tools"]
dev-tools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dependencies]
notify = "6"
notify-rust = "4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devtools = dev-only (KL-051: Cargo features 분기). production release 에 박지 X.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# TASK-KL-056: Claude 환경 위젯 wav path 파일 선택 다이얼로그.
tauri-plugin-dialog = "2"
# KL-052-B: ML sidecar(karmolab-life-ml) spawn — externalBin + stdin/stdout
# JSON line. 결정 #2 (Tauri 표준 lifecycle/번들 + KL-040 ACL 정합).
tauri-plugin-shell = "2"
# 메인 ↔ sidecar IPC 프로토콜 단일 정의 (serde 만 의존 — ML stack 안
# 딸려옴, KL-052 사이즈 목적 정합. drift 0 컴파일타임 강제).
karmolab-shared = { path = "../src-tauri-shared" }

# Win32 데스크톱 only — wasmbind / oldtime / iana-time-zone 불필요 (KL-051).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
# serde_yaml 은 deprecated → 활성 fork serde_yml 사용 (memory feedback_no_legacy.md).
serde_yml = "0.0.12"
# sub-F-3: 의식적 trigger (PrintScreen) + sub-B-2 hold-to-talk (Ctrl+Alt+Space) — Pressed/Released 분기.
tauri-plugin-global-shortcut = "2"

# KL-052 완료: ML stack 전부 sidecar(src-tauri-ml) 이관 — 메인 ML dep 0.
#   B: voice (candle*/tokenizers/cpal/hound/reqwest/byteorder/rand)
#   C: screen 캡처(xcap/image) + OCR(rusty-tesseract)
# 메인 in-process 사용 0 (마이그 자기소멸). 사이즈 절감 실발생점.

# TASK-KL-248: AI 구독 할당량 위젯 — Claude OAuth usage API 라이브 조회.
# rustls 트리는 tauri-plugin-updater 경유로 이미 워크스페이스에 컴파일 중 →
# 신규 의존성이지만 KL-051 사이즈 규율상 사실상 무료 (native-tls 는 피한다).
# 벤더 카드 3장을 동시에 물어보는 join_all 하나 (reqwest 가 이미 끌고 오는 트리).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TASK-KAR-227: 동반자 꾸러미를 릴리스에서 받아 푼다. 「소스 없이 깔기」의 마지막 한 칸이다.
# 기본 기능만 켠다 — deflate 로 충분하고(러너의 Compress-Archive 가 그걸 쓴다), 암호·bzip2 는
# 안 쓴다. 안 쓰는 기능을 켜면 그만큼 앱이 커진다(이 앱의 미덕은 5MB 다).
zip = { version = "2", default-features = false, features = ["deflate"] }

# TASK-KL-037: adventure dataUrl → 별 PNG 파일 분리 시 base64 디코드.
base64 = "0.22"

# TASK-KL-065: 비-GUI localdev 제어 (localhost HTTP). 경량 선택 — localhost
# 저빈도 AI 호출 + 코드베이스 std::thread/spawn_blocking 관용 정합. axum 의
# hyper/tower 트리 = KL-051 바이너리 사이즈 규율·cargo check 속도 역행.
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
# KL-064 알람: playsoundapi/mmsystem = 사운드 무한 루프(PlaySoundW SND_LOOP).
# synchapi/winbase/winnt/minwinbase = OS 강제 기상(절전 resume waitable timer +
# SetThreadExecutionState 모니터 유지).
# combaseapi/objbase/mmdeviceapi/endpointpvolume/combaseapi = Core Audio
# (IAudioEndpointVolume) — 볼륨 강제 비파괴 검증 harness (read→force→assert→restore).
# TASK-KL-055 Phase 1a — activity.rs/active_window.rs(읽기전용 텔레메트리,
# 저위험) 를 Microsoft 공식 windows-sys 로 마이그. alarm.rs(COM
# IAudioEndpointVolume + waitable-timer + 전원 = 런타임 크리티컬·windows-sys
# COM ergonomics 갭) 는 winapi 잔존 — KL-055-B 에서 백엔드 결정 후 마이그
# (런타임 검증 필요). 그래서 둘 다 잠시 공존(최종 dedup = 결정 후).
#
# KL-055-B 진단(2026-05-19): 과거 "windows crate 미도입 — 사이즈" 전제는
# 무효 — `windows` crate 는 이미 트랜지티브로 4버전(0.54/0.57/0.58/0.61)
# 컴파일 중(tauri 경유). audio(Core Audio COM)만 `windows` crate 를
# *이미 트리에 있는 버전으로 pin* 하면 5번째 버전 없이 feature 모듈만 추가.
# 권고 = split: sound/oswake→windows-sys, audio→windows crate.
# 전체 분석·결정 게이트: src-tauri/ALARM-COM-BACKEND-DECISION.md (NEEDS-USER-DECISION).
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "handleapi", "minwindef", "sysinfoapi", "playsoundapi", "mmsystem", "synchapi", "winbase", "winnt", "minwinbase", "combaseapi", "objbase", "mmdeviceapi", "endpointvolume", "coml2api", "winerror"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }

# KL-051 의 production 배포 최적화 (fat LTO / codegen-units=1 / strip /
# panic=abort / opt-level=3) 는 KL-052 워크스페이스 전환으로 *워크스페이스
# 루트* (`apps/karmolab-tauri/Cargo.toml` 의 [profile.release]) 로 이관됐다.
# cargo 는 워크스페이스 멤버의 [profile.*] 를 무시(warn)하므로 여기 두면
# KL-051 최적화가 조용히 사라진다. 루트에서 정의 — 동작 동일, 회귀 방지.

