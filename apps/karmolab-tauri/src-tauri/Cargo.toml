[package]
name = "karmolab-desktop"
version = "0.1.19"
description = "KarmoLab desktop shell (Tauri WebView)"
authors = ["mascari4615"]
edition = "2021"

[lib]
name = "karmolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# default = release-safe (devtools off — production WebView2 우클릭 「Inspect」 노출 차단).
# dev: `tauri dev --features dev-tools` (npm `dev:tauri` script 자동 적용).
default = []
dev-tools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "6"
notify-rust = "4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devtools = dev-only (KL-051: Cargo features 분기). production release 에 박지 X.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# TASK-LIFE-001-F (sub-F-1: capture + sub-F-2: OCR/분류/frontmatter + sub-F-3: hotkey)
xcap = "0.0.13"
image = "0.25"
# Win32 데스크톱 only — wasmbind / oldtime / iana-time-zone 불필요 (KL-051).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
rusty-tesseract = "1"
# serde_yaml 은 deprecated → 활성 fork serde_yml 사용 (memory feedback_no_legacy.md).
serde_yml = "0.0.12"
# sub-F-3: 의식적 trigger (PrintScreen) + sub-B-2 hold-to-talk (Ctrl+Alt+Space) — Pressed/Released 분기.
tauri-plugin-global-shortcut = "2"

# TASK-LIFE-001-B-2: Rust 음성 마이그 (life-voice.py 폐기). cublas64_12.dll 환경 의존 hang 근본 fix + 단일 process 직접 호출.
# candle (HuggingFace, pure Rust) — whisper-rs 의 libclang.dll 의존 회피. 환경 변경 0 = Mac/Linux/새 Win 그대로.
# 0.10.1 = latest stable (2026-04). 0.7.2 가 half 2.7 + rand 0.9 dep tree 와 호환 X 라 escalate (TASK-LIFE-001-B-2).
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
# whisper-large-v3 tokenizer (config.json + tokenizer.json + model.safetensors 다운은 reqwest 직접
# — hf-hub 0.3 sync Api 의 RelativeUrlWithoutBase 사고 우회 + dep 단순화).
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# audio capture cross-platform (Windows WASAPI / macOS CoreAudio / Linux ALSA).
cpal = "0.15"
# 16kHz mono PCM_16 .wav write (sub-B schema 정합).
hound = "3.5"
# 일반 HTTP (HF Hub fallback 또는 다른 다운).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# whisper mel filterbank bytes → f32 변환 (candle whisper example 패턴).
byteorder = "1"
# token sampling (greedy / temperature). candle 0.10 dep tree 와 일치 (0.9).
rand = "0.9"

# TASK-KL-037: adventure dataUrl → 별 PNG 파일 분리 시 base64 디코드.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "handleapi", "minwindef", "sysinfoapi"] }

# KL-051 의 production 배포 최적화 (fat LTO / codegen-units=1 / strip /
# panic=abort / opt-level=3) 는 KL-052 워크스페이스 전환으로 *워크스페이스
# 루트* (`apps/karmolab-tauri/Cargo.toml` 의 [profile.release]) 로 이관됐다.
# cargo 는 워크스페이스 멤버의 [profile.*] 를 무시(warn)하므로 여기 두면
# KL-051 최적화가 조용히 사라진다. 루트에서 정의 — 동작 동일, 회귀 방지.

