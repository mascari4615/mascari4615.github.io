[package]
name = "karmolab-desktop"
version = "0.1.34"
description = "KarmoLab desktop shell (Tauri WebView)"
authors = ["mascari4615"]
edition = "2021"

[lib]
name = "karmolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# default = release-safe (devtools off — production WebView2 우클릭 「Inspect」 노출 차단).
# dev: `tauri dev --features dev-tools` (npm `dev:tauri` script 자동 적용).
default = []
dev-tools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dependencies]
notify = "6"
notify-rust = "4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devtools = dev-only (KL-051: Cargo features 분기). production release 에 박지 X.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# TASK-KL-056: Claude 환경 위젯 wav path 파일 선택 다이얼로그.
tauri-plugin-dialog = "2"
# KL-052-B: ML sidecar(karmolab-life-ml) spawn — externalBin + stdin/stdout
# JSON line. 결정 #2 (Tauri 표준 lifecycle/번들 + KL-040 ACL 정합).
tauri-plugin-shell = "2"
# 메인 ↔ sidecar IPC 프로토콜 단일 정의 (serde 만 의존 — ML stack 안
# 딸려옴, KL-052 사이즈 목적 정합. drift 0 컴파일타임 강제).
karmolab-shared = { path = "../src-tauri-shared" }

# Win32 데스크톱 only — wasmbind / oldtime / iana-time-zone 불필요 (KL-051).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
# serde_yaml 은 deprecated → 활성 fork serde_yml 사용 (memory feedback_no_legacy.md).
serde_yml = "0.0.12"
# sub-F-3: 의식적 trigger (PrintScreen) + sub-B-2 hold-to-talk (Ctrl+Alt+Space) — Pressed/Released 분기.
tauri-plugin-global-shortcut = "2"

# KL-052 완료: ML stack 전부 sidecar(src-tauri-ml) 이관 — 메인 ML dep 0.
#   B: voice (candle*/tokenizers/cpal/hound/reqwest/byteorder/rand)
#   C: screen 캡처(xcap/image) + OCR(rusty-tesseract)
# 메인 in-process 사용 0 (마이그 자기소멸). 사이즈 절감 실발생점.

# TASK-KL-037: adventure dataUrl → 별 PNG 파일 분리 시 base64 디코드.
base64 = "0.22"

# TASK-KL-065: 비-GUI localdev 제어 (localhost HTTP). 경량 선택 — localhost
# 저빈도 AI 호출 + 코드베이스 std::thread/spawn_blocking 관용 정합. axum 의
# hyper/tower 트리 = KL-051 바이너리 사이즈 규율·cargo check 속도 역행.
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
# TASK-KL-055-B 완료 (winapi 완전 제거 — KL-055 dedup 최종):
# - 비-COM Win32 (oswake = waitable-timer 절전 resume + SetThreadExecutionState
#   + SendMessageTimeoutW; sound = PlaySoundW SND_LOOP) → Microsoft 공식
#   `windows-sys` (Phase 1a activity.rs/active_window.rs 와 동일 1:1 패턴).
#   windows-sys SetWaitableTimer 는 *const i64 직수령 → winapi LARGE_INTEGER
#   유니온(.QuadPart_mut()) hack 제거(더 안전·명료).
# - COM (audio = CoCreateInstance/IMMDeviceEnumerator/IAudioEndpointVolume) →
#   `windows` crate. RAII(인터페이스 Drop=자동 Release) + Result `?` 가
#   winapi 수동 vtable `(*x).Release()` 사다리·널체크 footgun(KL-064급
#   누락 위험) 을 구조적으로 제거. windows-sys 의 COM ergonomics 갭 회피.
#   feature 는 audio COM 표면만(Win32_Media_Audio*/Win32_System_Com) — 사이즈
#   영향은 KL-051 fat-LTO+strip 가 흡수. windows-sys 0.59 와 windows-targets
#   0.52 공유(windows 0.58) → cargo tree --duplicates 0 목표.
# 결정 근거·런타임 검증 프로토콜 = PR(KL-055-B) 본문.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

# KL-051 의 production 배포 최적화 (fat LTO / codegen-units=1 / strip /
# panic=abort / opt-level=3) 는 KL-052 워크스페이스 전환으로 *워크스페이스
# 루트* (`apps/karmolab-tauri/Cargo.toml` 의 [profile.release]) 로 이관됐다.
# cargo 는 워크스페이스 멤버의 [profile.*] 를 무시(warn)하므로 여기 두면
# KL-051 최적화가 조용히 사라진다. 루트에서 정의 — 동작 동일, 회귀 방지.

