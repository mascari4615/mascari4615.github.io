---
layout: none
permalink: /files/
sitemap: false
---
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Files</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #e3e5e9;
  --ink: #1f2328;
  --mute: #6b7280;
  --accent: #2f6feb;
  --accent-soft: #eaf1fe;
  --danger: #b3261e;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c;
    --surface: #1c1f24;
    --surface-2: #24282e;
    --line: #2e333a;
    --ink: #e6e8eb;
    --mute: #9aa2ad;
    --accent: #6ea0ff;
    --accent-soft: #23304a;
    --danger: #f2857c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Pretendard", -apple-system, "Segoe UI", "Apple SD Gothic Neo",
    "Noto Sans KR", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
}
.app { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0 12px;
}
.topbar h1 {
  margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em;
}
.topbar .logo {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; flex: none;
}
.topbar .logo svg { width: 15px; height: 15px; }

/* 데스크톱 전용 이동 손잡이. 웹에서는 안 그린다 */
/* 데스크톱 전용 손잡이. 상단바 오른쪽에 붙어 카모랩 헤더와 같은 결로 놓인다.
   따로 한 줄을 차지하면 화면에서 떠 보인다. */
.desknav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.desknav .go {
  border: 0; background: transparent; color: var(--mute);
  font: inherit; font-size: .8rem; font-weight: 600;
  padding: 5px 10px; border-radius: 7px; cursor: pointer;
}
.desknav .go:hover { color: var(--ink); background: var(--surface-2); }
.desknav .nav-gap { width: 8px; }
.desknav .wc {
  width: 30px; height: 26px; border: 0; background: transparent; color: var(--mute);
  display: grid; place-items: center; border-radius: 6px; cursor: pointer;
}
.desknav .wc svg { width: 12px; height: 12px; display: block; }
.desknav .wc:hover { background: var(--surface-2); color: var(--ink); }
.desknav .wc-close:hover { background: var(--danger); color: #fff; }

.sources {
  display: flex; gap: 4px; padding: 3px;
  background: var(--surface-2); border-radius: 999px; width: fit-content;
  margin-bottom: 14px;
}
.tab {
  border: 0; background: transparent; color: var(--mute);
  font: inherit; font-weight: 600; font-size: .86rem;
  padding: 7px 16px; border-radius: 999px; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tab:disabled { opacity: .45; cursor: default; }

.crumb {
  font-size: .86rem; color: var(--mute); margin: 0 0 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
}
.crumb a { color: var(--mute); text-decoration: none; padding: 3px 6px; border-radius: 6px; }
.crumb a:hover { background: var(--surface-2); color: var(--ink); }
.crumb a:last-child { color: var(--ink); font-weight: 600; }
.crumb .sep { color: var(--line); }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.head {
  display: grid; grid-template-columns: 34px 1fr 110px 140px 92px; gap: 12px;
  align-items: center; padding: 9px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
  font-size: .76rem; font-weight: 700; color: var(--mute); letter-spacing: .02em;
}
/* 머리글을 눌러 정렬한다. 같은 자리를 다시 누르면 뒤집는다 */
.head { padding: 0 14px; }
.th {
  background: none; border: 0; cursor: pointer; color: inherit;
  font: inherit; letter-spacing: inherit; padding: 9px 0;
  display: inline-flex; align-items: center; gap: 4px; width: 100%;
}
.th:hover { color: var(--ink); }
.th.on { color: var(--accent); }
.th i { font-style: normal; font-size: .68rem; }
.head .th-kind .th { font-size: .7rem; }
.head .size .th, .head .when .th { justify-content: flex-start; }
/* 액자에는 표가 없어 보기 줄에 같은 버튼을 둔다 */
.sortsw { display: flex; gap: 2px; margin-left: 14px; }
.sortsw .th {
  width: auto; padding: 4px 8px; font-size: .8rem; font-weight: 600;
  color: var(--mute); border-radius: 6px;
}
.sortsw .th.on { color: var(--accent); background: var(--surface); }

.row {
  display: grid; grid-template-columns: 34px 1fr 110px 140px 92px; gap: 12px;
  align-items: center; padding: 9px 14px; border-top: 1px solid var(--line);
}
.head + .row { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .name { font-weight: 500; word-break: break-all; }
.row .name a { color: inherit; text-decoration: none; }
.row .name a:hover { color: var(--accent); text-decoration: underline; }
.row .size, .row .when { color: var(--mute); font-size: .82rem; font-variant-numeric: tabular-nums; }
.icon { width: 22px; height: 22px; color: var(--mute); }
.icon.folder { color: var(--accent); }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.acts a {
  color: var(--mute); text-decoration: none; font-size: .8rem; font-weight: 600;
  padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line);
}
.acts a:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* 액자 보기. 썸네일이 없어 원본을 받아 그림 (gallery.mjs).
   칸은 자리를 먼저 잡고 그림이 늦게 옴. 자리 안 잡으면 그림 올 때마다 화면이 튐 */
.viewsw { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.viewsw button {
  background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer;
  color: var(--mute); font-size: .8rem; font-weight: 600; padding: 4px 10px;
}
.viewsw button.on { color: var(--ink); border-color: var(--line); background: var(--surface); }
/* 칸 크기. 액자일 때만 뜬다. 목록 옆에 붙으면 무엇에 걸리는 값인지 안 헷갈린다 */
.cellsw { display: flex; gap: 4px; margin-left: auto; }

/* 여럿 고르기. 체크는 갈래 아이콘 자리를 쓴다. 칸을 늘리면 좁은 화면 표가 어긋난다 */
.pickbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.pickbar .pb-at { color: var(--mute); font-size: .8rem; font-variant-numeric: tabular-nums; }
.pickbar .fb-gap { flex: 1; }
input.pick { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; margin: 0; }
.framewrap { position: relative; display: block; min-width: 0; }
.frame-pick {
  position: absolute; top: 7px; left: 7px; z-index: 2;
  box-shadow: 0 0 0 2px var(--surface-2);
}
.folderbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
.folderbar a {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
  font-size: .84rem; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
}
.folderbar a:hover { border-color: var(--accent); color: var(--accent); }
.folderbar .icon { width: 16px; height: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 146px), 1fr));
  gap: 10px; padding: 12px;
}
.frame {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2);
}
.frame:hover { border-color: var(--accent); }
.frame-art { display: block; aspect-ratio: 1; background: var(--surface-2); position: relative; }
.frame-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 아직 안 온 칸은 옅은 맥박, 못 받은 칸은 조용한 빗금 (고장 아니라 여긴 없음) */
.frame-art::after {
  content: ''; position: absolute; inset: 0; background: var(--line); opacity: .35;
  animation: framewait 1.4s ease-in-out infinite;
}
.frame.ready .frame-art::after, .frame.blank .frame-art::after { animation: none; }
.frame.ready .frame-art::after { content: none; }
.frame.blank .frame-art::after {
  opacity: .18;
  background: repeating-linear-gradient(45deg, var(--line) 0 6px, transparent 6px 12px);
}
@keyframes framewait { 0%, 100% { opacity: .18; } 50% { opacity: .4; } }
/* 좁히기 줄. 정렬, 갈래, 찾기. 목록과 액자 위에 늘 같은 자리 */
.siftbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.siftbar input {
  flex: 1; min-width: 140px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; color: var(--ink); font: inherit; font-size: .84rem; padding: 5px 10px;
}
.sf-group { display: inline-flex; gap: 4px; }
.sf-chip {
  background: none; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  color: var(--mute); font: inherit; font-size: .78rem; font-weight: 600; padding: 4px 11px;
}
.sf-chip:hover { color: var(--ink); }
.sf-chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.sf-note { color: var(--mute); font-size: .78rem; margin-left: auto; }

/* 파일 화면 맨 위. 몇 번째인지, 앞뒤, 받기. 갈래와 무관하게 같은 줄 */
.filebar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.filebar .fb-gap { flex: 1; }
.filebar .fb-at { color: var(--mute); font-size: .8rem; font-variant-numeric: tabular-nums; }
.fb-btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
  color: var(--ink); font: inherit; font-size: .82rem; font-weight: 600; padding: 5px 11px;
  text-decoration: none; display: inline-block;
}
.fb-btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.fb-btn[disabled] { opacity: .38; cursor: default; }
.fb-btn.on { border-color: var(--accent); color: var(--accent); }
.fb-btn.sm { font-size: .74rem; padding: 3px 8px; font-weight: 600; }
/* 액자의 폴더 칩. 이름과 받기가 한 덩이 */
.fb-item { display: inline-flex; align-items: center; gap: 4px; }
.fb-item > a { border-radius: 8px 0 0 8px; }

/* 정보 패널. 탐색기 속성 창 자리. 이름과 값 두 칸 */
.fileinfo {
  margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line);
  background: var(--surface-2); font-size: .82rem;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 18px;
}
.fileinfo > div { display: flex; gap: 8px; min-width: 0; }
.fileinfo dt { color: var(--mute); flex: 0 0 62px; }
.fileinfo dd {
  margin: 0; min-width: 0; overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

/* 그림 아닌 칸. 빈 자리 대신 갈래 글자와 크기 (2026-08-29: 빗금만 두니 고장처럼 보임) */
.frame-face {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  color: var(--mute); font-size: 1.5rem; line-height: 1;
}
.frame-face i { font-style: normal; font-size: .72rem; letter-spacing: .02em; }
.frame.shown .frame-art::after { content: none; }

.frame-cap {
  display: block; padding: 7px 9px; font-size: .78rem; color: var(--mute);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* PC 업로드 관리. 데스크톱 앱에서만 조작, 웹에서는 안내 한 줄 */
.uploader {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
}
.up-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.up-badge {
  font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--mute);
}
.up-badge.running, .up-badge.preparing { background: var(--accent-soft); color: var(--accent); }
.up-badge.done { background: var(--accent-soft); color: var(--accent); }
.up-badge.error { background: var(--surface-2); color: var(--danger); }
.up-num { font-size: .82rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.up-bar { height: 6px; border-radius: 999px; background: var(--surface-2); margin: 10px 0 6px; overflow: hidden; }
.up-bar i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
.up-meta { font-size: .78rem; color: var(--mute); min-height: 1em; }
.up-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
/* 고른 폴더 이름을 그대로 보여 주는 단추. 이름이 길어도 칸을 밀지 않는다. */
#up-pick {
  flex: 1 1 160px; min-width: 0; padding: 7px 10px; font-weight: 400; text-align: left;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.up-acts button {
  border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  font-size: .86rem; padding: 7px 16px; border-radius: 8px; cursor: pointer;
}
.up-acts button:disabled { opacity: .55; cursor: default; }
.up-note { font-size: .82rem; color: var(--mute); }
.up-note.err { color: var(--danger); }

.gate { padding: 40px 18px; text-align: center; }
.gate p { margin: 0 0 14px; color: var(--mute); }
.gate input {
  width: 100%; max-width: 280px; padding: 9px 12px; font: inherit;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink);
}
.gate input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.gate button {
  margin-top: 12px; border: 0; background: var(--accent); color: #fff;
  font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 8px; cursor: pointer;
}
.gate button:hover { filter: brightness(1.08); }

.none, .err { padding: 44px 18px; color: var(--mute); text-align: center; }
.err { color: var(--danger); }
.preview-img, .preview-vid { display: block; max-width: calc(100% - 32px); margin: 24px auto; background: var(--surface-2); }
.preview-text {
  margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-all;
  font-size: .85rem; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
.dl { padding: 40px 18px; text-align: center; }
.dl a {
  color: #fff; background: var(--accent); text-decoration: none;
  font-weight: 600; padding: 9px 20px; border-radius: 8px;
}

.build-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.build-toolbar .fb-gap { flex: 1; }
.build-note { color: var(--mute); font-size: .82rem; }
.build-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px; border-top: 1px solid var(--line); }
.build-toolbar + .build-card { border-top: 0; }
.build-card:hover { background: var(--surface-2); }
.build-title { min-width: 0; font-weight: 650; word-break: break-all; }
.build-meta { color: var(--mute); font-size: .8rem; font-variant-numeric: tabular-nums; }
.build-acts { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 6px; }
.build-state { display: inline-block; margin-right: 7px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--mute); font-size: .72rem; font-weight: 700; }
.build-state.running, .build-state.stalling { background: var(--accent-soft); color: var(--accent); }
.build-state.dead { color: var(--danger); }
.build-log { margin: 0; padding: 14px; max-height: 65vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font: .78rem/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }

@media (max-width: 720px) {
  .head { display: none; }
  .row { grid-template-columns: 30px 1fr auto; }
  .row .when { display: none; }
  .row .size { grid-column: 2; margin-top: -4px; }
  .acts { grid-row: 1; grid-column: 3; }
  .build-card { grid-template-columns: 1fr; }
  .build-acts { grid-column: 1; grid-row: auto; justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" data-tauri-drag-region>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6a2 2 0 0 1 2-2h3.2l1.8 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z"/></svg>
    </div>
    <h1>Files</h1>
    <nav class="desknav" id="desknav" hidden></nav>
  </header>
  <div class="sources">
    <button class="tab on" type="button" id="tab-laptop">내 PC</button>
    <button class="tab" type="button" id="tab-vault">클라우드</button>
    <button class="tab" type="button" id="tab-builds">빌드</button>
  </div>
  <div class="uploader" id="uploader" hidden></div>
  <nav class="crumb" id="crumb"></nav>
  <div class="panel" id="box"></div>
</div>
<script type="module" src="app.mjs"></script>
</body>
</html>
