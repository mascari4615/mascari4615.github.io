<!doctype html>
<html lang="ko"><meta charset="utf-8"><base href="/.local/arcade-art/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심야 오락실 | 플레이와 수집 시안</title>
<style>
:root{color-scheme:dark;--cream:#f6e7cd;--pink:#e9a4bd;--mint:#91d6c8}*{box-sizing:border-box}body{margin:0;background:#15121e;color:var(--cream);font:15px/1.6 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff30;background:#282334;padding:12px 20px}button:hover{background:#494054}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin:0 0 16px}h1{font-size:clamp(30px,4vw,56px);letter-spacing:-2px}h2{font-size:24px}small,.muted{color:#b8acbd}small{font-size:12px}.eyebrow{font:11px monospace;letter-spacing:3px;color:var(--mint)}.app{min-height:100svh;position:relative;isolation:isolate;background:linear-gradient(90deg,#17132155,#171321b0),url('/.local/arcade-art/v7-background.png') center/cover fixed}.app:before{content:'';position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,transparent 0 3px,#100d1518 3px 4px);pointer-events:none}header{height:100px;padding:22px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px}.profile{display:flex;gap:16px;text-align:left;align-items:center;background:#171723dc;border-left:3px solid var(--mint);padding:9px 18px;min-width:250px}.avatar{display:grid;place-items:center;width:48px;height:48px;background:#b69acb;color:#21192b;font-size:24px}.profile strong{display:block}progress{height:5px;accent-color:var(--mint);width:140px;display:block}.currency{display:flex;gap:20px;align-items:center;background:#171321b8;padding:8px 20px}.currency b{font-size:19px}.review{position:fixed;bottom:0;left:0;right:0;height:30px;background:#100d19ed;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 4%;font-size:11px;color:#b9aabc}.review button{padding:0 10px;border:0;font-size:11px;background:transparent}.lobby{min-height:calc(100svh - 130px);position:relative;overflow:hidden}.portrait{position:absolute;bottom:0;left:-5%;height:100%;width:70%;object-fit:contain;object-position:bottom;filter:drop-shadow(15px 8px 20px #100b1950);pointer-events:none}.artnote{position:absolute;left:5%;top:10px;font-size:10px;color:#c8b9cb}.hero{position:relative;margin-left:59%;padding:11vh 5vw 150px 0}.hero .eyebrow{margin-bottom:16px}.start{width:100%;min-height:160px;background:var(--cream);color:#2c2534;border:0;border-left:7px solid var(--pink);text-align:left;padding:25px 34px;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)}.start:hover{background:white}.start strong{display:block;font-size:42px;letter-spacing:-2px}.start span{font:11px monospace;letter-spacing:4px}.recent{margin-top:16px;width:100%;text-align:left;background:#211d2cdd}.speech{position:absolute;bottom:120px;left:5%;width:40%;background:linear-gradient(90deg,#191323ee,#19132366);border-left:2px solid var(--pink);padding:18px 25px}.speech strong{color:var(--pink)}.speech p{margin:6px 0 0}.dock{position:absolute;bottom:30px;right:5%;display:flex;gap:10px}.dock button{min-width:110px;min-height:74px;background:#292033e8;border-top:2px solid #ba9eae}.dock b{display:block;font-size:19px}.page{max-width:1280px;margin:auto;padding:30px 4% 80px;min-height:calc(100svh - 100px)}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.tile{text-align:left;min-height:165px;background:linear-gradient(135deg,#403247,#201e30);border-top:3px solid var(--tone,var(--mint));padding:23px}.tile i{display:block;font-style:normal;font-size:35px;color:var(--tone,var(--mint));margin-bottom:18px}.tile strong{display:block;font-size:20px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#1d1a29ed;border:1px solid #b9a4bf35;padding:30px}.panel p{color:#d0c2d3}.accent{background:var(--cream);color:#211d2c;border:0;font-weight:700}.accent:hover{background:white}.wide{width:100%;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff19;gap:15px}.castgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.castcard{padding:24px;background:#252132ed;border-top:3px solid var(--tone);text-align:left}.sigil{height:150px;display:grid;place-items:center;font-size:70px;color:var(--tone);background:radial-gradient(ellipse,#ffffff10,transparent 70%)}.castcard h2{margin:8px 0}.chip{display:inline-block;padding:3px 9px;background:#ffffff0b;font-size:11px;color:var(--mint)}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;max-width:400px;margin:20px auto;background:#b29a7d;padding:15px;border:8px solid #756355}.cell{display:grid;place-items:center;border:1px solid #443c3940}.stone{height:75%;aspect-ratio:1;border-radius:50%;background:#211e26;box-shadow:2px 3px 3px #0005}.white{background:#f3e8d7}.reward{font-size:42px;color:var(--mint);font-weight:800}.story{max-width:800px;margin:30px auto;padding:45px;background:#211b2be8;border-left:3px solid var(--pink)}.story p{font-size:18px;line-height:2}.story small{display:block;margin-bottom:24px}.pullgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:25px 0}.pull{padding:20px 8px;text-align:center;background:#393045;border-top:2px solid var(--mint)}.pull.new{background:#5d3b56;border-color:var(--pink)}dialog{max-width:640px;width:90%;border:1px solid #b69bb9;background:#211d2d;color:var(--cream);padding:30px}dialog::backdrop{background:#090711ba;backdrop-filter:blur(6px)}[hidden]{display:none!important}
@media(max-width:800px){header{height:auto;padding:15px;flex-wrap:wrap}.profile{min-width:200px}.currency{font-size:12px;gap:14px}.lobby{min-height:850px}.portrait{height:650px;width:110%;left:-20%;top:0}.hero{margin-left:30%;padding:340px 20px 200px 0}.speech{bottom:160px;width:80%}.dock{left:4%;right:4%;bottom:45px;gap:5px}.dock button{min-width:0;flex:1;padding:8px;font-size:12px}.dock b{font-size:15px}.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.castgrid{grid-template-columns:repeat(2,1fr)}.page{padding:20px 18px 70px}.panel{padding:20px}.pullgrid{grid-template-columns:repeat(2,1fr)}.story{padding:24px}.review{font-size:9px}.start strong{font-size:32px}}
</style>
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-refined.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-atelier.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-terminal.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-a-live.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-a-assets.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/lobby-a-composition.css">
<link rel="stylesheet" href="/apps/karmolab/arcade-lobby/screen-fit.css">
<div class="app"><header><button class="profile" onclick="show('profile')"><span class="avatar">K</span><span><small>KarmoLab / 심야의 단골</small><strong>카모 <span id="level"></span></strong><progress id="xp" max="100"></progress></span></button><div class="currency"><span>오락실 코인 <b id="coins"></b></span><span>교환 조각 <b id="shards"></b></span><button onclick="show('lobby')">로비</button></div></header><main id="screen"></main></div>
<div class="review"><span>인터랙션 시안 / 임시 일러스트 / 수치와 뽑기 결과는 예시 / 실제 계정 연결 없음</span><span><button onclick="help.showModal()">검토 안내</button><button onclick="reset()">처음부터</button></span></div>
<dialog id="help"><h2>한 바퀴 눌러보기</h2><p>게임 시작 → 오목 → 링과 한 판 → 결과 체험 → 10회 뽑기 → 링의 인연 이야기.</p><p>대전은 결과 체험용이며 뽑기는 링 획득을 보여주는 고정 시나리오입니다. 새로고침하면 초기화됩니다. 이미지 속 인물은 네 캐릭터의 확정 디자인이 아닙니다.</p><p>천장, 가격, 경험치와 인연 수치는 검토용입니다. 현금 결제는 없습니다. 배경음은 이 시안에 포함하지 않았습니다.</p><button onclick="help.close()">닫기</button></dialog>
<script>
const names=['욘','알리사','링','티메토'], tones=['#b9a6e8','#9fb3c8','#f2d16b','#91d6c8'], symbols=['☾','◇','✦','◷'];
const games=['오목','야추','솔리테어','리버시','사목','체커','블랙잭','스네이크','탁구','에어하키'];
let s;const $=id=>document.getElementById(id);function reset(){s={coins:1000,shards:0,xp:60,owned:[0],equipped:0,bond:[15,0,30,0],played:false,game:0,gift:false,pulls:0};show('lobby')}
function stats(){$('level').textContent='Lv. '+(4+Math.floor(s.xp/100));$('xp').value=s.xp%100;$('coins').textContent=s.coins.toLocaleString();$('shards').textContent=s.shards}
function page(title,body){return `<section class="page"><div class="page-head"><div><div class="eyebrow">NIGHT ARCADE</div><h1>${title}</h1></div><button onclick="show('lobby')">로비로</button></div>${body}</section>`}
function renderLegacyScreen(view){stats();let html='';if(view==='lobby')html=`<section class="lobby"><img class="portrait" src="/.local/arcade-art/v7-character.png" alt="캐릭터 배치 검토용 임시 일러스트"><span class="artnote">장착: ${names[s.equipped]} / 일러스트 교체 예정</span><div class="hero"><div class="eyebrow">OPEN ALL NIGHT / KARMO ARCADE</div><button class="start" onclick="show('games')"><span>PLAY SOMETHING GOOD</span><strong>게임 시작　↗</strong><span>GAME SELECT / 10 GAMES</span></button>${s.played?`<button class="recent" onclick="show('room')"><small>최근 플레이</small><br>${games[s.game]}　이어서 둘러보기 →</button>`:''}</div><div class="speech"><strong>${names[s.equipped]}</strong><p>${s.equipped===0?'왔어? ...한 판 하고 가.':'다음엔 뭐 하고 놀까요?'}</p></div><nav class="dock"><button onclick="show('collection')"><b>캐릭터</b>인연과 이야기</button><button onclick="show('gacha')"><b>기원</b>뽑기와 교환</button><button onclick="show('profile')"><b>기록</b>업적과 프로필</button><button onclick="show('gift')"><b>보관함</b>${s.gift?'받은 선물':'쌓인 선물 5'}</button></nav></section>`;
if(view==='games')html=page('오늘은 무슨 게임?',`<p class="muted">게임을 고르면 해당 종목의 공간으로 이동합니다.</p><div class="grid">${games.map((g,i)=>`<button class="tile" style="--tone:${tones[i%4]}" onclick="s.game=${i};show('room')"><i>${['●','⚄','♠','◉','▥'][i%5]}</i><strong>${g}</strong><small>${i===2||i===7?'혼자 즐기기':'NPC 대전 / 함께하기'}</small></button>`).join('')}</div>`);
if(view==='room')html=page(games[s.game],`<button onclick="show('games')">← 게임 선택</button><div class="columns" style="margin-top:20px"><article class="panel"><div class="eyebrow">SOLO PLAY</div><h2>${s.game===2||s.game===7?'나만의 한 판':'링과 한 판'}</h2><p>${s.game===2||s.game===7?'기록에 도전하고 내 캐릭터의 인연을 쌓아요.':'장난스럽지만 한 수는 진심. 캐릭터가 없어도 대전할 수 있어요.'}</p><div class="row"><span>내 캐릭터</span><b>${names[s.equipped]}</b></div><div class="row"><span>난이도</span><b>가볍게</b></div><button class="accent wide" onclick="show('match')">혼자 시작</button></article><article class="panel"><div class="eyebrow">PLAY TOGETHER</div><h2>함께하는 방</h2><p>지금은 열린 방이 없어요.</p><button onclick="notice('방 만들기','실제 서버 연결 전 시안입니다. 게임별 방 생성과 초대가 이 자리에 연결됩니다.')">방 만들기</button> <button onclick="notice('초대 코드','실제 방 코드로 참가하는 기능은 이 시안에 연결하지 않았습니다.')">코드로 참가</button></article></div>`);
if(view==='match')html=page('한 판의 순간',`<div class="columns"><article class="panel"><span class="chip">${games[s.game]} / 실제 대전이 아닌 연출 모형</span><div class="board">${Array.from({length:81},(_,i)=>`<div class="cell">${[20,30,40,50,60,31,39,49,59].includes(i)?`<span class="stone ${[31,39,49,59].includes(i)?'white':''}"></span>`:''}</div>`).join('')}</div><small>오목 보드로 공통 흐름을 대표합니다. 다른 종목 규칙은 실행하지 않습니다.</small></article><article class="panel"><div class="eyebrow">${s.game===2||s.game===7?'SOLO':'VS. LING'}</div><h2>${s.game===2||s.game===7?'기록에 도전 중':'링'}</h2><p id="reaction">${s.game===2||s.game===7?'한 판의 결과를 확인해 보세요.':'막아 봐~! ...어, 벌써 봤어요?'}</p><button onclick="$('reaction').textContent='링: 에이, 아직 안 끝났거든요~?'">이모티콘: 자신만만</button><button class="accent wide" onclick="finish()">승리 결과 체험</button><small>승패 판단과 온라인 전송 없음</small></article></div>`);
if(view==='result')html=page('좋은 한 판이었어.',`<div class="columns"><article class="panel"><div class="eyebrow">VICTORY / ${names[s.equipped]}</div><div class="reward">YOU WIN</div><p>${s.equipped===0?'...이겼네. 조금만 더 깨어 있을까.':'한 판 더 해요?'}</p><div class="row"><span>플레이와 첫 승리 업적</span><b>코인 +1,000</b></div><div class="row"><span>계정 경험치</span><b>+40 / Lv.5</b></div><small>재화는 첫 결과 체험에 한 번 지급하는 예시입니다.</small></article><article class="panel"><h2>함께한 시간</h2><p>${names[s.equipped]} 인연 ${s.bond[s.equipped]} / 50</p>${s.game!==2&&s.game!==7?`<p>링 인연 ${s.bond[2]} / 50</p><span class="chip">${s.owned.includes(2)?'획득한 캐릭터':'미보유여도 인연 보존'}</span><p>링을 획득하고 인연 50을 채우면 첫 이야기가 열려요.</p>`:''}<button class="accent wide" onclick="show('gacha')">모은 코인으로 기원</button><button class="wide" onclick="show('collection')">인연 확인</button></article></div>`);
if(view==='gacha')html=page('기원',`<div class="columns"><article class="panel"><div class="eyebrow">THE REGULARS</div><h2>밤을 함께하는 네 사람</h2><div class="castgrid">${names.map((n,i)=>`<div style="--tone:${tones[i]}"><div class="sigil" style="height:100px">${symbols[i]}</div><strong>${n}</strong></div>`).join('')}</div><p>캐릭터와 장식. 중복은 교환 조각으로 돌아와요.</p><button class="accent wide" ${s.coins<1000?'disabled':''} onclick="pull()">10회 뽑기 / 1,000 코인</button><small>예시 결과 고정: 첫 10회에서 링 획득. 확률 시뮬레이션 아님.</small></article><article class="panel"><h2>기다림에도 끝이 있도록</h2><p>뽑을 때마다 교환 조각을 받고, 원하는 캐릭터를 직접 고를 수 있어요.</p><div class="row"><span>누적 뽑기</span><b>${s.pulls}회</b></div><p>캐릭터 지정 교환: 조각 20개 (임시 수치)</p>${names.slice(1).map((n,j)=>`<button class="wide" ${s.owned.includes(j+1)||s.shards<20?'disabled':''} onclick="redeem(${j+1})">${n} ${s.owned.includes(j+1)?'보유 중':'확정 교환'}</button>`).join('')}</article></div>`);
if(view==='pull')html=page('새로운 얼굴, 이어지는 인연',`<div class="pullgrid">${Array.from({length:10},(_,i)=>`<div class="pull ${i===0?'new':''}"><small>${i===0?'CHARACTER':'EXCHANGE'}</small><h2>${i===0?'링':'조각 +1'}</h2><small>${i===0?'캐릭터 획득 / 재획득 시 조각 전환':'중복 장식 교환'}</small></div>`).join('')}</div><article class="panel"><h2>링의 인연은 그대로</h2><p>획득 전 쌓은 인연 ${s.bond[2]} / 50. ${s.bond[2]>=50?'첫 번째 이야기가 열렸어요.':'링과 대전하면 첫 이야기에 가까워져요.'}</p><button class="accent" onclick="show('collection')">캐릭터와 이야기 보기</button></article>`);
if(view==='collection')html=page('함께한 사람들',`<div class="castgrid">${names.map((n,i)=>`<article class="castcard" style="--tone:${tones[i]}"><small>${s.owned.includes(i)?'OWNED':'NOT OWNED'}</small><div class="sigil">${symbols[i]}</div><h2>${n}</h2><p>인연 ${s.bond[i]} / 50</p><button class="wide" ${!s.owned.includes(i)||s.equipped===i?'disabled':''} onclick="s.equipped=${i};show('collection')">${s.equipped===i?'사용 중':'장착'}</button><button class="wide" ${i!==2||!s.owned.includes(i)||s.bond[i]<50?'disabled':''} onclick="show('story')">${i===2?'한 판만 더':'이야기 준비 중'}</button><small>${!s.owned.includes(i)?'인연 보존 중 / 획득 후 이야기 해금':'보유 캐릭터를 모든 게임에서 사용'}</small></article>`).join('')}</div>`);
if(view==='story')html=page('링 / 첫 번째 이야기',`<article class="story"><div class="eyebrow">BOND EPISODE 01</div><h2>한 판만 더</h2><small>링 설정 기반 집필 초안 / 인연 50 / 1장 중 1장</small><p>링이 방금 끝난 판의 돌을 모으다가, 흰 돌 하나를 손바닥에 감췄다.</p><p>“이거 찾아야 집에 갈 수 있어요.”</p><p>두 손을 내밀었지만 오른쪽 주먹은 제대로 닫히지도 않았다. 내가 그 손을 가리키자, 링이 입술을 삐죽였다.</p><p>“이럴 때는 한 번쯤 틀려 줘도 되잖아요.”</p><p>나는 다시 의자를 당겼다. 링은 감추던 돌을 판 한가운데 놓고, 빈 손으로 내 쪽 돌통을 밀어 주었다.</p><p>“...이번에는 먼저 둬요.”</p><button class="accent" onclick="show('collection')">이야기 닫기</button></article>`);
if(view==='profile')html=page('나의 오락실',`<div class="columns"><article class="panel"><h2>카모 / Lv.${4+Math.floor(s.xp/100)}</h2><p>KarmoLab 통합 계정 프로필 예시</p><div class="row"><span>칭호</span><b>${s.played?'첫 불을 켠 사람':'심야의 단골'}</b></div><div class="row"><span>예시 전적 / 오목 NPC전</span><b>${s.played?'1승 0패 / 100%':'기록 없음'}</b></div><small>멀티 전적과 종목별 기록은 따로 표시. 실제 기록 연결 없음.</small></article><article class="panel"><h2>업적과 다음 보상</h2><div class="row"><span>첫 승리</span><b>${s.played?'달성 / 보상 지급됨':'진행 전'}</b></div><div class="row"><span>Lv.5 달성</span><b>${s.played?'칭호 획득':'계정 경험치 40 남음'}</b></div><div class="row"><span>네 명과의 만남</span><b>${s.owned.length} / 4</b></div><button class="wide" onclick="notice('프로필 꾸미기','획득한 칭호와 테두리를 선택하는 공간입니다. 이번 시안은 첫 승리 칭호 표시까지 연결했습니다.')">프로필 꾸미기</button></article></div>`);
if(view==='gift')html=page('돌아온 날의 선물',`<article class="panel"><div class="eyebrow">WELCOME BACK</div><h2>${s.gift?'선물을 받았어요':'선물 5개가 기다리고 있어요'}</h2><p>연속 출석 대신 쉬는 동안 쌓인 선물. 편한 날 찾아오세요.</p><button class="accent" ${s.gift?'disabled':''} onclick="s.coins+=500;s.gift=true;show('gift')">모두 받기 / 예시 코인 500</button><p><small>5개 누적과 보상은 시안 데이터. 누적 한도와 실제 랜덤 보상표는 미정입니다.</small></p></article>`);
$('screen').innerHTML=html;window.scrollTo(0,0)}
function finish(){if(!s.played){s.coins+=1000;s.xp+=40;s.bond[s.equipped]+=20;if(s.game!==2&&s.game!==7&&s.equipped!==2)s.bond[2]+=20;s.played=true}show('result')}
function pull(){if(s.coins<1000)return;s.coins-=1000;s.pulls+=10;s.shards+=19;if(!s.owned.includes(2))s.owned.push(2);else s.shards++;show('pull')}
function redeem(i){if(s.shards<20||s.owned.includes(i))return;s.shards-=20;s.owned.push(i);show('collection')}
function notice(title,body){const d=document.createElement('dialog');const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;const b=document.createElement('button');b.textContent='닫기';b.onclick=()=>d.close();d.append(h,p,b);d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal()}
