rder-bottom:1px solid #8e76552e;color:#aa9ea8}.filters button.active{color:#f4dcc0;background:linear-gradient(90deg,#b89a5d38,transparent);border-left:2px solid #d0ad7d}.recent{margin-top:auto;background:#302631ba;border:1px solid #a48a6255;padding:13px;text-align:left}.recent small{display:block;color:#bea78a;font-size:10px;margin-bottom:6px}.recent b{font-weight:500}.cards{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;padding:3cqh 0 0}.card{position:relative;min-width:0;min-height:0;overflow:hidden;padding:0;border:1px solid #ae91635c;background:#29242e;text-align:left;display:grid;grid-template-rows:minmax(0,1fr) 54px;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:#e4c594}.card img{width:100%;height:100%;min-height:0;object-fit:cover}.card .label{padding:8px 12px;background:#241f2be8;display:flex;justify-content:space-between;align-items:center}.label small{font:8px monospace;letter-spacing:1px;color:#b39b7e;display:block}.label b{font-size:17px;font-weight:500}.card .number{position:absolute;left:10px;top:8px;color:#fff9;font:11px monospace}.empty{visibility:hidden}.bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #a98c5a33}.bottom>small{color:#a699a8;font-size:10px}.pager{display:flex;gap:14px;align-items:center}.pager span{font:12px monospace;color:#d0b48c}.pager button{font-size:20px}.detail{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6cqw;min-height:0}.detail>img{width:100%;height:100%;object-fit:contain;min-height:0}.detail h1{font:42px Georgia,'Batang',serif;margin:12px 0}.detail p{font-size:13px;color:#bfb2be}.action{display:block;width:100%;text-align:left;padding:15px 20px;margin:12px 0;border:1px solid #b69a6655;background:#2e2734}.action.primary{background:#d3bb92;color:#241d27}.action small{display:block;font-size:10px;margin-top:4px;opacity:.7}.rooms{padding:20px;border:1px solid #9d82614a;background:#241d2ba8}.rooms p{margin:10px 0}.note{color:#bca98d;font-size:10px}
@container(max-width:650px){.screen{grid-template-rows:52px minmax(0,1fr) 48px;gap:6px;padding:0 5cqw}.brand{font-size:12px}.top small{display:none}.library{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:0}.intro{padding:10px 0 0;display:block}.intro h1{font-size:26px;margin:6px 0}.intro p,.recent{display:none}.eyebrow{font-size:8px}.filters{flex-direction:row;margin:8px 0 0;gap:2px}.filters button{font-size:11px;padding:7px 9px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 0}.card{grid-template-rows:minmax(0,1fr) 47px}.label b{font-size:15px}.label small{font-size:7px}.bottom>small{max-width:45%;font-size:9px}.pager{gap:7px}.detail{grid-template-columns:1fr;grid-template-rows:minmax(0,.7fr) minmax(0,1fr);gap:8px}.detail h1{font-size:27px;margin:6px 0}.detail p{margin:6px 0}.action{padding:10px 14px;margin:8px 0}.rooms{padding:10px}.review strong{max-width:40%;font-size:10px}.surround{padding:0}}
@container(max-height:450px){.screen{grid-template-rows:42px minmax(0,1fr) 38px;gap:5px}.intro h1{font-size:24px}.intro p,.recent{display:none}.filters{margin:8px 0}.cards{padding:0;gap:8px}.card{grid-template-rows:minmax(0,1fr) 40px}.label b{font-size:13px}.label small{font-size:7px}.detail h1{font-size:24px}.action{margin:5px 0;padding:8px 12px}}

<div class="review"><strong>스크롤 없는 게임 선택 / 시안 01</strong><nav aria-label="콘텐츠 영역 크기"><button data-size="desktop">PC</button><button data-size="tablet">태블릿</button><button data-size="phone">모바일</button></nav></div>
<div class="surround"><main class="viewport" id="viewport"><div class="scene"></div><div class="screen"><header class="top"><button id="back">← 로비</button><span class="brand">NIGHT ARCADE</span><small>카모 / Lv. 4</small></header><div id="body" class="library"></div><footer class="bottom"><small id="hint">마음 가는 한 판, 천천히 골라요.</small><div class="pager"><button id="prev" aria-label="이전 페이지">←</button><span id="page"></span><button id="next" aria-label="다음 페이지">→</button></div></footer></div></main></div>
<script>
const games=[['오목','gomoku','board'],['야추','yacht','board'],['솔리테어','solitaire','board'],['리버시','reversi','board'],['사목','four','board'],['체커','checkers','board'],['블랙잭','blackjack','board'],['스네이크','snake','quick'],['탁구','pong','quick'],['에어하키','airhockey','quick']];
const viewport=document.querySelector('#viewport'),body=document.querySelector('#body');let category='all',page=0,perPage=6,selected=null,room=false;
function render(){const list=games.filter(g=>category==='all'||g[2]===category),pages=Math.ceil(list.length/perPage);page=Math.min(page,pages-1);document.querySelector('.pager').hidden=selected!==null;document.querySelector('#back').textContent=selected===null?'← 로비':'← 게임 선택';document.querySelector('#hint').textContent=selected===null?'마음 가는 한 판, 천천히 골라요.':'화면 전환 검토용 / 실제 게임 연결 없음';if(selected!==null){const g=games[selected];body.className='detail';body.innerHTML=`<img src="cover-${g[1]}.svg" alt="${g[0]}"><section><span class="eyebrow">TONIGHT’S GAME</span><h1>${g[0]}</h1>${room?'<div class="rooms"><b>함께하는 방</b><p>아직 열린 방이 없어요.</p><button class="action primary" id="create">방 만들기 ＋</button><button class="action" id="code">초대 코드로 참가</button><small class="note">방 목록도 한 화면씩 전환</small></div>':'<p>오늘은 어떤 한 판을 할까요?</p><button class="action primary" id="solo">혼자 시작 →<small>내 페이스로 가볍게</small></button><button class="action" id="multi">함께하기 →<small>방 목록 / 방 만들기 / 초대 코드</small></button>'}</section>`;body.querySelector('#multi')?.addEventListener('click',()=>{room=true;render()});for(const id of ['solo','create','code'])body.querySelector('#'+id)?.addEventListener('click',()=>document.querySelector('#hint').textContent='여기서 기존 '+({solo:'게임 설정',create:'방 생성',code:'초대 코드 입력'}[id])+' 화면으로 연결 예정');return}body.className='library';body.innerHTML=`<aside class="intro"><span class="eyebrow">CHOOSE YOUR GAME</span><h1>오늘의 놀이</h1><p>혼자서도, 함께여도.<br>이 밤에 어울리는 한 판.</p><nav class="filters">${[['all','전체'],['board','보드와 카드'],['quick','짧은 한 판']].map(([id,name])=>`<button data-filter="${id}" class="${id===category?'active':''}">${name}</button>`).join('')}</nav><button class="recent" data-game="0"><small>최근 플레이</small><b>오목　↗</b></button></aside><div class="cards">${list.slice(page*perPage,(page+1)*perPage).map(g=>`<button class="card" data-game="${games.indexOf(g)}"><img src="cover-${g[1]}.svg" alt=""><span class="number">${String(games.indexOf(g)+1).padStart(2,'0')}</span><span class="label"><span><small>${['solitaire','snake'].includes(g[1])?'SOLO':'SOLO / TOGETHER'}</small><b>${g[0]}</b></span><span>↗</span></span></button>`).join('')}</div>`;body.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{category=b.dataset.filter;page=0;render()});body.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.game);room=false;render()});document.querySelector('#page').textContent=`${page+1} / ${pages}`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===pages-1}
document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#back').onclick=()=>{if(selected!==null){selected=null;room=false;render()}else location.href='lobby-a-composition.html'};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>viewport.className='viewport '+(b.dataset.size==='desktop'?'':b.dataset.size));new ResizeObserver(()=>{const n=viewport.clientWidth<=650?4:6;if(n!==perPage){perPage=n;page=0}render()}).observe(viewport);render();
</script><script src="/apps/karmolab/arcade-lobby/game-select-bridge.js"></script></html>
