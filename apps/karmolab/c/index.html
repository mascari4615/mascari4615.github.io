<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<meta name="color-scheme" content="dark">
<title>커뮤니티 — KarmoLab</title>
<meta name="description" content="KarmoLab 에서 오가는 이야기와 도구 요청.">
<meta property="og:type" content="website">
<meta property="og:title" content="KarmoLab 커뮤니티">
<meta property="og:description" content="도구를 쓰는 사람들이 이야기하는 곳.">
<meta property="og:url" content="https://blog.mascari4615.com/karmolab/c/">
<meta property="og:locale" content="ko_KR">
<!-- 글마다 다른 내용이 스크립트로 채워진다. 빈 껍데기가 색인되면 사이트 전체 평가가 깎이므로
     지금은 목록만 열고 글은 안 연다. 서버가 글 HTML 을 직접 내보내게 되면 그때 연다. -->
<meta name="robots" content="index, follow">
<link rel="icon" href="/apps/karmolab/img/favicon.ico">
<style>
  :root {
    --bg: #0f0f12;
    --panel: #171a22;
    --panel-2: #1d212b;
    --line: rgba(255, 255, 255, 0.09);
    --text: #e8e8ef;
    --muted: #a0a4b4;
    --dim: #767b8c;
    --accent: #b9a2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.65;
    font-size: 15px;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }

  .c-shell { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
  .c-top {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 18px 0; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .c-brand { font-weight: 700; letter-spacing: -0.01em; }
  .c-top nav { display: flex; gap: 14px; margin-left: auto; font-size: 13px; color: var(--muted); }

  .c-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .c-tab {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .c-tab[data-on="1"] { border-color: var(--accent); color: var(--accent); }

  .c-write { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .c-write input, .c-write textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit;
  }
  .c-write textarea { min-height: 92px; resize: vertical; }
  .c-write input:focus, .c-write textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .c-write-foot { display: flex; justify-content: flex-end; }
  .c-btn {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; cursor: pointer;
  }
  .c-btn-main { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .c-btn-main:hover { background: var(--accent); color: var(--bg); }
  .c-signin {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); margin-bottom: 22px;
  }
  .c-signin p { margin: 0; color: var(--muted); font-size: 14px; }

  .c-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .c-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 4px; border-bottom: 1px solid var(--line);
  }
  .c-votes {
    flex: 0 0 auto; min-width: 38px; text-align: center; padding: 4px 0;
    border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--muted);
  }
  .c-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .c-row-title { font-weight: 600; }
  .c-row-sub { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-row-meta {
    flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
    font-size: 12px; color: var(--dim); white-space: nowrap;
  }
  .c-replies-count, .c-replies span { color: var(--muted); }
  .c-empty-row { padding: 28px 4px; color: var(--muted); font-size: 14px; }

  .c-crumb { margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .c-post { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px; }
  .c-post-title { margin: 0; font-size: 21px; line-height: 1.4; }
  .c-post-meta { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .c-post-body { margin-top: 16px; white-space: pre-wrap; word-break: break-word; }
  .c-vote {
    margin-top: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; cursor: pointer;
  }
  .c-vote[data-voted="1"] { border-color: var(--accent); color: var(--accent); }
  .c-vote[disabled] { cursor: default; opacity: .6; }

  .c-section { margin: 28px 0 12px; font-size: 15px; }
  ul.c-replies { list-style: none; margin: 0 0 22px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .c-reply { border-left: 2px solid var(--line); background: var(--panel-2); border-radius: 0 8px 8px 0; padding: 10px 14px; }
  .c-reply[data-owner="1"] { border-left-color: var(--accent); }
  .c-reply-head { font-size: 12px; color: var(--dim); }
  .c-reply-body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }

  .c-tag {
    display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 11px; color: var(--muted); vertical-align: middle;
  }
  .c-linkbtn { background: none; border: none; padding: 0; color: var(--dim); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .c-linkbtn:hover { color: var(--text); }
  .c-empty { padding: 56px 0; text-align: center; color: var(--muted); }
  .c-empty h2 { color: var(--text); font-size: 19px; margin: 0 0 8px; }

  @media (max-width: 560px) {
    .c-row { flex-wrap: wrap; }
    .c-row-meta { width: 100%; }
  }
</style>
</head>
<body>
  <div class="c-shell">
    <header class="c-top">
      <a class="c-brand" href="/karmolab/">KarmoLab</a>
      <nav>
        <a href="/karmolab/c/">커뮤니티</a>
        <a href="/karmolab/t/">도구</a>
        <a href="/karmolab/">작업실</a>
      </nav>
    </header>
    <main id="communityRoot">
      <p class="c-empty-row">불러오는 중…</p>
    </main>
  </div>
  <script defer src="/apps/karmolab/js/community.js"></script>
</body>
</html>
