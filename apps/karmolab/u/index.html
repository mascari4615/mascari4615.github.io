<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<meta name="color-scheme" content="dark">
<title>프로필 — KarmoLab</title>
<meta name="description" content="KarmoLab 에서 이어 온 기록.">
<!-- 프로필은 사람마다 다른 내용이 스크립트로 채워진다. 검색 결과에 빈 껍데기가 쌓이면
     사이트 전체 평가가 깎이므로 색인하지 않는다 (TASK-KL-098 Cycle 1).
     서버가 프로필 HTML 을 직접 내보내게 되면 그때 연다. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/apps/karmolab/img/favicon.ico">
<style>
  :root {
    --bg: #0f0f12;
    --card: #171a22;
    --line: rgba(255, 255, 255, 0.09);
    --text: #e8e8ef;
    --muted: #a0a4b4;
    --accent: #b9a2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    display: flex;
    justify-content: center;
  }
  #profileRoot { width: 100%; max-width: 560px; }
  a { color: var(--accent); }
  .profile-card, .profile-empty {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  .profile-head { display: flex; gap: 18px; align-items: center; }
  .profile-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .profile-avatar-blank {
    display: grid; place-items: center;
    background: rgba(185, 162, 255, 0.12); color: var(--accent); font-size: 30px;
  }
  .profile-name { margin: 0; font-size: 24px; }
  .profile-handle { margin: 2px 0 0; color: var(--accent); font-size: 14px; }
  .profile-joined { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .profile-stats { display: flex; gap: 12px; margin: 26px 0; flex-wrap: wrap; }
  .profile-stat {
    flex: 1 1 120px; text-align: center;
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 8px;
  }
  .profile-stat strong { display: block; font-size: 24px; }
  .profile-stat span { font-size: 12px; color: var(--muted); }
  .profile-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .profile-table th, .profile-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .profile-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .profile-table td:not(:first-child), .profile-table th:not(:first-child) { text-align: right; }
  .profile-note { color: var(--muted); font-size: 14px; }
  /* 명함 자리 (TASK-KL-152 C5) — 한 줄 소개 + 대표 도구. 안 채운 사람에겐 통째로 안 그려진다. */
  /* 따라가기 (TASK-KL-152 C8) — 로그인 안 했거나 자기 프로필이면 단추 자체가 없다. */
  .profile-follow {
    margin-left: auto; align-self: flex-start;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 14px; font-weight: 600;
  }
  .profile-follow:hover { background: var(--accent); color: #0f0f12; }
  .profile-follow.on { background: var(--accent); color: #0f0f12; }
  .profile-follow[disabled] { opacity: .6; cursor: default; }
  .profile-actions { margin-left: auto; display: flex; gap: 8px; align-self: flex-start; }
  .profile-actions .profile-follow { margin-left: 0; }
  .profile-block {
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: 14px;
  }
  .profile-block:hover { border-color: #dc2626; color: #fca5a5; }
  .profile-block[disabled] { opacity: .6; cursor: default; }
  /* 지금 접속 중 (TASK-KL-156 D5) — 본인이 켠 사람에게만 붙는다. */
  .profile-online { color: #4ade80; font-size: 12px; margin-left: 6px; }
  .profile-card-note { margin: 18px 0 0; }
  .profile-bio { margin: 0; font-size: 15px; line-height: 1.6; }
  .profile-pins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .profile-pin {
    padding: 5px 11px; border-radius: 999px; font-size: 13px; text-decoration: none;
    border: 1px solid var(--line); color: var(--accent);
  }
  .profile-pin:hover { border-color: var(--accent); }
  .profile-share {
    margin-left: 14px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 13px;
  }
  .profile-share:hover { border-color: var(--accent); color: var(--accent); }
  /* 잔디 (TASK-KL-175 E6) — 안 온 날과 둘러보기만 한 날을 다르게 칠한다. */
  .profile-grass-wrap { margin: 24px 0; }
  .profile-grass-wrap h2 { margin: 0 0 8px; font-size: 15px; }
  .profile-grass {
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px);
    gap: 2px; overflow-x: auto; padding-bottom: 6px;
  }
  .profile-grass i { width: 9px; height: 9px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); }
  .profile-grass i[data-lv="1"] { background: rgba(185, 162, 255, 0.25); }
  .profile-grass i[data-lv="2"] { background: rgba(185, 162, 255, 0.5); }
  .profile-grass i[data-lv="3"] { background: rgba(185, 162, 255, 0.75); }
  .profile-grass i[data-lv="4"] { background: var(--accent); }
  .profile-grass i[data-lv="x"] { background: transparent; }
  /* 작업실 (TASK-KL-182 F3) — 건 것이 없으면 이 자리는 아예 안 그려진다. */
  .profile-works { margin: 24px 0; }
  .profile-works h2 { margin: 0 0 10px; font-size: 15px; }
  .profile-works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .profile-works figure { margin: 0; }
  .profile-works img {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
  }
  .profile-works figcaption { margin-top: 5px; font-size: 12px; color: var(--text); }
  /* 그림이 없는 작업 — PDF·소리·영상·글 (TASK-KL-191 축3). 없는 그림을 부르는 대신
     갈래 표시와 단서 한 줄을 같은 크기의 칸에 둔다(벽이 들쭉날쭉해지지 않게). */
  .profile-work-blank {
    width: 100%; aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center;
    border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
  }
  .profile-work-blank b { font-size: 30px; line-height: 1; }
  .profile-work-blank i {
    font-style: normal; font-size: 11px; color: var(--muted); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-all;
  }
  .profile-foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; }
  .profile-empty h1 { margin: 0 0 10px; font-size: 20px; }
  .profile-empty p { color: var(--muted); }
  .profile-act { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
  .profile-act h2 { margin: 0 0 10px; font-size: 15px; }
  .profile-act h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .profile-dim { color: var(--muted); font-weight: 400; font-size: 12px; }
  .profile-list { margin: 0; padding-left: 18px; font-size: 14px; }
  .profile-list li { margin: 3px 0; }
</style>
</head>
<body>
  <main id="profileRoot">
    <div class="profile-empty"><p>불러오는 중…</p></div>
  </main>
  <!-- 도구 이름표 (TASK-KL-152 C5). 대표 도구를 `pet` 같은 id 로 보이면 남은 그게 뭔지 모른다.
       이름은 이 목록이 정본이라 여기서 읽는다 — 프로필 쪽에 이름을 베껴 적지 않는다. -->
  <script defer src="/apps/karmolab/js/widgets-index.js"></script>
  <script defer src="/apps/karmolab/js/profile.js"></script>
</body>
</html>
