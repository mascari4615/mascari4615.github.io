    <!-- 방문 기록 (TASK-KL-089).
         블로그 글에는 이 줄이 있는데 도구 쪽에는 없어서, 도구 페이지 124장과 이 첫 화면의
         방문이 **하나도 세어지지 않고 있었다**. 어느 도구로 사람이 오는지 알 수 없으면
         무엇을 더 만들지도, 무엇이 통했는지도 알 수 없다.
         아래 analytics.js 는 이 스크립트가 만든 `window.goatcounter` 를 쓴다 — 그것이 없으면
         조용히 아무것도 안 한다. 즉 이 줄이 빠지면 기록 전체가 사라진다.
         (도구를 옮겨 다닐 때의 기록은 analytics.js 가 맡고, 처음 연 도구는 이 줄이 센다.) -->
    <script>
    /* 기록기는 화면이 다 뜬 뒤에 부른다. 바로 부르면 남의 서버에서 받아 실행하는 동안
       주 스레드가 더 잡힌다(실측 +88ms). 방문 수는 조금 늦게 세어도 값이 같다. */
    addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://gc.zgo.at/count.js';
      s.setAttribute('data-goatcounter', 'https://mascari4615.goatcounter.com/count');
      document.head.appendChild(s);
    });
    </script>
    <!-- 성능 계측 (TASK-KL-201) — 셸이 눈금을 여기에 적는다(`window.KLPerf`). 셸(toolbox)보다
         **먼저** 실려야 부팅 마일스톤이 안 빈다. defer 는 문서 순서대로 실행되므로 이 줄의
         위치가 곧 순서다. 계측기가 없어도 셸은 그대로 돈다(전부 `?.` 로 부른다). -->
    <script defer fetchpriority="low" src="/apps/karmolab/js/perf.js"></script>
    <script defer fetchpriority="low" src="/apps/karmolab/js/analytics.js"></script>
    <!-- 계정 (TASK-KL-098) — 도전과제·연속기록이 이 브라우저 밖에도 남게 하고, 헤더의 로그인
         자리를 채운다. 서버(yawnbot)가 죽어 있으면 아무 일도 안 하고 지금까지와 똑같이 동작한다. -->

    <script defer fetchpriority="low" src="/apps/karmolab/js/copresence.js"></script>

    <script defer fetchpriority="low" src="/apps/karmolab/js/palette.js"></script>

    <!-- KL-054: gemini.js eager 제거 → chatbot/imagegen/imageedit/imagelib(lazyScriptPaths)
         · user(ensureScript) 가 첫 사용 시 로드. -->
    <script defer fetchpriority="low" src="/apps/karmolab/js/widgets-index.js"></script>
    <script defer src="/apps/karmolab/js/widgets-manifest.js"></script>
    <script defer fetchpriority="low" src="/apps/karmolab/js/widgets-loader.js"></script>
    <!-- 마스코트·액정놀이는 **화면을 다 그린 뒤에** 부른다 (TASK-KL-128 런타임).
         둘 다 첫 그림에 안 쓰이는데 합쳐서 압축 10KB 를 부팅에 얹고 있었다.

         그냥 미루면 첫 화면이 죽는다 — 마스코트를 **안 감싸고 부르는 곳**이 위젯 여러 곳에
         있어서 「Mdd 가 없다」로 멈춘다(실제로 그렇게 죽었다). 호출부를 전부 고치는 대신,
         **먼저 자리만 만들어 둔다**: 아직 안 온 동안의 부름은 줄을 세워 두었다가, 진짜가
         도착하면 그대로 다시 불러 준다. 그래서 놓치는 대사도 없다. -->
    <script>
    (function () {
      var q = [];
      var api = ['setMood', 'say', 'bounce', 'injectCSS', 'linePreset', 'addAffection',
                 'showGuide', 'showNextGuide', 'openStoryLog',
                 'setPrefs', 'resetPrefs', 'resetPosition', 'spot'];
      var stub = {};
      api.forEach(function (n) { stub[n] = function () { q.push([n, [].slice.call(arguments)]); }; });
      /* 값으로 읽는 것들은 빈 값으로 답한다 — 없는 것보다 낫다. */
      stub.getAffection = function () { return 0; };
      stub.getRelationshipTitle = function () { return ''; };
      stub.getStoryProgress = function () { return { seen: [], chapter: 0 }; };
      stub.getStoryLog = function () { return []; };
      window.Mdd = stub;

      function pullRest() {
        var mdd = document.createElement('script');
        mdd.src = '/apps/karmolab/js/mdd.js';
        mdd.onload = function () {
          /* 진짜가 오면 `Mdd` 는 그쪽을 가리킨다(스크립트 맨 바깥 선언이 이긴다).
             줄 세워 둔 부름을 그대로 다시 흘려보낸다. */
          try {
            var real = (typeof Mdd !== 'undefined') ? Mdd : null;
            if (real && real !== stub) {
              q.forEach(function (c) { try { if (real[c[0]]) real[c[0]].apply(real, c[1]); } catch (e) {} });
            }
          } catch (e) { /* 없으면 그냥 둔다 */ }
          q.length = 0;
        };
        document.body.appendChild(mdd);

        /* 채팅도 여기서 온다 (TASK-KL-128 26) — 첫 그림에 필요 없는데 부팅 목록에 있었다.
           도구 화면에서 491ms 짜리 프레임 하나를 통째로 만들고 있었다(실측). */
        var chat = document.createElement('script');
        chat.src = '/apps/karmolab/js/widgets/chat.js';
        document.body.appendChild(chat);

      }

      /* 액정놀이는 **켜는 신호가 왔을 때** 데려온다 (TASK-KL-128 ⑱).
         평소엔 아무 일도 안 하는 이스터에그인데 4.9KB(압축)를 화면 130장이 매번 받고 있었다.
         켜는 길은 둘 — 주소 뒤 `?badapple`, 그리고 위위아래아래왼오왼오BA.
         그 둘만 여기서 지켜보고, 걸리면 그때 진짜를 부른다.

         도구가 「나도 그릴게」 하고 신고하는 창구는 **먼저 자리를 만들어 둔다** — 안 그러면
         이 파일이 오기 전에 열려 있던 도구들의 칸이 통째로 빠진다(켰을 때 화면 일부만 액정이
         되는데, 오류가 없어서 아무도 못 알아챈다). 줄 세워 뒀다가 진짜가 오면 흘려보낸다. */
      (function () {
        var pending = [];
        window.KarmoLabBadApple = {
          add: function (surface) {
            pending.push(surface);
            return function () {
              var i = pending.indexOf(surface);
              if (i >= 0) pending.splice(i, 1);
            };
          }
        };
        var asked = false;
        function pull(then) {
          if (asked) return;
          asked = true;
          var ba = document.createElement('script');
          ba.src = '/apps/karmolab/js/badapple/boot.js';
          ba.onload = function () {
            var real = window.KarmoLabBadApple;
            if (real && real.add) for (var i = 0; i < pending.length; i++) { try { real.add(pending[i]); } catch (e) {} }
            pending.length = 0;
            if (then && real && real.start) real.start();
          };
          document.body.appendChild(ba);
        }
        /* 주소로 켠 경우엔 그쪽 파일이 스스로 시작한다 — 여기서 또 부르면 두 번 켠다. */
        if (new URLSearchParams(location.search).has('badapple')) { pull(false); return; }

        var KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
        var at = 0;
        addEventListener('keydown', function (e) {
          var k = (e.key || '').toLowerCase();
          if (k === KONAMI[at]) {
            at++;
            if (at === KONAMI.length) { at = 0; pull(true); }
          } else {
            at = (k === KONAMI[0]) ? 1 : 0;
          }
        });
      })();
      var idle = window.requestIdleCallback || function (f) { setTimeout(f, 300); };
      if (document.readyState === 'complete') idle(pullRest);
      else addEventListener('load', function () { idle(pullRest); });
    })();
    </script>
    <!-- 도구 한 장짜리 화면은 처음에 **가벼운 목록**만 받는다 (TASK-KL-128 ③) — 위젯 171개의
         이름·분류·불러올 곳만, 93KB 대신 26KB. 아이콘 그림과 설명은 옆줄·찾기창이 실제로
         그려질 때 필요한 것이라, 화면이 다 그려지고 한가해진 뒤에 따라온다.
         첫 화면(대시보드)은 옆줄을 바로 그리므로 처음부터 전체를 받는다 — 그때는 이 대목이 안 돈다. -->
    <script>
    (function () {
      function pull() {
        /* 이 판단은 **여기서** 해야 한다. 이 스크립트는 화면을 읽는 도중에 바로 도는데,
           표식을 세우는 가벼운 목록은 `defer` 라 그보다 늦게 돈다 — 위에서 물으면 늘 「아니오」다.
           실제로 그렇게 돼서 아이콘 72자리가 빈 채로 남았다. */
        if (!window.KARMOLAB_META_LITE) return;
        var s = document.createElement('script');
        s.src = '/apps/karmolab/js/widgets-lazy-meta.js';
        s.onload = function () { try { Toolbox.upgradeMeta(); } catch (e) { /* 없으면 그냥 둔다 */ } };
        document.body.appendChild(s);
      }
      var idle = window.requestIdleCallback || function (f) { setTimeout(f, 300); };
      if (document.readyState === 'complete') idle(pull);
      else addEventListener('load', function () { idle(pull); });
    })();
    </script>
    {% if jekyll.environment == 'production' and site.pwa.enabled and site.pwa.cache.enabled %}
    <!-- Chirpy SW는 루트(/sw.min.js)에 있으나 layout:none 페이지는 app.min.js를 쓰지 않아 등록되지 않았음 → 방문 시 동일 출처·허용 URL을 런타임 캐시(오프라인/앱용). -->
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.min.js" | relative_url }}').catch(function () {});
    }
    </script>
    {% endif %}
</body>
