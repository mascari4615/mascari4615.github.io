                <script>
                (function () {
                  // 글자를 여기서 쪼갠다 — 화면에 그려지는 그 순간부터 걸어 나오게.
                  var t = document.getElementById('introTitle');
                  if (!t) return;
                  var s = t.textContent;
                  t.textContent = '';
                  for (var i = 0; i < s.length; i++) {
                    var el = document.createElement('span');
                    el.className = 'intro-letter';
                    el.style.setProperty('--i', i);
                    el.textContent = s[i];
                    t.appendChild(el);
                  }
                })();
                </script>
                <div class="mobile-nav" id="mobile-nav"></div>
                <div class="content-header" id="contentHeader" style="display:none">
                    <div><div class="breadcrumb" id="breadcrumb"></div><h1 class="content-title" id="pageTitle"></h1></div>
                </div>
                <div class="content-body" id="tool-pages"></div>
                <!-- KARMOLAB_TOOL_SEO — gen-tool-pages.mjs 가 도구 상세 페이지에서만 이 자리에
                     서버 렌더 설명(h1·사용법·FAQ·관련 도구)을 채운다. /karmolab/ 본체에서는 빈 주석. -->
            </main>
        </div>
    </div>
    <!-- 방문 기록 (TASK-KL-089).
         블로그 글에는 이 줄이 있는데 도구 쪽에는 없어서, 도구 페이지 124장과 이 첫 화면의
         방문이 **하나도 세어지지 않고 있었다**. 어느 도구로 사람이 오는지 알 수 없으면
         무엇을 더 만들지도, 무엇이 통했는지도 알 수 없다.
         아래 analytics.js 는 이 스크립트가 만든 `window.goatcounter` 를 쓴다 — 그것이 없으면
         조용히 아무것도 안 한다. 즉 이 줄이 빠지면 기록 전체가 사라진다.
         (도구를 옮겨 다닐 때의 기록은 analytics.js 가 맡고, 처음 연 도구는 이 줄이 센다.) -->
    <script>
    /* 기록기는 화면이 다 뜬 뒤에 부른다. 바로 부르면 남의 서버에서 받아 실행하는 동안
       주 스레드가 더 잡힌다(실측 +88ms). 방문 수는 조금 늦게 세어도 값이 같다. */
    addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://gc.zgo.at/count.js';
      s.setAttribute('data-goatcounter', 'https://mascari4615.goatcounter.com/count');
      document.head.appendChild(s);
    });
    </script>
    <script defer src="/apps/karmolab/js/analytics.js"></script>
    <!-- 계정 (TASK-KL-098) — 도전과제·연속기록이 이 브라우저 밖에도 남게 하고, 헤더의 로그인
         자리를 채운다. 서버(yawnbot)가 죽어 있으면 아무 일도 안 하고 지금까지와 똑같이 동작한다. -->
    <script defer src="/apps/karmolab/js/account.js"></script>
    <!-- 명령 팔레트 (TASK-KL-099) — 첫 화면의 본체이자 ⌘K 로 뜨는 그것.
         toolbox 가 첫 화면을 그릴 때 window.KarmoPalette 를 찾으므로 그보다 먼저 둔다.
         defer 는 문서 순서대로 실행되므로 이 줄의 위치가 곧 순서다.
         이 한 줄이 빌드 목록이기도 하다 — build.mjs 가 화면이 부르는 주소에서 뽑는다(KL-098). -->
    <script defer src="/apps/karmolab/js/palette.js"></script>
    <script defer src="/apps/karmolab/js/toolbox.js"></script>
    <script defer src="/apps/karmolab/js/mdd.js"></script>
    <!-- KL-054: gemini.js eager 제거 → chatbot/imagegen/imageedit/imagelib(lazyScriptPaths)
         · user(ensureScript) 가 첫 사용 시 로드. -->
    <script defer src="/apps/karmolab/js/widgets-lazy-meta.js"></script>
    <script defer src="/apps/karmolab/js/widgets-manifest.js"></script>
    <script defer src="/apps/karmolab/js/widgets-loader.js"></script>
    {% if jekyll.environment == 'production' and site.pwa.enabled and site.pwa.cache.enabled %}
    <!-- Chirpy SW는 루트(/sw.min.js)에 있으나 layout:none 페이지는 app.min.js를 쓰지 않아 등록되지 않았음 → 방문 시 동일 출처·허용 URL을 런타임 캐시(오프라인/앱용). -->
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.min.js" | relative_url }}').catch(function () {});
    }
    </script>
    {% endif %}
</body>
</html>
