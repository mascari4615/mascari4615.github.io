# The Site Configuration — 컷오버 후 (change.blog-cutover)
#
# Chirpy 는 철거됐다. Jekyll 은 **얇은 조립기**로만 남는다:
#  ① front matter `permalink`/`last_modified_at` 처리 (karmolab 생성 장 전부 `layout: none`)
#  ② jekyll-sitemap + `_plugins/sitemap-*.rb` (사이트맵 규율 — TASK-KL-349/350)
#  ③ 정적 파일 복사 (CNAME·검증 파일·assets/img — R2 원본)
# 글 렌더는 전부 `apps/karmolab/scripts/gen-post-pages.mjs` 가 한다.
#
# ★ `theme:` 줄을 지우지 마라 — 이 repo 는 자기 자신이 path gem 이고, jekyll-sitemap 등
# 플러그인이 **gemspec runtime deps 로 로드**된다 (config 에 plugins: 키가 없다).
# theme 를 지우면 사이트맵이 조용히 비고 audit-sitemap-lastmod 가 배포를 세운다.
# Ruby 완전 철거(Node 조립기)는 후속 Change 몫.

theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: KarmoDDrine
tagline: 삶을 섞고 술을 바꿀 시간
description: >-
  KarmoDDrine의 잃어버린 도토리들 - [메모, 기록, 전략]

url: "https://blog.mascari4615.com"
baseurl: ""

# 소유확인 — seo-tag(테마) 가 죽어 meta 방식은 안 나간다. 실 방어선 = 루트 검증 파일
# (google*.html · naver*.html · BingSiteAuth.xml). 값은 기록으로 남긴다.
webmaster_verifications:
  google: YyOln-BHzWUdxQlVEf9yXj9ZRXo_3bYOovPEe4x_-yI
  naver: bc02ece3a499e1d43a65a9c6312bac2c0a8e336b

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - LICENSE
  # Rust/Cargo + Tauri: local `target/` can be multi‑GB; never needed in static site output
  - "**/src-tauri/target"
  - apps/karmolab-tauri/src-tauri/target
  - apps/chat-overlay/src-tauri/target
  # Monorepo npm workspaces: symlinks under node_modules point at apps/packages; Listen would watch the same dir twice (Windows errors).
  - "**/node_modules"
  # Not part of the static site; watching them duplicates apps/*/node_modules symlinks on Windows (Listen "already being watched").
  - apps/discord-bots
  - packages
  # 글 속 사진(assets/img/post)을 여기에 적어도 **소용없다** — 실측으로 확인했다.
  # 이 저장소는 자기 자신이 테마(gemspec 이 assets/ 를 테마 파일로 싣는다)라서, 사진은
  # 테마 파일 자격으로 복사되고 exclude 는 테마 파일에 적용되지 않는다.
  # 그래서 배포 꾸러미에서 빼는 일은 pages-deploy.yml 의 빌드 직후 단계가 맡는다.
