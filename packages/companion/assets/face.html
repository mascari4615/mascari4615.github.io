<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>동반자</title>
<style>
  :root {
    --bg: #0d0f14;
    --glow: #6ee7ff;
    --face: #171b24;
    --edge: #2b3242;
    --ink: #e7ecf5;
    --dim: #6b7488;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  /* 방 한가운데 위에서 떨어지는 빛 하나. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 38%, rgba(110, 231, 255, 0.09), transparent 70%);
    pointer-events: none;
  }

  .room {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    justify-items: center;
    gap: 12px;
    padding: 20px 24px 24px;
  }

  .stage {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 8px;
    width: min(560px, 100%);
  }

  /* ── 채팅 내역 ────────────────────────────────────────── */
  .log {
    width: min(560px, 100%);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 4px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--edge) transparent;
    mask-image: linear-gradient(to bottom, transparent, #000 18px);
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }

  .line { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
  .line .who { font-size: 11px; color: var(--dim); letter-spacing: 0.03em; }
  .line .what {
    padding: 9px 13px;
    border-radius: 13px;
    border: 1px solid var(--edge);
    background: #14171f;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .line.me { align-self: flex-end; align-items: flex-end; }
  .line.me .what {
    background: #16232b;
    border-color: rgba(110, 231, 255, 0.28);
  }

  .line.them { align-self: flex-start; }

  /* 혼잣말 = 나한테 한 말이 아니다. 흐리게, 기울여서. */
  .line.alone .what {
    background: transparent;
    border-style: dashed;
    color: var(--dim);
    font-style: italic;
  }

  .log .empty {
    margin: auto;
    color: var(--dim);
    font-size: 13px;
  }

  /* ── 말풍선 ───────────────────────────────────────────── */
  .bubble {
    position: relative;
    max-width: 460px;
    padding: 14px 18px;
    border: 1px solid var(--edge);
    border-radius: 16px;
    background: rgba(23, 27, 36, 0.92);
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    opacity: 0;
    transform: translateY(8px) scale(0.97);
    transition: opacity 220ms ease, transform 220ms cubic-bezier(0.2, 1.3, 0.4, 1);
    pointer-events: none;
    min-height: 0;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    background: rgba(23, 27, 36, 0.92);
    border-right: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
    transform: rotate(45deg);
  }
  .bubble.on { opacity: 1; transform: translateY(0) scale(1); }

  /* ── 몸 ───────────────────────────────────────────────── */
  .field { position: relative; perspective: 700px; height: 200px; display: grid; place-items: center; }

  /* 3D 몸이 뜨면 큐브는 물러난다. 못 뜨면 큐브가 그대로 남는다. */
  .body3d { width: 100%; height: 100%; display: block; }
  .body3d[hidden] { display: none; }
  .cube.retired { display: none; }

  .cube {
    position: relative;
    width: 84px;
    height: 84px;
    transform-style: preserve-3d;
    animation: spin 14s linear infinite, breathe 3.4s ease-in-out infinite;
  }

  .cube > div {
    position: absolute;
    inset: 0;
    background: linear-gradient(150deg, var(--face), #10131a);
    border: 1px solid var(--edge);
    box-shadow: inset 0 0 24px rgba(110, 231, 255, 0.07);
  }
  .f  { transform: translateZ(42px); }
  .bk { transform: rotateY(180deg) translateZ(42px); }
  .r  { transform: rotateY(90deg) translateZ(42px); }
  .l  { transform: rotateY(-90deg) translateZ(42px); }
  .u  { transform: rotateX(90deg) translateZ(42px); }
  .d  { transform: rotateX(-90deg) translateZ(42px); }

  /* 앞면에만 있는 작은 빛 = 눈이 아니라 「켜져 있음」 표시. */
  .f::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 14px var(--glow);
    animation: blink 5.5s ease-in-out infinite;
  }

  .shadow {
    width: 90px;
    height: 12px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    filter: blur(7px);
    animation: shadowBreathe 3.4s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotateX(-18deg) rotateY(360deg); } }
  @keyframes breathe { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }
  @keyframes shadowBreathe { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(0.86); opacity: 0.35; } }
  @keyframes blink { 0%, 92%, 100% { opacity: 1; } 95% { opacity: 0.15; } }

  /* 듣는 중 — 이쪽으로 기울여 멈춘다. */
  .cube.listening { animation: lean 900ms ease-out forwards, breathe 2.2s ease-in-out infinite; }
  @keyframes lean { to { transform: rotateX(14deg) rotateY(-22deg); } }

  /* 생각 중 — 빨라지고 빛이 뛴다. */
  .cube.thinking { animation: spin 1.4s linear infinite, breathe 1.1s ease-in-out infinite; }
  .cube.thinking .f::after { animation: pulse 700ms ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; scale: 1; } 50% { opacity: 0.35; scale: 0.6; } }

  /* 말하는 중 — 말 리듬에 맞춰 튄다. */
  .cube.speaking { animation: spin 9s linear infinite, talk 260ms ease-in-out infinite; }
  @keyframes talk { 0%, 100% { translate: 0 -2px; scale: 1; } 50% { translate: 0 -13px; scale: 1.05; } }

  /* ── 입력 ─────────────────────────────────────────────── */
  form {
    display: flex;
    gap: 8px;
    width: min(560px, 100%);
    margin-top: 8px;
  }
  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--edge);
    background: #11141b;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 160ms ease;
  }
  input:focus { border-color: rgba(110, 231, 255, 0.55); }
  input::placeholder { color: var(--dim); }
  button {
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--edge);
    background: #11141b;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: border-color 160ms ease, color 160ms ease;
  }
  button:hover { border-color: rgba(110, 231, 255, 0.55); color: var(--glow); }
  button:disabled { opacity: 0.45; cursor: default; }

  #mic { padding: 0 14px; }
  #mic.listening {
    border-color: rgba(255, 110, 140, 0.7);
    color: #ff6e8c;
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 110, 140, 0.35); }
    50% { box-shadow: 0 0 0 7px rgba(255, 110, 140, 0); }
  }

  .grip {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 30px;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 14px;
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.3em;
    cursor: grab;
    user-select: none;
  }
  .grip:active { cursor: grabbing; }
  .grip-close {
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--dim);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }
  .grip-close:hover { border-color: var(--edge); color: #ff8098; }

  .mute {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 2;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: rgba(17, 20, 27, 0.8);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .mute:hover { border-color: rgba(110, 231, 255, 0.55); }

  .known-btn {
    position: fixed;
    top: 14px;
    right: 58px;
    z-index: 2;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: rgba(17, 20, 27, 0.8);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .known-btn:hover { border-color: rgba(110, 231, 255, 0.55); }

  .voice-pick {
    position: fixed;
    top: 14px;
    right: 100px;
    z-index: 2;
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: rgba(17, 20, 27, 0.8);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .voice-pick:hover { border-color: rgba(110, 231, 255, 0.55); }

  .who-pick {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 2;
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: rgba(17, 20, 27, 0.8);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .who-pick:hover { border-color: rgba(110, 231, 255, 0.55); }

  /* 아래쪽 대화 자리에만 겹친다 — 좁은 창에서 큐브까지 덮으면 얘가 안 보인다. */
  .sheet {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 68px;
    z-index: 3;
    max-height: min(42vh, 260px);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: rgba(15, 18, 24, 0.97);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  /* `hidden` 은 브라우저가 display:none 으로 숨기는데, 아래에서 display 를 정하면
     그게 이겨서 숨겨지지 않는다. 접히는 것들은 이 줄이 있어야 실제로 접힌다. */
  .sheet[hidden], .grip[hidden] { display: none; }

  .sheet-head {
    padding: 12px 15px;
    border-bottom: 1px solid var(--edge);
    font-size: 13px;
    color: var(--glow);
    letter-spacing: 0.02em;
  }
  .sheet-body {
    padding: 13px 15px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.75;
    white-space: pre-wrap;
    color: var(--ink);
  }
  .sheet-foot {
    padding: 9px 15px 11px;
    border-top: 1px solid var(--edge);
    font-size: 11px;
    color: var(--dim);
  }

  .status {
    height: 18px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }

  /* 투명 모드 — 창 자체가 뚫린 창(데스크톱 앱)일 때. 바탕을 비우면 뒤가 그대로 보이고
     큐브·말풍선·대화만 공중에 뜬 것처럼 남는다. */
  :root.see-through, :root.see-through body { background: transparent; }
  :root.see-through body::before { display: none; }
  :root.see-through .log,
  :root.see-through .status { background: transparent; }
  :root.see-through .line .what,
  :root.see-through .bubble,
  :root.see-through input,
  :root.see-through button,
  :root.see-through .sheet {
    /* 도려낸 바탕 위에 뜨는 것들은 조금 더 진하게 — 안 그러면 글자가 읽히지 않는다. */
    background: rgba(13, 15, 20, 0.86);
    backdrop-filter: blur(6px);
  }
  :root.see-through .bubble::after { background: rgba(13, 15, 20, 0.86); }
  :root.see-through .cube > div { background: linear-gradient(150deg, #171b24, #10131a); }

  /* 화면 구석에 상주하는 좁은 창 — 큐브가 자리를 다 먹지 않게 줄인다. */
  @media (max-height: 720px) {
    .field { height: 132px; }
    .cube { width: 60px; height: 60px; }
    .f  { transform: translateZ(30px); }
    .bk { transform: rotateY(180deg) translateZ(30px); }
    .r  { transform: rotateY(90deg) translateZ(30px); }
    .l  { transform: rotateY(-90deg) translateZ(30px); }
    .u  { transform: rotateX(90deg) translateZ(30px); }
    .d  { transform: rotateX(-90deg) translateZ(30px); }
    .shadow { width: 66px; }
    .room { padding: 14px 14px 16px; gap: 8px; }
    .bubble { font-size: 14px; padding: 11px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cube, .cube.listening, .cube.thinking, .cube.speaking, .shadow, .f::after { animation: none !important; }
  }
</style>
</head>
<body>
  <!-- 창틀이 없는 창에서 붙잡고 옮길 자리. 데스크톱 앱일 때만 보인다. -->
  <div class="grip" id="grip" data-tauri-drag-region hidden>
    <span data-tauri-drag-region>⋯</span>
    <button class="grip-close" id="gripClose" title="닫기">✕</button>
  </div>
  <button class="mute" id="mute" title="목소리 켜기/끄기" aria-label="목소리 켜기/끄기">🔇</button>
  <button class="known-btn" id="knownBtn" title="나에 대해 아는 것">🧠</button>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head">이 사람에 대해 아는 것</div>
    <div class="sheet-body" id="knownBody">아직 아는 게 없다.</div>
    <div class="sheet-foot">대화가 쌓이면 오래된 쪽을 접어서 여기에 남긴다.</div>
  </div>
  <select class="who-pick" id="whoPick" title="누구로 있을지" hidden></select>
  <select class="voice-pick" id="voicePick" title="목소리 고르기" hidden></select>
  <audio id="player" hidden></audio>
  <div class="room">
    <div class="stage">
      <div class="bubble" id="bubble"></div>
      <div class="field">
        <canvas class="body3d" id="body3d" hidden></canvas>
        <div class="cube" id="cube">
          <div class="f"></div><div class="bk"></div>
          <div class="r"></div><div class="l"></div>
          <div class="u"></div><div class="d"></div>
        </div>
      </div>
      <div class="shadow"></div>
      <div class="status" id="status">가만히 있다</div>
    </div>

    <div class="log" id="log"><div class="empty">아직 나눈 말이 없다</div></div>

    <form id="form" autocomplete="off">
      <input id="text" placeholder="말 걸기…" />
      <button id="mic" type="button" title="눌러서 말하기">🎤</button>
      <button id="send" type="submit">↵</button>
    </form>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "/lib/three/build/three.module.js",
    "three/addons/": "/lib/three/examples/jsm/"
  }
}
</script>
<script>
  // 뚫린 창(데스크톱 앱)으로 떠 있으면 바탕을 비운다.
  const inDesktopWindow = typeof window.__TAURI__ !== 'undefined';
  if (inDesktopWindow || new URLSearchParams(location.search).get('t') === '1') {
    document.documentElement.classList.add('see-through');
  }
  if (inDesktopWindow) {
    // 창틀이 없으므로 붙잡을 자리와 닫는 단추를 직접 만든다.
    const grip = document.getElementById('grip');
    grip.hidden = false;
    document.body.style.paddingTop = '26px';
    document.getElementById('gripClose').addEventListener('click', () => {
      window.__TAURI__.window.getCurrentWindow().close();
    });
  }

  const cube = document.getElementById('cube');
  const bubble = document.getElementById('bubble');
  const status = document.getElementById('status');
  const form = document.getElementById('form');
  const text = document.getElementById('text');
  const send = document.getElementById('send');
  const log = document.getElementById('log');

  let idleTimer = null;

  /* ── 목소리 ─────────────────────────────────────────────
     브라우저에 내장된 음성을 쓴다 — 키도, 서버도, 네트워크도 필요 없다.
     소리는 기본으로 꺼둔다: 소리가 갑자기 나오는 건 무례하다. */
  const mute = document.getElementById('mute');
  let voiceOn = localStorage.getItem('companion.voice') === 'on';
  let koVoice = null;

  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    koVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
  }
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;

  function renderMute() {
    mute.textContent = voiceOn ? '🔊' : '🔇';
  }
  renderMute();

  mute.addEventListener('click', () => {
    voiceOn = !voiceOn;
    localStorage.setItem('companion.voice', voiceOn ? 'on' : 'off');
    if (voiceOn === false) { speechSynthesis.cancel(); player.pause(); }
    renderMute();
  });

  /* 서버가 만들어 준 자연스러운 목소리를 먼저 쓰고, 안 되면 브라우저 내장으로 물러선다.
     이 컴퓨터에 깔린 한국어 목소리는 옛날 것 하나뿐이라 로봇처럼 들리기 때문이다. */
  const player = document.getElementById('player');
  const voicePick = document.getElementById('voicePick');
  let serverVoices = [];
  let chosenVoice = localStorage.getItem('companion.voiceId') || '';

  function speakBuiltIn(message) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(message);
    if (koVoice) utter.voice = koVoice;
    utter.lang = 'ko-KR';
    utter.rate = 1.02;
    speechSynthesis.speak(utter);
  }

  /* 문장이 여러 개 이어질 수 있으므로 줄 세워 차례로 읽는다 — 뒤 문장이 앞 문장을
     끊어버리면 말이 뚝뚝 끊긴다. */
  let speechQueue = Promise.resolve();

  function speakAloud(message, queued) {
    if (voiceOn === false) return;
    const job = () => playOne(message);
    speechQueue = queued ? speechQueue.then(job, job) : (player.pause(), job());
  }

  async function playOne(message) {
    if (voiceOn === false) return;
    if (serverVoices.length === 0) { speakBuiltIn(message); return; }
    try {
      const url = '/voice?text=' + encodeURIComponent(message) + (chosenVoice ? '&v=' + encodeURIComponent(chosenVoice) : '');
      const res = await fetch(url);
      if (res.ok === false) { speakBuiltIn(message); return; }
      const blob = await res.blob();
      speechSynthesis.cancel();
      if (player.src) URL.revokeObjectURL(player.src);
      player.src = URL.createObjectURL(blob);
      await player.play();
      // 이 소리가 끝나야 다음 문장을 읽는다.
      await new Promise((done) => {
        player.onended = done;
        player.onerror = done;
      });
    } catch {
      speakBuiltIn(message);
    }
  }

  async function loadVoices() {
    try {
      serverVoices = await (await fetch('/voices')).json();
    } catch {
      serverVoices = [];
    }
    if (serverVoices.length === 0) return;
    if (chosenVoice === '') chosenVoice = serverVoices[0].id;
    voicePick.hidden = false;
    voicePick.innerHTML = '';
    for (const v of serverVoices) {
      const option = document.createElement('option');
      option.value = v.id;
      option.textContent = v.label + ' · ' + v.gender;
      if (v.id === chosenVoice) option.selected = true;
      voicePick.append(option);
    }
  }

  voicePick.addEventListener('change', () => {
    chosenVoice = voicePick.value;
    localStorage.setItem('companion.voiceId', chosenVoice);
    // 고른 즉시 한 번 들려준다 — 안 들어보고는 못 고른다.
    const previous = voiceOn;
    voiceOn = true;
    speakAloud('응, 이 목소리로 할게.');
    voiceOn = previous;
  });

  function append(who, message, kind) {
    log.querySelector('.empty')?.remove();
    const line = document.createElement('div');
    line.className = 'line ' + kind;
    const label = document.createElement('div');
    label.className = 'who';
    label.textContent = who;
    const body = document.createElement('div');
    body.className = 'what';
    body.textContent = message;
    line.append(label, body);
    log.append(line);
    // 이미 위로 올려 읽는 중이면 방해하지 않는다.
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  async function loadHistory() {
    try {
      const entries = await (await fetch('/history')).json();
      for (const entry of entries) {
        if (entry.role === 'sensed' && entry.channel === 'web') append('나', entry.text, 'me');
        else if (entry.role === 'said') append(entry.channel === 'web' ? '동반자' : '동반자 (혼잣말)', entry.text, entry.channel === 'web' ? 'them' : 'them alone');
        // 시계 tick 자체(느낀 것)는 대화가 아니라 배경이므로 안 그린다.
      }
      log.scrollTop = log.scrollHeight;
    } catch {
      // 지난 대화를 못 불러와도 새 대화는 된다.
    }
  }

  function setState(state, label) {
    cube.className = 'cube' + (state ? ' ' + state : '') + (body3d !== null ? ' retired' : '');
    status.textContent = label;
    body3d?.setMood(state);
  }

  /* ── 말이 만들어지는 대로 ─────────────────────────────────
     다 만들어질 때까지 기다리면 몇 초 동안 아무 일도 안 일어나는 것처럼 보인다.
     조각이 오는 대로 말풍선과 대화 내역에 채우고, 문장이 끝나면 그 문장부터 소리낸다. */
  let streamLine = null;
  let spokenUpTo = 0;

  function streamInto(soFar, channel) {
    if (streamLine === null) {
      log.querySelector('.empty')?.remove();
      streamLine = document.createElement('div');
      streamLine.className = 'line ' + (channel !== 'web' ? 'them alone' : 'them');
      const label = document.createElement('div');
      label.className = 'who';
      label.textContent = channel === 'screen' ? '동반자 (화면을 보고)' : channel !== 'web' ? '동반자 (혼잣말)' : '동반자';
      const body = document.createElement('div');
      body.className = 'what';
      streamLine.append(label, body);
      log.append(streamLine);
      spokenUpTo = 0;
    }
    streamLine.querySelector('.what').textContent = soFar;
    bubble.textContent = soFar;
    bubble.classList.add('on');
    setState('speaking', '말하는 중');
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
    if (nearBottom) log.scrollTop = log.scrollHeight;

    // 문장이 끝난 데까지만 소리낸다 — 반 토막 문장을 읽으면 어색하다.
    const done = /^[\s\S]*[.!?…。！？\n]/.exec(soFar.slice(spokenUpTo));
    if (done && done[0].trim().length > 6) {
      const sentence = done[0].trim();
      spokenUpTo += done[0].length;
      speakAloud(sentence, true);
    }
  }

  function say(message) {
    bubble.textContent = message;
    bubble.classList.add('on');
    setState('speaking', '말하는 중');
    // 흘러나오는 동안 이미 읽은 부분은 다시 읽지 않는다.
    const rest = message.slice(spokenUpTo).trim();
    if (streamLine !== null) {
      streamLine = null;
      if (rest !== '') speakAloud(rest, true);
      spokenUpTo = 0;
      return;
    }
    spokenUpTo = 0;
    clearTimeout(idleTimer);
    // 말이 길수록 오래 떠 있는다 — 읽을 시간을 준다.
    const holdMs = Math.min(20000, 2500 + message.length * 90);
    idleTimer = setTimeout(() => {
      bubble.classList.remove('on');
      setState('', '가만히 있다');
    }, holdMs);
  }

  const events = new EventSource('/events');
  events.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'heard') {
      setState('thinking', '생각하는 중…');
    } else if (data.type === 'looking') {
      setState('looking', '내 화면을 보는 중…');
    } else if (data.type === 'partial') {
      streamInto(data.soFar, data.channel);
    } else if (data.type === 'speak') {
      const alone = data.channel !== 'web';
      const who = data.channel === 'screen' ? '동반자 (화면을 보고)' : alone ? '동반자 (혼잣말)' : '동반자';
      // 흘러나오는 중이었다면 그 줄이 이미 화면에 있다 — 또 붙이지 않는다.
      if (streamLine === null) append(who, data.text, alone ? 'them alone' : 'them');
      else streamLine.querySelector('.what').textContent = data.text;
      say(data.text);
    }
  };
  events.onerror = () => setState('', '연결이 끊겼다 — 서버 확인');

  text.addEventListener('focus', () => {
    if (cube.classList.contains('thinking') === false && cube.classList.contains('speaking') === false) {
      setState('listening', '듣는 중');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = text.value.trim();
    if (message === '') return;
    text.value = '';
    send.disabled = true;
    append('나', message, 'me');
    setState('thinking', '생각하는 중…');
    try {
      await fetch('/say', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: message }),
      });
    } finally {
      send.disabled = false;
      text.focus();
    }
  });

  /* ── 나에 대해 아는 것 ─────────────────────────────────── */
  const knownBtn = document.getElementById('knownBtn');
  const sheet = document.getElementById('sheet');
  const knownBody = document.getElementById('knownBody');

  knownBtn.addEventListener('click', async () => {
    if (sheet.hidden === false) { sheet.hidden = true; return; }
    sheet.hidden = false;
    knownBody.textContent = '읽는 중…';
    try {
      const { known } = await (await fetch('/known')).json();
      knownBody.textContent = known && known.trim() !== '' ? known : '아직 아는 게 없다.';
    } catch {
      knownBody.textContent = '지금은 못 읽었다.';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sheet.hidden = true;
  });

  // 딴 데를 건드리면 닫힌다 — 열어둔 걸 잊고 얘를 가리고 있는 일이 없게.
  document.addEventListener('pointerdown', (e) => {
    if (sheet.hidden) return;
    if (sheet.contains(e.target) || knownBtn.contains(e.target)) return;
    sheet.hidden = true;
  });

  /* ── 귀 ────────────────────────────────────────────────
     브라우저에 있는 받아쓰기를 쓴다. 얼굴과 입만 있고 귀가 없으면 대화가 아니다.
     말을 마치면 알아서 보낸다 — 다 말하고 버튼을 또 누르게 만들지 않는다. */
  const mic = document.getElementById('mic');
  const Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;

  // 데스크톱 창에서도 단축키가 듣게 하려면, 브라우저 받아쓰기가 없어도 이 자리는 살아야 한다.
  if (inDesktopWindow) {
    window.__TAURI__.event.listen('companion://talk', () => { void toggleListening(); });
  }

  if (Recognizer === undefined) {
    mic.disabled = true;
    mic.title = '받아쓰기를 준비하는 중…';
  } else {
    recognizer = new Recognizer();
    recognizer.lang = 'ko-KR';
    recognizer.interimResults = true;
    recognizer.continuous = false;

    recognizer.onstart = () => { listening = true; mic.classList.add('listening'); setState('listening', '듣는 중'); };
    recognizer.onend = () => { listening = false; mic.classList.remove('listening'); };
    recognizer.onerror = (e) => {
      listening = false;
      mic.classList.remove('listening');
      setState('', e.error === 'not-allowed' ? '마이크가 막혀 있다' : '못 알아들었다');
    };
    recognizer.onresult = (e) => {
      let heard = '';
      let settled = false;
      for (const result of e.results) {
        heard += result[0].transcript;
        if (result.isFinal) settled = true;
      }
      text.value = heard;
      if (settled && heard.trim() !== '') form.requestSubmit();
    };

    if (inDesktopWindow) mic.title = '눌러서 말하기 (어디서든 Ctrl+Alt+Space)';
  }

  mic.addEventListener('click', () => { void toggleListening(); });

  /* 오프라인 받아쓰기가 있으면 그쪽을 쓴다 — 인터넷도 필요 없고 창이 앞에 없어도 된다.
     없으면 브라우저 받아쓰기로 물러선다. */
  let offlineEars = false;
  let offlineListening = false;

  async function toggleListening() {
    if (offlineEars) { await toggleOffline(); return; }
    if (recognizer === null) return;
    if (listening) { recognizer.stop(); return; }
    try { recognizer.start(); } catch { /* 이미 켜져 있으면 무시 */ }
  }

  async function toggleOffline() {
    const where = offlineListening ? '/ears/stop' : '/ears/start';
    const starting = offlineListening === false;
    offlineListening = starting;
    mic.classList.toggle('listening', starting);
    setState(starting ? 'listening' : 'thinking', starting ? '듣는 중' : '받아적는 중…');
    try {
      const res = await fetch(where, { method: 'POST' });
      if (res.ok === false) throw new Error('실패');
      if (starting === false) {
        const { text } = await res.json();
        if (text === null || String(text).trim() === '') setState('', '아무 말도 안 들렸다');
      }
    } catch {
      offlineListening = false;
      mic.classList.remove('listening');
      setState('', '못 들었다');
    }
  }

  async function probeEars() {
    try {
      const { offline } = await (await fetch('/ears')).json();
      offlineEars = offline === true;
      if (offlineEars) {
        mic.disabled = false;
        mic.title = '눌러서 말하기 — 오프라인 받아쓰기' + (inDesktopWindow ? ' (어디서든 Ctrl+Alt+Space)' : '');
      }
    } catch {
      offlineEars = false;
    }
  }

  /* ── 누구로 있을지 ─────────────────────────────────────
     인격은 고정이 아니다. 폴더에 파일을 하나 더 넣으면 후보가 하나 는다. */
  const whoPick = document.getElementById('whoPick');

  async function loadWho() {
    try {
      const { list, current } = await (await fetch('/characters')).json();
      if (!Array.isArray(list) || list.length === 0) return;
      whoPick.hidden = false;
      whoPick.innerHTML = '';
      for (const name of list) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        if (name === current) option.selected = true;
        whoPick.append(option);
      }
    } catch {
      // 못 읽으면 고르는 자리를 안 띄운다 — 지금 인격 그대로 간다.
    }
  }

  whoPick.addEventListener('change', async () => {
    const name = whoPick.value;
    try {
      const res = await fetch('/characters/switch?name=' + encodeURIComponent(name), { method: 'POST' });
      if (res.ok) setState('', `${name} 이(가) 됐다`);
    } catch {
      setState('', '못 바꿨다');
    }
  });

  /* ── 3D 몸 ─────────────────────────────────────────────
     모델이 뜨면 큐브를 물리고, 못 뜨면 큐브가 그대로 남는다. */
  let body3d = null;

  async function loadBody() {
    try {
      const { mountModel } = await import('/model.js');
      const canvas = document.getElementById('body3d');
      canvas.hidden = false;
      body3d = await mountModel(canvas, '욘', (e) => {
        console.warn('3D 몸을 못 세웠다:', e);
        canvas.hidden = true;
      });
      if (body3d !== null) cube.classList.add('retired');
      else canvas.hidden = true;
    } catch (e) {
      console.warn('3D 몸을 못 불렀다:', e);
    }
  }

  // 커서를 따라 아주 조금 몸을 돌린다.
  window.addEventListener('pointermove', (e) => {
    body3d?.lookAt((e.clientX / innerWidth) * 2 - 1);
  });

  loadHistory();
  loadVoices();
  loadWho();
  probeEars();
  loadBody();
  text.focus();
</script>
</body>
</html>
