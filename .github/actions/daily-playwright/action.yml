name: 오늘의 앱 브라우저 채비
description: >
  `apps/daily` 는 의존성 0 인 앱이라 브라우저를 그때그때 받아 쓴다. 그 판 번호가 워크플로 세
  곳에 **여섯 번** 손으로 적혀 있었다. 받는 곳과 쓰는 곳의 번호가 갈리면 검사는 없는
  브라우저를 열다 죽는다(같은 모양으로 KarmoLab 이 25판 연속 죽은 적이 있다). 번호는 한 곳에 둔다.

inputs:
  version:
    description: 쓸 playwright 판 (받는 것과 무는 것이 같아야 한다)
    required: false
    default: '1.62.1'

outputs:
  entry:
    description: 검사에게 넘길 playwright 자리 (DAILY_PLAYWRIGHT)
    value: node_modules/playwright/index.js

runs:
  using: composite
  steps:
    - name: 브라우저 내려받기
      shell: bash
      run: npx --yes playwright@${{ inputs.version }} install --with-deps chromium

    # 검사는 이웃 앱(apps/karmolab)의 playwright 를 빌려 쓰는데 여기엔 그게 없다.
    # 방금 받은 것과 **같은 판**을 여기 깔아 둔다. 이 두 줄이 갈라지면 안 되는 그 자리다.
    - name: 검사가 무는 자리에도 같은 판
      shell: bash
      working-directory: apps/daily
      run: npm i --no-save playwright@${{ inputs.version }}
