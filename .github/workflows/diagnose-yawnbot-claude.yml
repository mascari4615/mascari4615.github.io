name: Diagnose YawnBot Claude CLI (KAR-018-Y)

# prod (laptop) claude CLI exits 1 -> producer/worker 0 -> team not alive.
# Cannot reproduce from desktop -> instrument prod (self-hosted = laptop).
# Dump real claude behavior + nssm service account (decisive). Read-only.
# ASCII-ONLY script: GH Actions writes BOM-less .ps1; PS5.1 on Korean
# Windows reads it cp949 -> Korean chars corrupt -> parse error
# ("string missing terminator"). 2nd diag-workflow failure root. So no
# non-ASCII anywhere in the run block.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 8
    steps:
      - name: Diagnose claude and service account
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "===== [1] runner context ====="
          Write-Host "whoami      : $(whoami)"
          Write-Host "USERPROFILE : $env:USERPROFILE"
          Write-Host "USERNAME    : $env:USERNAME"
          Write-Host "COMPUTER    : $env:COMPUTERNAME"

          Write-Host ""
          Write-Host "===== [2] yawnbot-prod nssm service account (decisive) ====="
          $nssm = (Get-Command nssm.exe -ErrorAction SilentlyContinue).Source
          if (-not $nssm) {
            $g = Get-ChildItem "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($g) { $nssm = $g.FullName }
          }
          if ($nssm) {
            Write-Host "nssm: $nssm"
            Write-Host ("ObjectName  : " + (& $nssm get yawnbot-prod ObjectName 2>&1))
            Write-Host ("AppDirectory: " + (& $nssm get yawnbot-prod AppDirectory 2>&1))
            Write-Host ("AppEnvExtra : " + (& $nssm get yawnbot-prod AppEnvironmentExtra 2>&1))
          } else { Write-Host "nssm.exe not found" }

          Write-Host ""
          Write-Host "===== [3] claude CLI path / version / cred files ====="
          $claude = (Get-Command claude -ErrorAction SilentlyContinue).Source
          Write-Host "claude path : $claude"
          Write-Host ("claude ver  : " + (& claude --version 2>&1))
          $credPaths = @(
            "C:\Users\masca\.claude\.credentials.json",
            "C:\Users\masca\.claude.json",
            "C:\Windows\System32\config\systemprofile\.claude\.credentials.json",
            "C:\Windows\SysWOW64\config\systemprofile\.claude\.credentials.json"
          )
          foreach ($p in $credPaths) {
            Write-Host ("exists? {0,-66} = {1}" -f $p, (Test-Path $p))
          }

          Write-Host ""
          Write-Host "===== [4] exact discovery invocation (PS5.1-safe) ====="
          $cwd = Join-Path $env:TEMP ("yb-diag-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $cwd -Force | Out-Null
          $inF = Join-Path $cwd "in.txt"
          $outF = Join-Path $cwd "out.txt"
          $errF = Join-Path $cwd "err.txt"
          Set-Content -Path $inF -Value 'reply with the single word ok' -Encoding UTF8
          $argList = @('--print','--no-session-persistence','--strict-mcp-config','--disallowedTools','Bash Edit Write Read NotebookEdit Glob Grep Task WebFetch WebSearch')
          $exe = if ($claude) { $claude } else { 'claude' }
          try {
            $proc = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory $cwd -NoNewWindow -PassThru -RedirectStandardInput $inF -RedirectStandardOutput $outF -RedirectStandardError $errF
            $ok = $proc.WaitForExit(120000)
            if (-not $ok) { $proc.Kill(); Write-Host "TIMEOUT 120s" }
            Write-Host ("EXIT   : " + $proc.ExitCode)
          } catch {
            Write-Host ("START-FAIL : " + $_.Exception.Message)
          }
          Write-Host ("STDOUT : " + (Get-Content $outF -Raw -ErrorAction SilentlyContinue))
          Write-Host ("STDERR : " + (Get-Content $errF -Raw -ErrorAction SilentlyContinue))
          Remove-Item -Recurse -Force $cwd -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== [5] verdict ====="
          Write-Host "ObjectName=LocalSystem/non-masca + creds only under masca + EXIT!=0 => service-account has no claude OAuth (fix via service account or CLAUDE_CONFIG_DIR)"
          Write-Host "EXIT=0 => claude fine; root is elsewhere (env/PATH/timeout) - re-trace"
