name: Diagnose cloudflared-prod (LocalSystem service child exit)

# TASK-YB-006 sub-A — cloudflared 공식 service install 후 child cloudflared.exe 즉시 exit
# (service Stopped + connector 0) 원인 5 axis 진단을 한 워크플로 run 으로 capture.
#
# 학습 배경: TASK-YB-005 ζ 가 5회 fail 후 별 TASK 분리 (TASK-YB-006). #25608419760 의
# fail mode (service install OK + sc start exit 1056 ALREADY RUNNING + 직후 service Stopped)
# 가 본 진단의 표적.
#
# 5 axis (TASK-YB-006 § 핵심 미해결):
#   A1. service ImagePath — install 시 어떤 args 박혔나
#   A2. cert/cred/config 파일 ACL — LocalSystem read 권한 있나
#   A3. cloudflared 버전 (현재 2025.8.1, 권장 2026.3.0)
#   A4. Event Log — service crash 시 SCM/Application 무슨 메시지
#   A5. dry run (--loglevel debug) — config parse / connector 등록 직전 무슨 stderr
#
# Runner: 노트북 self-hosted (label: yawnbot). gha-runner-yawnbot 이 NSSM 으로
# LocalSystem 컨텍스트 실행 중이므로 본 워크플로 자체가 LocalSystem 컨텍스트 dry run.
#
# Idempotent: 진단만. 상태 변경 없음 (sc start 1회 시도 외).

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5

    steps:
      - name: A0. Runner identity + cloudflared 버전
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          # Runner 가 LocalSystem 인지 확인 — 본 워크플로의 모든 step 이 그 컨텍스트
          Write-Host "=== Runner identity ==="
          Write-Host "whoami: $(whoami)"
          Write-Host "USERNAME env: $env:USERNAME"
          Write-Host "USERPROFILE env: $env:USERPROFILE"
          Write-Host "TEMP: $env:TEMP"

          # cloudflared 버전 (A3)
          Write-Host ""
          Write-Host "=== cloudflared 버전 (A3) ==="
          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) {
            Write-Host "cloudflared.exe NOT FOUND"
          } else {
            Write-Host "Path: $cf"
            # 버전 출력은 stderr 로 가는 cloudflared 가 있어 RedirectStandardError 별 file
            $verOut = "$env:TEMP\cf-version-stdout.txt"
            $verErr = "$env:TEMP\cf-version-stderr.txt"
            $p = Start-Process -FilePath $cf -ArgumentList '--version' -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $verOut -RedirectStandardError $verErr
            Write-Host "Exit: $($p.ExitCode)"
            Write-Host "Stdout:"
            if (Test-Path $verOut) { Get-Content $verOut | ForEach-Object { Write-Host "  $_" } }
            Write-Host "Stderr:"
            if (Test-Path $verErr) { Get-Content $verErr | ForEach-Object { Write-Host "  $_" } }
          }

      - name: A1. Service ImagePath + 상태 snapshot
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== Get-Service cloudflared ==="
          $svc = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if ($svc) {
            $svc | Format-List Name,Status,StartType,DisplayName
          } else {
            Write-Host "Service NOT FOUND"
          }

          Write-Host ""
          Write-Host "=== sc.exe qc cloudflared (ImagePath + start config) (A1) ==="
          # sc.exe stdout 은 native exe — 2>&1 wrapping 회피. Out-Host 로 그대로 흘림
          $qcOut = "$env:TEMP\sc-qc-cloudflared.txt"
          $p = Start-Process -FilePath 'sc.exe' -ArgumentList 'qc','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $qcOut
          if (Test-Path $qcOut) { Get-Content $qcOut | ForEach-Object { Write-Host $_ } }

          Write-Host ""
          Write-Host "=== sc.exe queryex cloudflared (현재 상태 + PID) ==="
          $qxOut = "$env:TEMP\sc-queryex-cloudflared.txt"
          $p = Start-Process -FilePath 'sc.exe' -ArgumentList 'queryex','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $qxOut
          if (Test-Path $qxOut) { Get-Content $qxOut | ForEach-Object { Write-Host $_ } }

          Write-Host ""
          Write-Host "=== cloudflared 프로세스 ==="
          $procs = Get-Process cloudflared -ErrorAction SilentlyContinue
          if ($procs) {
            $procs | Format-Table Id,ProcessName,StartTime,Path -AutoSize
          } else {
            Write-Host "(none)"
          }

      - name: A2. cert/cred/config 파일 + ACL
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $candidates = @(
            "C:\Windows\System32\config\systemprofile\.cloudflared",
            "C:\ProgramData\Cloudflare\cloudflared",
            "C:\Users\masca\.cloudflared"
          )

          foreach ($dir in $candidates) {
            Write-Host "=== ${dir} ==="
            if (-not (Test-Path $dir)) {
              Write-Host "  (없음)"
              continue
            }
            $items = Get-ChildItem $dir -ErrorAction SilentlyContinue
            if (-not $items) {
              Write-Host "  (디렉토리 비어있음)"
              continue
            }
            foreach ($item in $items) {
              Write-Host "  - $($item.Name) ($($item.Length) bytes)"
              $acl = Get-Acl $item.FullName -ErrorAction SilentlyContinue
              if ($acl) {
                Write-Host "    Owner: $($acl.Owner)"
                foreach ($a in $acl.Access) {
                  Write-Host "    ACE: $($a.IdentityReference) $($a.AccessControlType) $($a.FileSystemRights)"
                }
              }
            }
            Write-Host ""
          }

      - name: A4. Event Log — Service Control Manager + cloudflared
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== System log: Service Control Manager (cloudflared 만), 최근 24h ==="
          $since = (Get-Date).AddHours(-24)
          try {
            $scmEvents = Get-WinEvent -FilterHashtable @{
              LogName = 'System'
              ProviderName = 'Service Control Manager'
              StartTime = $since
            } -ErrorAction Stop |
              Where-Object { $_.Message -match 'cloudflared' } |
              Select-Object -First 50
            if ($scmEvents) {
              foreach ($e in $scmEvents) {
                Write-Host "--- $($e.TimeCreated) [$($e.LevelDisplayName)] EventId=$($e.Id) ---"
                Write-Host $e.Message
                Write-Host ""
              }
            } else {
              Write-Host "(매치 0)"
            }
          } catch {
            Write-Host "Get-WinEvent 실패: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "=== Application log: cloudflared* provider, 최근 24h ==="
          try {
            $appEvents = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = $since
            } -ErrorAction Stop |
              Where-Object { $_.ProviderName -match 'cloudflared' -or $_.Message -match 'cloudflared' } |
              Select-Object -First 50
            if ($appEvents) {
              foreach ($e in $appEvents) {
                Write-Host "--- $($e.TimeCreated) [$($e.LevelDisplayName)] $($e.ProviderName) EventId=$($e.Id) ---"
                Write-Host $e.Message
                Write-Host ""
              }
            } else {
              Write-Host "(매치 0)"
            }
          } catch {
            Write-Host "Get-WinEvent 실패: $($_.Exception.Message)"
          }

      - name: A5. Dry run (LocalSystem 컨텍스트, --loglevel debug, 8s timeout)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          # 본 step 자체가 LocalSystem 컨텍스트 (gha-runner-yawnbot NSSM service).
          # cloudflared 가 service 로 install 됐을 때와 같은 컨텍스트 = 같은 home,
          # 같은 ACL, 같은 PATH. 단 service 가 아닌 직접 실행이라 stderr capture 가능.

          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) { Write-Host "cloudflared.exe 못 찾음 — skip"; exit 0 }

          # config 후보 (A2 와 일치)
          $configCandidates = @(
            "C:\Windows\System32\config\systemprofile\.cloudflared\config.yml",
            "C:\ProgramData\Cloudflare\cloudflared\config.yml",
            "C:\Users\masca\.cloudflared\config.yml"
          )

          foreach ($cfgPath in $configCandidates) {
            Write-Host "================================================================"
            Write-Host "=== Dry run with --config $cfgPath ==="
            Write-Host "================================================================"
            if (-not (Test-Path $cfgPath)) {
              Write-Host "(config 없음 — skip)"
              continue
            }

            $stdout = "$env:TEMP\cf-dryrun-$([guid]::NewGuid().ToString('N')).out"
            $stderr = "$env:TEMP\cf-dryrun-$([guid]::NewGuid().ToString('N')).err"

            $p = Start-Process -FilePath $cf `
              -ArgumentList '--config', $cfgPath, '--loglevel', 'debug', 'tunnel', 'run', 'yawnbot-prod' `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            # 8초 dry run — connector 등록 / 즉시 exit 둘 다 보임
            $waited = 0
            while (-not $p.HasExited -and $waited -lt 8) {
              Start-Sleep -Seconds 1
              $waited++
            }

            if (-not $p.HasExited) {
              Write-Host "(8s 후 살아있음 — kill — connector 등록 OK 신호)"
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
              Start-Sleep -Seconds 1
            } else {
              Write-Host "(즉시 exit, exit code = $($p.ExitCode), $waited s)"
            }

            Write-Host ""
            Write-Host "--- stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout | Select-Object -First 200 | ForEach-Object { Write-Host $_ } }
            Write-Host ""
            Write-Host "--- stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr | Select-Object -First 200 | ForEach-Object { Write-Host $_ } }
            Write-Host ""
          }

      - name: 결과 요약
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          Write-Host "==============================================================="
          Write-Host "TASK-YB-006 sub-A 진단 완료. 위 step 결과 axis 별 매핑:"
          Write-Host "  A0 = Runner identity + 버전"
          Write-Host "  A1 = ImagePath"
          Write-Host "  A2 = ACL"
          Write-Host "  A4 = Event Log"
          Write-Host "  A5 = Dry run (LocalSystem 컨텍스트)"
          Write-Host ""
          Write-Host "→ TASK-YB-006 § 핵심 미해결 axis 의 의심 후보 1~5 매칭 후"
          Write-Host "  sub-B (설계 결정) 진입."
          Write-Host "==============================================================="
