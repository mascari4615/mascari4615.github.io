name: Agent Team Graduate

# LT 워커 Draft PR 자동 졸업 — TASK-KAR-018-LT-RENAME R-5 (구 TASK-KAR-073 부활).
#
# 역사: 2026-05-20 slot C 가 sweeper(autopilot 자동 PR 생성기) 폐기와 함께
#       graduate 까지 도매금 폐기(0d27ce54). sweeper 폐기는 정합(autopilot
#       skill 제거 = 생성자 사라짐). graduate 폐기는 과보수 — LT 워커는
#       무한 PR 생성기가 아니라 매 cycle 1건 유한 의도 PR. 본 파일은
#       graduate 의 substrate 재부활 + LT 워커 정체성 정합 rename.
#
# 갭: claude.yml § claude-pr-review 는 Draft PR 을 리뷰+fix 하지만 머지 스텝이 없고,
#     auto-merge.yml 은 `if: draft == false` 라 Draft 를 영구 skip → LT 워커 Draft 무한 적재.
# 해결: verify 또는 Claude 워크플로 완료를 workflow_run 으로 받아, 두 조건
#       (PR head 에 verify green check-run + claude-pr-review 리뷰 코멘트) 이 *모두*
#       충족된 LT 워커 Draft 를 ready 전환 + squash merge.
#
# 순서 무관(idempotent): verify 와 claude-pr-review 는 병렬이라 어느 쪽이 늦든
#   "마지막에 끝난 쪽"의 workflow_run 이 양 조건을 재평가 → clean PR(fix commit 없어
#   재-verify 안 도는 케이스)도 영구 stuck 안 됨. 이미 merged/ready 면 가드가 skip.
#
# 화이트리스트 = head_branch prefix (author 무관, spoof 불가):
#   - `feature/agent-team-*` (LT 워커 정본 prefix — task-/도메인-suffix 양쪽 수용)
#   - `fix/issue-*` / `feature/issue-*` (claude.yml § claude-triage 자동 fix PR)
#
# PAT 사용 (GITHUB_TOKEN 아님): GITHUB_TOKEN 머지는 GitHub 재귀 방지로 master push
# event 를 차단 → pages-deploy.yml / verify.yml 미작동. auto-merge.yml 과 동일 사유.
# 정본: memo/tasks/TASK-KAR-018-LT-RENAME / memo/rules/git.md § Agent Team 예외.

on:
  workflow_run:
    workflows: ["verify", "Claude Code"]
    types: [completed]
  workflow_dispatch:
    # 수동 일괄 졸업 — graduate 비활성화 기간 쌓인 Draft PR 복구용.
    # 활성화 후 GitHub UI: Actions → Agent Team Graduate → Run workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  graduate:
    # pull_request 발 run 만 (push 발 verify 는 PR 무관) — 노이즈 축소.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # 로컬 composite action 사용 위해 checkout (workflow_run = 기본브랜치 master 체크아웃).
      - uses: actions/checkout@v4

      - name: Resolve merge token (App → PAT fallback)
        # 단일 정본 = .github/actions/resolve-merge-token (auto-merge.yml 와 공유, KL-048).
        id: tok
        uses: ./.github/actions/resolve-merge-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.PAT_FOR_AUTO_MERGE }}

      - name: Resolve PR + guards + ready + merge
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          pr=$(gh pr list --head "$HEAD_BRANCH" --state open \
                --json number,isDraft,headRefName,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "branch '$HEAD_BRANCH' 에 open PR 없음 — skip"; exit 0
          fi

          num=$(echo "$pr"       | jq -r '.number')
          isDraft=$(echo "$pr"   | jq -r '.isDraft')
          headRef=$(echo "$pr"   | jq -r '.headRefName')
          headOid=$(echo "$pr"   | jq -r '.headRefOid')

          # 가드 1 — Draft 만 졸업 대상 (ready = auto-merge.yml 담당)
          if [ "$isDraft" != "true" ]; then
            echo "PR #$num not draft — auto-merge.yml 담당, skip"; exit 0
          fi
          # 가드 2 — head_branch prefix 화이트리스트 (author spoof 불가)
          case "$headRef" in
            feature/agent-team-*|fix/issue-*|feature/issue-*) ;;
            *) echo "PR #$num head '$headRef' = 화이트리스트 prefix 아님 — skip"; exit 0 ;;
          esac
          # 가드 3 (구 가드 4) — *현재 PR head commit* 에 verify green check-run (stale verify 자동 배제).
          #   claude-pr-review 코멘트 가드 폐기 (KAR 2026-06-07): claude.yml 이 review 코멘트를
          #   안 남겨 영구 데드락 → Draft PR 적층. verify(master invariant) green 이 단일 품질 게이트.
          verify_ok=$(gh api "repos/${GH_REPO}/commits/${headOid}/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name=="verify (master invariant)" and .conclusion=="success")] | length')
          if [ "${verify_ok:-0}" -lt 1 ]; then
            echo "PR #$num — head $headOid 에 성공한 verify check-run 없음 — verify 완료 시 재평가, skip"
            exit 0
          fi

          echo "PR #$num: verify green + 화이트리스트 prefix Draft → 졸업 (ready + squash merge)"
          gh pr ready "$num"
          gh pr merge "$num" --squash --delete-branch

  batch_graduate:
    # workflow_dispatch 수동 일괄 졸업 — 화이트리스트 prefix PR(draft·ready 모두) 중 verify green 전부 처리.
    # graduate 비활성화 기간 쌓인 PR 복구 등 수동 실행 시 사용.
    # draft=false(ready) PR 도 포함: auto-merge.yml 비활성화 기간 중 ready 전환됐으나 머지 안 된 PR 구제.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve merge token (App → PAT fallback)
        id: tok
        uses: ./.github/actions/resolve-merge-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.PAT_FOR_AUTO_MERGE }}

      - name: Batch graduate all eligible PRs (draft + ready)
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # draft·ready 가리지 않고 화이트리스트 prefix 전부 수집.
          # isDraft==true 만 선택하면 auto-merge 비활성화 기간 중 ready 전환된 PR 을 놓침.
          gh pr list --state open \
            --json number,isDraft,headRefName,headRefOid \
            --jq '[.[] | select(.headRefName | test("^(feature/agent-team-|fix/issue-|feature/issue-)"))]' \
            > /tmp/prs.json

          count=$(jq 'length' /tmp/prs.json)
          echo "화이트리스트 prefix PR ${count}개 검사 (draft+ready 포함)"

          if [ "$count" -eq 0 ]; then
            echo "졸업 대상 PR 없음"; exit 0
          fi

          for i in $(seq 0 $((count - 1))); do
            num=$(jq -r ".[$i].number" /tmp/prs.json)
            headRef=$(jq -r ".[$i].headRefName" /tmp/prs.json)
            headOid=$(jq -r ".[$i].headRefOid" /tmp/prs.json)
            isDraft=$(jq -r ".[$i].isDraft" /tmp/prs.json)

            verify_ok=$(gh api "repos/${GH_REPO}/commits/${headOid}/check-runs" --paginate \
              --jq '[.check_runs[] | select(.name=="verify (master invariant)" and .conclusion=="success")] | length')
            if [ "${verify_ok:-0}" -lt 1 ]; then
              echo "PR #$num ($headRef) — verify green 아님, skip"
              continue
            fi

            echo "PR #$num ($headRef): verify green → 졸업 (ready + squash merge)"
            # draft 인 경우만 ready 전환 (ready PR 에 gh pr ready 호출 시 에러 방지).
            if [ "$isDraft" = "true" ]; then
              gh pr ready "$num"
            fi
            gh pr merge "$num" --squash --delete-branch
          done
