name: Auto Merge

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      # 로컬 composite action 사용 위해 checkout 필요 (.github/actions/*).
      - uses: actions/checkout@v4

      - name: Resolve merge token (App → PAT fallback)
        # 단일 정본 = .github/actions/resolve-merge-token (TASK-KL-048).
        # App secret 있으면 App 토큰(만료 0), 없으면 PAT, 둘 다 없으면 ::error::.
        id: tok
        uses: ./.github/actions/resolve-merge-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.PAT_FOR_AUTO_MERGE }}

      - name: Enable auto-merge
        # GITHUB_TOKEN 아닌 App/PAT — GitHub 재귀방지로 GITHUB_TOKEN 머지는
        # master push event 차단 → pages-deploy.yml / verify.yml 자동 미작동.
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GH_REPO: ${{ github.repository }}
