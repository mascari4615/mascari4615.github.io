name: "daily 표 새로 받기"

# 왜 있나 (TASK-KAR-202)
#
# 표는 조용히 낡는다. 새 챔피언·새 캐릭터가 나와도 우리 표는 그대로라, 그 이름은
# 자동완성에도 없고 정답으로도 안 나온다 — 사람은 「낡은 사이트」로 읽고 떠나는데
# 우리는 아무 신호도 못 받는다. 받아오는 도구(npm run fetch:all)는 진작 있었지만
# **아무 데서도 안 불렸다.** 안 불리는 도구는 없는 것과 같다.
#
# 왜 하필 이 시각인가: 항목 수가 바뀌면 그날 이후의 정답 순서가 통째로 다시 섞인다
# (순열이 항목 수를 씨앗으로 쓴다). 한낮에 갈아끼우면 이미 두던 사람의 답이 바뀐다.
# 그래서 한국 시각 자정 직후에만 돈다 — 그 시각엔 두던 사람이 거의 없다.
#
# 안 되면 커밋을 접는다. 표가 이상하게 줄었으면(원본이 반쪽만 답한 경우) 여기서 멈추고,
# 실행이 빨갛게 남는다. 초록인데 아무것도 안 바뀐 것 = 새 챔피언이 없었다는 뜻이라 정상.

on:
  schedule:
    # UTC 15:10 = 한국 월요일 00:10
    - cron: '10 15 * * 1'
  workflow_dispatch:

concurrency:
  group: daily-table-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 표를 새로 받는다
        working-directory: apps/daily
        run: npm run fetch:all

      - name: 바뀐 크기가 넘겨도 되는지 본다
        working-directory: apps/daily
        run: npm run check:refresh

      - name: 규칙 시험 + 페이지 생성
        working-directory: apps/daily
        run: npm run build

      # 그림 하나가 죽으면 그게 정답인 날 실루엣 판이 통째로 안 풀린다.
      # 여기서만 전수로 본다 — 평소 검사는 표본만 본다(수천 장은 매번 보기엔 무겁다).
      - name: 그림이 다 살아 있는지 본다
        working-directory: apps/daily
        run: npm run check:images

      - name: 브라우저 설치
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: 새 표로 한 판씩 둬 본다
        working-directory: apps/daily
        env:
          DAILY_PLAYWRIGHT: node_modules/playwright/index.js
        run: |
          npm i --no-save playwright@1.62.1
          node scripts/smoke.mjs

      # 공유 카드에 항목 수가 적혀 있다 ("1,025개 중 하나") — 표가 바뀌면 카드도 낡는다.
      - name: 공유 카드 다시 만든다
        working-directory: apps/daily
        # 앞 단계가 여기 node_modules 에 깔아 둔 playwright 를 쓴다 — 이웃 앱(karmolab)은 CI 에 없다.
        env:
          DAILY_PLAYWRIGHT: node_modules/playwright/index.js
        run: npm run gen:og

      - name: 바뀌었으면 넘긴다
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- apps/daily/data apps/daily/img/og; then
            echo '바뀐 게 없다 — 새로 나온 것이 없었다는 뜻이다.'
            exit 0
          fi
          git add apps/daily/data apps/daily/img/og
          git commit -m 'chore(daily): 표를 새로 받았다 (자동, 한국 시각 자정 직후)' -m '새 챔피언·새 캐릭터가 나와도 표가 그대로면 그 이름은 자동완성에도 없고 정답으로도 안 나온다. 주 1회 스스로 받아 온다.'
          # 사람이 그 사이에 밀어 넣었을 수 있다 — 부딪히면 위로 얹고 다시 민다.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "다시 시도 ${i}"
            sleep 5
          done
          echo '세 번 다 밀려났다'
          exit 1
