name: verify

# master invariant 단일 게이트.
# 모든 검증 = `npm run verify` (scripts/verify.mjs) + typos step.
# branch protection 의 required status check 로 `verify (master invariant)` 등록 필요 (사용자 GitHub UI 액션).
#
# 폐기 흡수:
#   - ai-quality.yml (karmolab-ai-surface, shared-ai-package-build → verify build)
#   - code-quality.yml (typos → 본 워크플로 step, 빈 lint 잡 → verify lint)
#   - karmolab-ts.yml (typecheck → verify build 가 포함)
#   - karmolab-tauri.yml (cargo check → verify cargo check)
#
# 정본 룰: memo/UMBRELLA.md § 자동화 가능 룰은 코드로.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 응급 manual trigger — KL-029 (PAT) 미해결 / Auto Merge 우회 등으로 master push
  # event 미발동 시점에 사용자/자동화가 master 검증 강제 호출 (`gh workflow run verify.yml --ref master`).
  # KL-029 해결 후엔 push trigger 정상 작동 → 본 trigger 는 응급 가치만 남음.
  workflow_dispatch:
  # ★ 「폭풍 속에서도 한 판은 끝까지 본다」 (2026-08-10, 실측으로 붙임).
  #   최근 verify 13 판 중 **12 판이 취소**였다. 세션 6개가 1~2분 간격으로 master 에 밀면
  #   아래 cancel-in-progress 가 앞판을 계속 접어서, 활동 시간 내내 **완주하는 판이 0**이 된다.
  #   그 사이 typecheck 빨강이 몇 시간씩 살아 있었다(세션 버스 실측) — 검사가 있는데 안 도는 상태다.
  #   취소 자체는 옳다(낡은 커밋 결과는 아무도 안 본다). 모자란 건 **바닥**이다:
  #   주기 실행은 push 와 **다른 concurrency 그룹**이라 접히지 않고, 그래서
  #   「최신 master 는 늦어도 23분 안에 한 번은 끝까지 검증된다」가 구조적으로 참이 된다.
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: read

# ★ 같은 브랜치의 앞 검사는 취소한다 (2026-08-07).
#   verify 는 한 판에 평균 4분이고, 세션들이 몇 분 간격으로 master 에 밀어 실행이 겹겹이 쌓인다.
#   낡은 커밋의 결과는 아무도 안 보므로 최신 것만 돌면 된다 — 배포(pages)와 달리 **끊어도 안전한
#   검사**라 여기서는 cancel-in-progress 를 켠다(배포 쪽은 일부러 꺼 둔 것과 대비).
#   ★ 주기 실행만 따로 세운다 — 같은 그룹에 두면 push 가 그것마저 접어 바닥이 사라진다.
concurrency:
  group: verify-${{ github.event_name == 'schedule' && 'nightwatch' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  verify:
    name: verify (master invariant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/karmolab/package-lock.json
            packages/karmolab-ai/package-lock.json
            apps/blog/package-lock.json
            packages/karmolab-mcp/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri / WebKit / ALSA)
        # libasound2-dev: cpal=0.15 → alsa-sys v0.3.1 build 의존 (2026-05-10 부터 verify 16+ 회 fail 원인).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/karmolab-tauri/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/karmolab-tauri/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install karmolab deps
        run: cd apps/karmolab && npm ci

      - name: Install karmolab-ai deps
        run: cd packages/karmolab-ai && npm ci

      - name: Install karmolab-mcp deps
        run: cd packages/karmolab-mcp && npm ci

      # `apps/karmolab` 이 `file:../../packages/badapple` 로 물고 있다. 그 패키지는 **타입을
      # 빌드해야 생긴다** — CI 는 새 체크아웃이라 `dist` 가 없고, 그러면 typecheck 이
      # 「모듈을 못 찾겠다」로 선다. 로컬에는 예전 `dist` 가 남아 있어 이 사고가 안 보였다
      # (전형적인 「내 기계에선 초록」). karmolab-ai 와 같은 대우를 해 준다.
      - name: Build badapple (apps/karmolab 이 타입을 물고 있다)
        run: cd packages/badapple && npm ci && npm run build

      - name: Install blog deps
        run: cd apps/blog && npm ci

      # 화면을 실제로 열어 보는 검사들(성능 예산·커버리지·뒷정리·쉬는가)이 build 체인에 있다.
      # `npm ci` 는 playwright 패키지만 깔고 **브라우저는 안 깐다** — 없으면 그 검사들이
      # 「못 돌림」으로 빠져서, 조용히 아무것도 안 재는 CI 가 된다 (TASK-KL-201).
      - name: Install chromium (화면 여는 검사용)
        run: cd apps/karmolab && npx playwright install --with-deps chromium

      - name: Build karmolab-ai
        run: cd packages/karmolab-ai && npm run build

      - name: Build karmolab-mcp
        run: cd packages/karmolab-mcp && npm run build

      - name: Build karmolab
        run: cd apps/karmolab && npm run build

      - name: Run verify (master invariant)
        run: npm run verify

      - name: Typos check
        # strict 게이트 (TASK-KL-032). _typos.toml 이 false-positive 정의 + 데이터/외부 라이브러리 exclude.
        # 진짜 typo 일 가능성 큰 단어들도 임시 false-positive 등록 — 점진 fix 는 KL-032 backlog.
        uses: crate-ci/typos@master

  contrast:
    # 테마별 「글씨가 안 보이는 자리」 전수 검사 (TASK-KL-090).
    # verify 본체와 분리 — 브라우저 설치가 필요하고, 실패해도 원인이 색 하나로 뚜렷하다.
    name: contrast (theme readability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/karmolab/package-lock.json
            packages/karmolab-ai/package-lock.json
            packages/karmolab-mcp/package-lock.json

      - name: Install karmolab deps
        run: cd apps/karmolab && npm ci

      - name: Install karmolab-ai deps
        run: cd packages/karmolab-ai && npm ci

      - name: Install karmolab-mcp deps
        run: cd packages/karmolab-mcp && npm ci

      # `apps/karmolab` 이 `file:../../packages/badapple` 로 물고 있다. 그 패키지는 **타입을
      # 빌드해야 생긴다** — CI 는 새 체크아웃이라 `dist` 가 없고, 그러면 typecheck 이
      # 「모듈을 못 찾겠다」로 선다. 로컬에는 예전 `dist` 가 남아 있어 이 사고가 안 보였다
      # (전형적인 「내 기계에선 초록」). karmolab-ai 와 같은 대우를 해 준다.
      - name: Build badapple (apps/karmolab 이 타입을 물고 있다)
        run: cd packages/badapple && npm ci && npm run build

      - name: Build karmolab-ai (karmolab build 가 이 dist 를 불러온다)
        run: cd packages/karmolab-ai && npm run build

      - name: Build karmolab-mcp (karmolab build 가 이 dist 를 불러온다)
        run: cd packages/karmolab-mcp && npm run build

      # 브라우저 내려받기는 매 실행 50초 넘게 먹는다(2026-08-07 실측: 54초).
      # 잠금파일이 그대로면 같은 버전이므로 캐시로 건너뛴다. 시스템 라이브러리(--with-deps)는
      # 캐시 대상이 아니라 매번 깔리지만 그쪽은 짧다.
      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/karmolab/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: cd apps/karmolab && npx playwright install --with-deps chromium

      - name: Build karmolab (검사는 빌드 결과물을 연다)
        run: cd apps/karmolab && npm run build

      # 도구가 실제로 그 일을 하는지 재는 시험 22개 (TASK-KL-088).
      # 브라우저가 있어야 도는 것들이라 `npm run build` 에서 뺐다 — build 는 브라우저 없는
      # verify 잡에서도 돌아야 한다. 브라우저를 깔아 둔 이 잡이 그 시험들을 맡는다.
      - name: Tool behavior tests (browser)
        run: cd apps/karmolab && npm run test:behavior

      # 크기·쓰임새 **드리프트** 는 여기서 본다 — 배포 길목이 아니다 (2026-08-09).
      #
      # 이것들은 기준선과 견주는 **래칫**이다. 「틀렸다」가 아니라 「기준선과 달라졌다」를
      # 말한다. 그런데 이 저장소는 여러 세션이 하루에도 수십 번 위젯을 새로 만들고 지운다 —
      # 정당한 성장에도 빨개진다. 그걸 배포 길목에 두면 **사이트 전체가 남의 정상 작업에
      # 멈춰 선다**(실제로 오늘 배포가 이걸로 죽었다: 새것 5·사라진 것 10·커진 것 6).
      #
      # 드리프트는 봐야 하되 **사람이 보는 자리**에서 봐야 한다. verify 가 빨개도 사이트는
      # 나간다. 기준선 옮기기 = `npm run audit:bundles -- --update` (커밋에 줄이 남는다).
      #
      # 반대로 `audit:boot`(첫 화면 절대 천장)은 배포 길목에 **그대로 둔다** — 그건 기준선이
      # 아니라 사람이 겪는 한계선이고, 넘으면 실제로 느려진 것이다.
      - name: Size / usage drift (ratchet)
        run: cd apps/karmolab && npm run audit:drift

      - name: Contrast sweep (light/dark)
        run: cd apps/karmolab && npm run test:contrast
