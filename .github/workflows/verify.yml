name: verify

# master invariant 단일 게이트.
# 모든 검증 = `npm run verify` (scripts/verify.mjs) + typos step.
# branch protection 의 required status check 로 `verify (master invariant)` 등록 필요 (사용자 GitHub UI 액션).
#
# 폐기 흡수:
#   - ai-quality.yml (karmolab-ai-surface, shared-ai-package-build → verify build)
#   - code-quality.yml (typos → 본 워크플로 step, 빈 lint 잡 → verify lint)
#   - karmolab-ts.yml (typecheck → verify build 가 포함)
#   - karmolab-tauri.yml (cargo check → verify cargo check)
#
# 정본 룰: memo/UMBRELLA.md § 자동화 가능 룰은 코드로.

on:
  push:
    branches: [master, main]
  # 응급 manual trigger — KL-029 (PAT) 미해결 / Auto Merge 우회 등으로 master push
  # event 미발동 시점에 사용자/자동화가 master 검증 강제 호출 (`gh workflow run verify.yml --ref master`).
  # KL-029 해결 후엔 push trigger 정상 작동 → 본 trigger 는 응급 가치만 남음.
  workflow_dispatch:
  # ★ 「폭풍 속에서도 한 판은 끝까지 본다」 (2026-08-10, 실측으로 붙임).
  #   최근 verify 13 판 중 **12 판이 취소**였다. 세션 6개가 1~2분 간격으로 master 에 밀면
  #   아래 cancel-in-progress 가 앞판을 계속 접어서, 활동 시간 내내 **완주하는 판이 0**이 된다.
  #   그 사이 typecheck 빨강이 몇 시간씩 살아 있었다(세션 버스 실측) — 검사가 있는데 안 도는 상태다.
  #   취소 자체는 옳다(낡은 커밋 결과는 아무도 안 본다). 모자란 건 **바닥**이다:
  #   주기 실행은 push 와 **다른 concurrency 그룹**이라 접히지 않고, 그래서
  #   「최신 master 는 늦어도 23분 안에 한 번은 끝까지 검증된다」가 구조적으로 참이 된다.
  #   ★ **23분마다 → 한 시간마다** (2026-08-13). 저 바닥은 push 판이 **취소되던** 시절에 붙였다.
  #   그 뒤 master push 는 판마다 제 그룹(sha)을 갖게 되어 더는 안 접힌다 — 커밋마다 판정이 남는다.
  #   그런데 바닥은 그대로 63판/일을 돌아, 세션 여섯이 미는 시간대에는 러너를 서로 뺏어
  #   **모든 판이 다 같이 느려졌다**(실측: 여섯 판이 30분 넘게 대기). 바닥은 「아무도 안 밀 때」를
  #   위한 것이므로 한 시간이면 충분하다. 미는 동안에는 커밋마다 도는 판이 이미 바닥이다.
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: read

# ★ 같은 브랜치의 앞 검사는 취소한다 (2026-08-07).
#   verify 는 세션들이 몇 분 간격으로 master 에 밀어 실행이 겹겹이 쌓인다.
#   ⚠ **이 아래 판단들이 딛고 선 「한 판 4분」은 더 이상 참이 아니다** (2026-08-16 실측:
#   마지막 36판 중앙값 **15.8분** · 최소 12.2 · 최대 23.9). 3분 간격으로 밀면 판이 다섯 겹까지
#   쌓이고 러너를 서로 뺏어 더 느려진다(실측: 11:01 에 시작한 판이 11:16 에 끝났다).
#   그래도 아래 「master 는 커밋마다 판정을 남긴다」를 뒤집지 않는다 — 접었을 때 초록이 0이 된
#   전례가 있다(2026-08-12). 다만 **전제가 바뀌었다는 사실은 적어 둔다**: 이 값이 20분을 넘기면
#   그때는 「무엇을 덜 돌릴까」(느린 검사를 라이브 판으로 옮기기)가 먼저지, 접기가 먼저가 아니다.
#   낡은 커밋의 결과는 아무도 안 보므로 최신 것만 돌면 된다 — 배포(pages)와 달리 **끊어도 안전한
#   검사**라 여기서는 cancel-in-progress 를 켠다(배포 쪽은 일부러 꺼 둔 것과 대비).
#   ★ 주기 실행만 따로 세운다 — 같은 그룹에 두면 push 가 그것마저 접어 바닥이 사라진다.
# ★ **손으로 부른 판은 접지 않는다** (2026-08-12).
#   push 레인은 최신 것만 보면 되니 접는 게 맞다. 그런데 `workflow_dispatch` 까지 같은 그룹에
#   묶여 있어, 「지금 결과가 보고 싶다」고 눌러 놓으면 다음 푸시가 그것을 취소했다 —
#   실측: 오늘 판정을 받으려고 부른 판이 그대로 cancelled 로 끝났다. 사람이 명시적으로 부른
#   실행이 조용히 사라지면 그 게이트는 「물어볼 수 없는 게이트」가 된다.
# ★ **master 는 커밋마다 판정을 남긴다** (2026-08-12, 실측으로 뒤집음).
#   위 규칙대로 접었더니 최근 master 판 40개가 **취소 29 · 빨강 13 · 초록 0** 이 되었다.
#   세션 여섯이 3분 간격으로 미는데 검사는 5분이라, 앞판은 늘 다음 push 에 접힌다 —
#   「최신 것만 보면 된다」가 성립하려면 최신 판이 끝까지 가야 하는데 그게 영영 안 온다.
#   그래서 master push 만 **판마다 제 그룹**(sha)을 갖고 접히지 않는다. 접는 것은 가지·PR 뿐이다.
#   비용: 판이 겹쳐 돈다. 그 값으로 「이 커밋이 초록인가」에 답할 수 있게 된다.
concurrency:
  group: >-
    verify-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightwatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master') && github.sha
      || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}

jobs:
  verify:
    name: verify (master invariant)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 멈춘 판이 6시간 도는 것을 막는다 (기본값 360분)
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/karmolab/package-lock.json
            packages/karmolab-ai/package-lock.json
            packages/karmolab-mcp/package-lock.json

      # 이번 판이 Rust 쪽을 건드렸나 — **서버에 물어본다**. 체크아웃이 얕아서
      # `git diff` 로는 옛 커밋이 없어 늘 「모른다」가 된다(그러면 늘 재게 되어 뜻이 없다).
      - name: Rust 쪽을 건드렸나
        id: tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "run=always" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          case "$before" in ''|0000000*) echo "run=always" >> "$GITHUB_OUTPUT"; exit 0;; esac
          files=$(gh api "repos/${{ github.repository }}/compare/$before...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null) || {
            echo "물어보지 못했다 — 그냥 잰다"; echo "run=always" >> "$GITHUB_OUTPUT"; exit 0; }
          if echo "$files" | grep -q '^apps/karmolab-tauri/'; then echo "run=always" >> "$GITHUB_OUTPUT";
          else echo "이번 판은 Rust 쪽을 안 건드렸다"; echo "run=skip" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Rust toolchain
        if: steps.tauri.outputs.run == 'always'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri / WebKit / ALSA)
        if: steps.tauri.outputs.run == 'always'
        # libasound2-dev: cpal=0.15 → alsa-sys v0.3.1 build 의존 (2026-05-10 부터 verify 16+ 회 fail 원인).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Cache Cargo
        if: steps.tauri.outputs.run == 'always'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/karmolab-tauri/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/karmolab-tauri/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ★ **짓기 전 채비는 한 곳에서** (2026-08-13). 배포·라이브 점검이
      #   같은 목록을 각자 들고 있다가 갈라졌다(mcp 가 배포에만 빠져 한 달 정체, badapple 이
      #   라이브 점검에만 빠져 25판 연속 빨강). Rust·블로그는 이 잡만 쓰므로 여기 남긴다.
      - uses: ./.github/actions/setup-karmolab
        with:
          node-version: '20'
          chromium: 'true'

      # blog npm(테마 툴체인)은 컷오버로 소멸 (change.blog-cutover) — Install blog deps 제거.

      # ★ **여기서 짓지 않는다** (2026-08-13). `npm run verify` 안에 `apps/karmolab build` 가
      #   그대로 들어 있다 — 이 단계를 따로 두면 **같은 빌드를 두 번** 한다(각 8~10분).
      #   한 판이 그렇게 두 배로 길어졌고, 여섯 판이 겹치면 판정이 아예 안 나왔다.
      #   브라우저는 채비 action 이 깔아 두므로 verify 안의 화면 검사들도 그대로 돈다.

      # ★ **Rust 쪽은 이번 push 가 건드렸을 때만 잰다** (2026-08-13, 실측).
      #   `cargo check` 는 캐시가 차면 20분이 넘고, 45분에 끊긴 판은 **캐시를 저장하지도
      #   못한다** — 다음 판도 차갑다. 그렇게 여섯 판이 나란히 돌며 서로 CPU 를 빼앗아
      #   오전 내내 **아무 판정도 안 나왔다**. Rust 는 며칠에 한 번 바뀌는데 값은 매 push 다.
      #   시계(nightwatch)로 부른 판은 `always` 라 늘 잰다 — 안 본 채 지나가는 날이 없게.
      - name: Run verify (master invariant)
        env:
          VERIFY_TAURI: ${{ steps.tauri.outputs.run }}
          # `audit:nightly-alive` 가 「밤에 굽는 워크플로가 실제로 초록이었나」를 물어본다.
          # 토큰이 없으면 그 검사는 「못 물어봤다」(2번)로 조용히 빠진다 — 그러면 뜻이 없다.
          GH_TOKEN: ${{ github.token }}
        run: npm run verify

      # ★ **두 번 시도한다** (2026-08-12). 이 단계는 검사 프로그램을 깃허브 릴리스에서 **내려받아**
      #   쓴다 — 그 내려받기가 실패해 exit 8 로 master 가 빨개졌다(코드에는 오타가 없었다).
      #   못 받은 것을 「오타가 있다」로 읽으면 안 되고, 그렇다고 넘기면 게이트가 사라진다.
      #   그래서 첫 판은 실패해도 넘기고, 곧바로 한 번 더 받아 본다 — 둘 다 실패하면 그때 빨강이다.
      - name: Typos check (1차)
        id: typos1
        continue-on-error: true
        # strict 게이트 (TASK-KL-032). _typos.toml 이 false-positive 정의 + 데이터/외부 라이브러리 exclude.
        # 진짜 typo 일 가능성 큰 단어들도 임시 false-positive 등록 — 점진 fix 는 KL-032 backlog.
        uses: crate-ci/typos@master

      - name: Typos check (다시)
        if: steps.typos1.outcome == 'failure'
        uses: crate-ci/typos@master

      # ★ **한 판으로 합쳤다** (2026-08-13). 이 셋은 `contrast` 라는 딴 잡에 있었는데, 그 잡은
      #   채비도 산출물 짓기도 처음부터 다시 했다 — push 마다 러너 자리를 하나 더 먹었다.
      #   세션 여섯이 미는 시간대에는 그 한 자리가 실제로 아팠다: 여섯 판이 30분 넘게
      #   **아무 판정도 못 내고** 줄만 서 있었다(2026-08-13 실측). 이 잡은 이미 브라우저를 깔고
      #   산출물을 다 지었으므로, 여기서 이어 돌리면 자리를 반으로 줄이고 검사는 그대로다.
      #   (`contrast (theme readability)` 라는 이름은 사라진다 — 필수 검사 이름은
      #    `verify (master invariant)` 하나다.)

      # 도구가 실제로 그 일을 하는지 재는 시험 22개 (TASK-KL-088). 브라우저가 있어야 돈다.
      - name: Tool behavior tests (browser)
        run: cd apps/karmolab && npm run test:behavior

      # 크기·쓰임새 **드리프트** 는 여기서 본다 — 배포 길목이 아니다 (2026-08-09).
      # 기준선과 견주는 **래칫**이라 정당한 성장에도 빨개진다. 배포 길목에 두면 사이트가
      # 남의 정상 작업에 멈춰 선다. verify 가 빨개도 사이트는 나간다.
      # 기준선 옮기기 = `npm run audit:bundles -- --update` (커밋에 줄이 남는다).
      - name: Size / usage drift (ratchet)
        run: cd apps/karmolab && npm run audit:drift

      # ★ **대비 훑기는 시계 판에서** (2026-08-13, 실측 294초 — 한 판에서 가장 긴 단계).
      #   이건 「글씨가 안 보이는 자리」를 전 화면에서 훑는 검사다. 색은 커밋마다 바뀌지 않고,
      #   빨개져도 사이트는 나간다(배포 길목이 아니다). 그런데 값은 **매 push** 5분이었고,
      #   그 5분이 판정 도착을 늦춰 오늘 오전 내내 아무 판정도 못 봤다.
      #   시계(nightwatch)·PR·수동에서는 그대로 돈다 — 한 시간 안에 반드시 한 번 걸린다.
      # ★ js/·css/ 산출물은 git 추적 밖이다 (TASK-KL-333) — 생 체크아웃에선 셸이 안 떠서
      #   대비 훑기가 CANNOT-RUN 으로 죽는다 (2026-08-23, 스케줄 3연속 빨강의 원인).
      #   화면을 여는 검사 앞에서는 먼저 굽는다.
      - name: Bake shell artifacts (js/css/i18n)
        if: ${{ github.event_name != 'push' }}
        run: cd apps/karmolab && npm run build:i18n && node build.mjs && npm run build:css

      - name: Contrast sweep (light/dark)
        if: ${{ github.event_name != 'push' }}
        run: cd apps/karmolab && npm run test:contrast
