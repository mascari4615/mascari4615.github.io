name: "KarmoLab 라이브 점검"

# 왜 따로 두는가 (TASK-KL-089)
#
# 도구 페이지에는 검사가 세 층 있다.
#   1) 위젯이 등록되는가        — `test:tools`   (배포 전, pages-deploy 안에서 이미 돈다)
#   2) 페이지를 열면 화면이 뜨는가 — `test:live`
#   3) 값을 넣으면 답이 나오는가   — `test:behavior`
# 그런데 2·3 은 **배포된 주소**를 열어 봐야 하므로 배포 전 빌드에 넣을 수 없었고, 그 결과
# 아무 데서도 안 돌고 있었다(손으로 부를 때만 도는 검사 = 없는 검사).
#
# 그래서 배포가 끝난 뒤에 따로 돈다. 배포 워크플로 자체는 건드리지 않는다 — 그쪽이 실패해도
# 이 점검은 독립적으로 결과를 남기고, 반대로 이 점검이 실패해도 배포를 되돌리지는 않는다.

on:
  # ★ **배포 꼬리를 뗐다** (2026-08-13, 게이트 수명 실측). 최근 25판이 **전부 건너뜀/취소**라
  #   이 검사는 「한 번도 판정된 적이 없다」 — 안 본 것이지 통과가 아니다.
  #   까닭: 배포가 몰리면 뒤 push 가 앞 배포를 취소시키는데, 이 판은 배포가 「성공」일 때만
  #   돌게 돼 있어 대부분 건너뛰고, 살아남은 판끼리는 서로를 접었다. 그렇게 슬롯만 태웠다.
  #   이 검사가 재는 것은 「이 배포」가 아니라 **지금 실사이트**다 — 시계만으로 충분하다.
  #   대신 간격을 반으로 줄인다(조각 셋으로 나눠 한 판이 6분이라 부담이 안 된다).
  #
  # ★ **주기가 판보다 짧으면 판이 밀린다** (2026-08-16 실측). 30분마다 걸어 뒀는데 한 판이
  #   실제로 44~68분 걸린다(13:37→14:21 · 11:51→12:59). `cancel-in-progress: false` 라 접지도
  #   않으니 판이 줄줄이 쌓여 러너가 사실상 쉬지 않았고, 나오는 판정은 늘 한두 시간 묵은 것이었다.
  #   자주 재는 것과 자주 아는 것은 다르다 — 주기는 **판 길이의 두 배 이상**이어야 한다.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      tools:
        description: "확인할 도구 id (비우면 전부)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write # 점검이 실패하면 이슈로 알린다 (아래 마지막 단계)

# 겹쳐 돌지 않는다 — 라이브는 하나뿐이므로 한 판이면 된다. 다만 **접지는 않는다**:
# 접힌 판은 판정을 안 남기고, 판정 없는 검사는 없는 검사다(그래서 25판 내리 판정이 0이었다).
concurrency:
  group: karmolab-live-check
  # 접지 않는다 — 접힌 판은 판정을 안 남기고, 판정 없는 검사는 없는 검사다.
  cancel-in-progress: false

jobs:
  check:
    # 재는 것은 「어느 배포」가 아니라 **지금 실사이트**다 — 그래서 배포 결과를 안 본다.
    runs-on: ubuntu-latest
    # ★ **셋이 나눠 든다** (2026-08-13). 서른여섯을 한 줄로 돌면 17분이 넘는데, 이 판은
    #   한 줄로 돌면 다음 시계 판과 겹칠 만큼 길다 — 실측 40판 중 25판이 판정을 못 냈다.
    #   판정이 안 나오는 검사는 없는 검사다. 나누는 규칙은 러너 안에 있다(`--shard 2/3`).
    #   한 조각이 빨개도 나머지는 끝까지 간다 — 그래야 「무엇이 빨간지」가 한 판에 다 보인다.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # 로컬에서 대비 3분·이름 2분·화면 2분이 걸린다. 라이브는 왕복이 붙어 더 느리므로 넉넉히 둔다.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/karmolab
    steps:
      - uses: actions/checkout@v4

      # ★ **짓기 전 채비는 한 곳에서** (2026-08-13, `.github/actions/setup-karmolab`).
      #   여기 서른 줄이 배포·verify·카모그래프 워크플로와 같은 내용을 각자 들고 있었다.
      #   한쪽만 고친 값이 실제 사고였다 — badapple 짓는 단계가 여기만 빠져 **25판 연속** 죽었다.
      - uses: ./.github/actions/setup-karmolab
        with:
          chromium: 'true'

      # ★ **검사 목록은 `scripts/live-checks.mjs` 하나뿐이다** (2026-08-13).
      #   예전에는 이 자리에 서른 줄 넘게 손으로 적혀 있었다. 그래서 내 컴퓨터에서 같은 순서를
      #   돌릴 방법이 없었고, 빨강 하나 볼 때마다 **밀고 10분을 기다렸다**(어젯밤 여섯 번 왕복).
      #   또 같은 전제를 배포 워크플로와 따로 들고 있다가 갈라져 25판 연속 죽은 적도 있다.
      #   이제 여기서도, `npm run verify:live` 에서도 **같은 파일**을 읽는다 — 갈라질 수가 없다.
      - name: 라이브 점검 (목록 = scripts/live-checks.mjs · 로컬은 npm run verify:live)
        env:
          BASE: https://blog.mascari4615.com
          TRIES: '12'
          WAIT_MS: '20000'
        run: npm run verify:live -- --shard ${{ matrix.shard }}

      # 조각마다 자기 빨강 이름을 남긴다 — 알리는 일은 아래 `report` 잡 하나가 맡는다.
      # (조각 셋이 각자 이슈를 열면 같은 빨강이 세 번 운다 — 늘 우는 경보는 꺼진 경보다.)
      - name: 빨간 검사 이름 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-red-${{ strategy.job-index }}
          path: apps/karmolab/live-check-red-*.txt
          if-no-files-found: ignore
          retention-days: 3

  # ★ **알리는 입은 하나** (2026-08-13). 조각 셋이 각자 이슈를 열고 닫으면 경보가 서로를
  #   덮어쓴다. 조각이 다 끝난 뒤 이 잡 하나가 **전체 결론**을 보고 열거나 닫는다.
  report:
    needs: check
    # 조각들이 아예 안 돈 판(배포 실패 뒤 등)은 **판정이 없는 것**이지 빨강이 아니다 —
    # 여기서 안 걸러 내면 건너뛴 판마다 경보가 새로 운다.
    if: ${{ always() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 조각들이 남긴 빨강 모으기
        uses: actions/download-artifact@v4
        with:
          pattern: live-red-*
          path: reds
          merge-multiple: true

      # 배포 자체가 사람에게 닿고 있나 (TASK-KL-160).
      #
      # 위 검사들은 전부 「지금 실사이트가 성한가」를 본다 — 그런데 **올린 것이 실사이트까지
      # 못 가고 있는** 상태는 그 어느 검사에도 안 걸린다. 옛 판이 멀쩡히 서빙되고 있으면
      # 전부 초록이다. 실제로 2026-08-08 에 번들 하나가 한 시간 넘게 못 나갔는데 이 점검은
      # 내내 초록이었다.
      #
      # 판정은 **마지막 성공 뒤에 또 일어난 것**만 센다 — 이미 고친 병의 시체까지 세면
      # 늘 빨간 경보가 되고, 늘 빨간 경보는 꺼진 경보다.
      # gh 를 못 쓰는 상황이면 스스로 「못 돌았다(2)」로 끝내므로 여기서도 그것만 통과시킨다.
      - name: 올린 것이 실제로 배포되고 있는지
        id: health
        working-directory: apps/karmolab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run --silent audit:deploy -- --hours=6 || code=$?
          if [ "${code:-0}" = "2" ]; then echo "못 돌았다 — 통과도 실패도 아니다"; exit 0; fi
          exit "${code:-0}"

      # 여기까지 하나라도 빨갛다면 알려야 한다. 배포를 막지 않도록 만들었기 때문에,
      # 알리지 않으면 아무도 모른 채 지나간다 — 그러면 검사를 만든 뜻이 없다.
      #
      # ★ **경보에는 「무엇이」 빨간지 적는다** (2026-08-13). 예전 본문은 「로그의 단계 이름을
      #   보세요」 한 줄이라, 열어 봐도 아무것도 모르는 댓글이 **328개** 쌓였다. 그리고 같은
      #   빨강이 매시 새 댓글이 되니 아무도 안 읽는다 — 늘 우는 경보는 꺼진 경보다.
      #   이제 ① 빨간 검사 이름을 적고 ② 직전 댓글과 **같은 조합이면 또 적지 않는다**.
      - name: 실패하면 이슈로 알린다
        if: ${{ needs.check.result != 'success' || failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const NL = String.fromCharCode(10);
            const title = 'KarmoLab 라이브 점검 실패';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // 조각들이 남긴 빨강 이름을 모은다. 하나도 없으면 검사까지 못 간 것이다 — 그 사실을 적는다.
            let names = [];
            try {
              for (const f of fs.readdirSync('reds')) {
                if (!f.startsWith('live-check-red')) continue;
                names.push(...fs.readFileSync(`reds/${f}`, 'utf8').split(NL).map((x) => x.trim()).filter(Boolean));
              }
            } catch { /* 파일 없음 = 채비·빌드에서 엎어졌다 */ }
            names = [...new Set(names)].sort();
            const what = names.length
              ? names.map((n) => `- 실패: ${n}`).join(NL)
              : '- 검사 목록까지 못 갔다 (채비·빌드 단계에서 엎어졌거나 시간 초과)';
            const only = names.length === 1 ? ` -- --only "${names[0]}"` : '';
            const fingerprint = `<!-- red:${names.join('|') || 'PREP'} -->`;
            const body = [
              fingerprint,
              '**빨간 검사**',
              '',
              what,
              '',
              `로그: ${url}`,
              '',
              '내 컴퓨터에서 같은 것을 돌리려면: `cd apps/karmolab && npm run verify:live' + only + '`',
            ].join(NL);
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'karmolab-live-check'
            });
            const found = open.data.find((i) => i.title === title);
            if (!found) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['karmolab-live-check']
              });
              return;
            }
            // 같은 조합이 이미 맨 위에 적혀 있으면 침묵한다 — 새 소식일 때만 운다.
            const last = (await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number,
              per_page: 1, page: Math.max(1, found.comments || 1)
            })).data.pop();
            const prev = (last && last.body) || found.body || '';
            if (prev.includes(fingerprint)) {
              core.info(`같은 빨강이 이미 #${found.number} 에 적혀 있다 — 또 달지 않는다: ${names.join(', ') || 'PREP'}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body
            });

      # ★ **나으면 경보를 끈다** (2026-08-13). 여는 자리만 있고 닫는 자리가 없어서 이슈 #197 이
      #   328개 댓글을 달고 몇 달째 열려 있었다 — 「열려 있음」이 아무 뜻도 없어지면 경보는 죽는다.
      - name: 초록이면 경보를 닫는다
        if: ${{ needs.check.result == 'success' && success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const NL = String.fromCharCode(10);
            const title = 'KarmoLab 라이브 점검 실패';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'karmolab-live-check'
            });
            const found = open.data.find((i) => i.title === title);
            if (!found) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number,
              body: `라이브 점검이 전부 초록이라 닫는다.` + NL + NL + `로그: ${url}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, state: 'closed'
            });
