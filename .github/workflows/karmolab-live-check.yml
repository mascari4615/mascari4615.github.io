name: "KarmoLab 라이브 점검"

# 왜 따로 두는가 (TASK-KL-089)
#
# 도구 페이지에는 검사가 세 층 있다.
#   1) 위젯이 등록되는가        — `test:tools`   (배포 전, pages-deploy 안에서 이미 돈다)
#   2) 페이지를 열면 화면이 뜨는가 — `test:live`
#   3) 값을 넣으면 답이 나오는가   — `test:behavior`
# 그런데 2·3 은 **배포된 주소**를 열어 봐야 하므로 배포 전 빌드에 넣을 수 없었고, 그 결과
# 아무 데서도 안 돌고 있었다(손으로 부를 때만 도는 검사 = 없는 검사).
#
# 그래서 배포가 끝난 뒤에 따로 돈다. 배포 워크플로 자체는 건드리지 않는다 — 그쪽이 실패해도
# 이 점검은 독립적으로 결과를 남기고, 반대로 이 점검이 실패해도 배포를 되돌리지는 않는다.

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  # 배포 결과에만 매달면 **바쁠수록 안 돈다.** 여러 작업이 몰아치면 뒤 push 가 앞 배포를
  # 취소시키는데, 이 점검은 배포가 「성공」일 때만 돌게 돼 있었다 — 실측 40회 중 성공 5·취소 25.
  # 최근 20번 중 16번이 그렇게 건너뛰어졌고, 그 사이 실서비스에서 도구 셋이 몇 주간 죽어 있었다.
  # 이 검사가 재는 것은 「이 배포」가 아니라 **지금 실사이트**다. 배포가 취소돼도 사이트는
  # 살아 있고 깨져 있을 수 있으므로, 시간으로도 돈다.
  schedule:
    - cron: "17 * * * *" # 매시 17분 (정시 몰림 피함)
  workflow_dispatch:
    inputs:
      tools:
        description: "확인할 도구 id (비우면 전부)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write # 점검이 실패하면 이슈로 알린다 (아래 마지막 단계)

# ★ **겹쳐 돌지 않는다** (2026-08-12). 이 판은 매시 시계 + 배포마다 두 갈래로 불린다.
#   한 판이 17분이라 배포가 몰리는 시간대에는 서로 겹쳐, 같은 라이브를 여러 판이 동시에
#   재고 같은 이슈를 여러 번 연다. 라이브는 하나뿐이므로 **가장 나중 것 하나면 된다**.
concurrency:
  group: karmolab-live-check
  cancel-in-progress: true

jobs:
  check:
    # 배포가 성공했을 때만 의미가 있다. 실패한 배포 뒤에 도는 것은 옛 화면을 재는 셈이다.
    # 시각으로 부른 것은 배포와 무관하게 「지금 실사이트」를 재는 것이므로 배포 결과를 안 본다
    # (여기서 막으면 위에 넣은 시계가 무의미해진다).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # 로컬에서 대비 3분·이름 2분·화면 2분이 걸린다. 라이브는 왕복이 붙어 더 느리므로 넉넉히 둔다.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/karmolab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/karmolab/package-lock.json

      - name: 의존 설치
        run: npm ci --no-audit --no-fund

      # 브라우저 내려받기는 매 실행 50초 넘게 먹는다(2026-08-07 실측: 54초).
      # 잠금파일이 그대로면 같은 버전이므로 캐시로 건너뛴다. 시스템 라이브러리(--with-deps)는
      # 캐시 대상이 아니라 매번 깔리지만 그쪽은 짧다.
      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/karmolab/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 브라우저 준비
        run: npx playwright install --with-deps chromium

      # 여기 검사 중 몇 개는 **빌드 결과물**을 읽는다 (공유 카드 대조 등).
      # 그게 없으면 「js/widgets-lazy-meta.js 없음 — npm run build 를 먼저 돌려야 합니다」로
      # 멈춘다. 라이브를 보는 검사라 빌드가 필요 없다고 여겼는데, 라이브와 **대조할 기준**이
      # 빌드 산출물이었다 (2026-08-07: 다섯 판 연속 빨강의 두 원인 중 하나).
      # 앱은 공용 AI 꾸러미를 타입으로 쓴다. 그 꾸러미는 **지어져야** 형태가 생기는데 여기서는
      # 안 지었다 → 「karmolab-ai 를 못 찾겠다」로 타입 검사가 멈추고 → 아래 빌드가 통째로
      # 실패하고 → 뒤의 검사들이 전부 없는 기준과 대조하며 헛것을 쟀다.
      # (「대비 미달 648건」·「높이 기록 15건 낡음」은 진짜 문제가 아니라 그 부산물이었다.)
      - name: 공용 꾸러미 먼저 짓기
        working-directory: packages/karmolab-ai
        run: npm ci --no-audit --no-fund && npm run build

      # `apps/karmolab` 이 `file:../../packages/badapple` 로 물고 있다. 그 꾸러미는 **타입을
      # 지어야 생긴다** — 새 체크아웃엔 `dist` 가 없어서 typecheck 이 「모듈을 못 찾겠다」로 선다.
      # ★ verify.yml 은 2026-08-08 에 같은 이유로 이 단계를 넣었는데 **여기엔 안 들어왔다.**
      #   그래서 이 점검은 매 판 빌드 단계에서 죽었고(최근 25판 중 초록 0), 뒤 검사들은
      #   `if: always()` 때문에 **없는 기준과 대조하며 헛것을 쟀다**. 두 워크플로가 같은 전제를
      #   따로 들고 있으면 반드시 갈라진다 — 한쪽만 고친 값이 이 사고다.
      # ★ working-directory 를 반드시 적는다 — 이 job 의 defaults 가 `apps/karmolab` 라서
      #   `cd packages/badapple` 는 `apps/karmolab/packages/badapple` 을 찾다가 죽는다.
      #   (바로 위 karmolab-ai 단계가 같은 이유로 자기 자리를 적어 뒀다.)
      - name: badapple 도 먼저 짓기 (apps/karmolab 이 타입을 물고 있다)
        working-directory: packages/badapple
        run: npm ci --no-audit --no-fund && npm run build

      # `npm run build` 사슬 안의 `test:mcp` 가 이 꾸러미의 의존성(pdf-lib)을 여기서 찾는다.
      # 이 설치가 없어 「Cannot find module 'pdf-lib'」로 이 검사가 계속 섰다 (배포 잡도 같은 구멍이었다).
      - name: karmolab-mcp 의존 설치 (build 사슬의 test:mcp 가 문다)
        working-directory: packages/karmolab-mcp
        run: npm ci --no-audit --no-fund

      # ★ **대조 기준은 산출물이지 판정이 아니다** (2026-08-12).
      #   `npm run build` 를 부르면 게이트 31개가 딸려 온다 — verify 가 이미 돌린 그것이다.
      #   이 판이 17분 걸린 이유의 대부분이 그 재판정이었다(실측 평균 17분). 여기서 필요한 것은
      #   「지금 라이브와 견줄 산출물」뿐이므로 배포와 같은 `build:artifacts` 만 찍는다.
      - name: 대조 기준 만들기 (빌드 산출물 — 게이트는 verify 몫)
        run: npm run build:artifacts

      # GitHub Pages 는 배포 완료 신호 뒤에도 잠깐 옛 파일을 준다. 예전에는 45초를 그냥
      # 기다렸는데, 그건 **추측**이다 — 짧으면 옛 화면을 재고, 길면 그냥 느리다. 그리고 진짜
      # 사고(옛 판이 계속 서빙됨)는 아무리 기다려도 안 잡힌다.
      # 이제 빌드가 제 커밋을 표식 파일로 내놓으므로, **그 판이 실제로 서빙될 때까지** 묻는다.
      # 끝내 안 바뀌면 「올렸는데 사람 화면에는 안 닿았다」로 빨강 (TASK-KL-124).
      # 시각으로 부른 회차는 기대할 커밋이 없으므로 지금 서빙 중인 판만 알려 준다.
      - name: 올린 판이 실제로 서빙되는지
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIES: '12'
          WAIT_MS: '20000'
        run: node scripts/check-live-version.mjs

      # 부르는 이름이 하나라도 없으면 그 검사는 조용히 안 돈다. 0.2초라 맨 앞에 둔다.
      - name: 부르는 이름이 실제로 있는지
        run: npm run audit:scripts

      # WM 페이지 배선 (TASK-KL-161 에서 여기로 옮김).
      #
      # 원래 `npm run build` 안에 있었다. 그런데 그 페이지를 **만드는 중**이라 등록이 아직
      # 반쯤인 상태였고, 그 바람에 **모든 배포가 죽었다** — 사이트가 서른 걸음 뒤처졌다.
      # 만들다 만 새 페이지 하나 때문에 전원이 멈추는 것은 비대칭이다. 검사는 남기되
      # 배포를 막지 않는 자리로 옮긴다 (막는 자리가 답을 더 나쁘게 만들면 안 된다).
      - name: WM 페이지 배선이 이어져 있는지
        if: always()
        run: npm run audit:wm

      # 도구를 더할 때 같이 채워야 하는 것들(카드·자리·다른 이름). 파일만 읽어 0.1초다.
      - name: 도구마다 딸린 것이 채워졌는지
        if: always()
        run: npm run audit:data

      - name: 화면이 뜨는지 (전 도구)
        run: npm run test:live -- ${{ github.event.inputs.tools }}

      # 놀이는 붙인 조각이 많은데(표 고르기·라운드·진행·결과·그림) 빌드는 그중 **하나도**
      # 안 눌러 본다. 실주소에서 한 판을 끝까지 눌러 봐야 「배포는 초록인데 못 논다」가 잡힌다.
      - name: 이상형 월드컵 한 판이 실제로 끝나는지
        if: always()
        run: node scripts/smoke-worldcup.mjs

      # 오늘의 판(TASK-KL-194)은 첫 화면에서 **매일 달라지는 유일한 자리**다. 값은 각 놀이가
      # 브라우저에 남긴 것을 읽어 나오므로, 저장 모양이 하나만 어긋나도 단위 시험은 전부
      # 초록인데 화면은 영원히 「0 / 5」가 된다. 서버를 끊고 본다 — 로그인·노트북 없이도 떠야 한다.
      - name: 오늘의 판이 첫 화면에 뜨고 세는지
        if: always()
        run: npm run test:today

      # 자랑 카드는 **그림**이라 단위 시험으로는 「Blob 이 나왔다」까지밖에 못 본다.
      # 글꼴이 폴백으로 찍히거나 바탕이 검게 나가도 아무 검사도 안 걸린다 — 실제로 그려서
      # 크기·바탕색·글자 화소를 잰다 (TASK-KL-195).
      - name: 자랑 카드가 실제로 그려지는지
        if: always()
        run: npm run test:brag

      # 도감의 값은 **다른 곳에서 찍힌 도장**을 읽어 나온다(도구를 열 때 account.ts 가 찍는다).
      # 그 두 자리가 어긋나면 단위 시험은 초록인데 도감만 영원히 0칸이다 (TASK-KL-196).
      - name: 도감에 도장이 찍히는지
        if: always()
        run: npm run test:collection

      # 숨긴 것은 **사람의 손짓**으로만 열린다(키 순서·연타). 코드를 읽어서는 「눌리는가」를
      # 알 수 없고, 함수를 직접 부르는 시험은 정작 손짓이 안 걸리는 것을 못 잡는다.
      # 평소 쓰는 길을 막지 않는지(입력칸에서는 안 걸리는지)도 같이 본다 (TASK-KL-196 D).
      - name: 숨긴 것이 실제로 찾아지는지
        if: always()
        run: npm run test:secrets

      # 말로 부리기는 조각 셋이 이어져야 산다 — 팔레트의 빈 자리 → 누를 때 데려오는 조각
      # → 서버 답. 특히 그 조각은 **부르는 곳을 글자로 찾아** 만들어지므로, 부르는 모양이
      # 바뀌면 파일 자체가 안 만들어진다(실측 404). 서버 답은 가로채고 배선만 본다.
      - name: 말로 부리기가 도구까지 데려가는지
        if: always()
        run: npm run test:ask

      # 결과 카드는 **도구가 그린 모양**(.cc-stat)을 읽어서 산다. 그 모양이 바뀌거나 단추가
      # 안 붙으면 아무 시험도 안 깨지는데 사람은 아무것도 못 얻는다. 실제로 값을 넣고
      # 그림을 그려 화면과 같은 수가 찍히는지 본다 (TASK-KL-196 F).
      - name: 계산기 답이 그림 카드가 되는지
        if: always()
        run: npm run test:resultcard

      # 실황 줄은 **없을 때 안 보여야** 한다 — 빈 상자가 남으면 첫 화면에 「지금 0명」짜리
      # 죽은 띠가 생긴다. 그건 코드로는 확인이 안 된다 (TASK-KL-196 G).
      - name: 실황 줄이 있을 때만 뜨는지
        if: always()
        run: npm run test:live-line

      # 꾸미기는 **DOM 을 다시 배치하는 것**이라, 저장은 멀쩡한데 화면만 그대로인 길이 여럿이다
      # (블록 이름표가 빠지거나 조각이 안 오거나). 실제로 눌러서 순서가 바뀌는지 본다 (KL-196 H).
      - name: 첫 화면 꾸민 것이 남는지
        if: always()
        run: npm run test:homeprefs

      # 명령 팔레트는 앱 안에서 도구를 찾는 **유일한** 길이다 (TASK-KL-099). 여기가 죽으면
      # 화면은 멀쩡해 보이는데(입력칸은 그려지고 글자도 쳐진다) 목록만 안 뜬다 — 그러면
      # 160개짜리 드롭다운을 훑던 시절로 조용히 되돌아간다. 이 검사는 제 서버를 띄우므로
      # 배포 결과가 아니라 저장소의 지금 상태를 본다.
      - name: 명령 팔레트가 실제로 여닫히는지
        if: always()
        run: npm run test:palette

      # 팔레트가 바로 내놓는 답은 도구의 계산을 한 벌 더 갖는다 (TASK-KL-110). 두 곳이
      # 갈라지면 사용자는 **같은 질문에 두 답**을 받는다 — 아무 답도 안 주는 것보다 나쁘다.
      # 그래서 둘을 실제로 굴려 값을 맞대 본다.
      - name: 팔레트가 내놓는 답이 도구와 같은지
        if: always()
        run: npm run test:palette-answers

      # 목록 페이지는 검색으로 들어온 사람이 거치는 관문이고 크롤러가 도구 전체를 찾는 통로다.
      # 다른 검사는 상세 페이지만 봐서 여기가 비어도 몰랐다.
      - name: 도구 목록 페이지가 성한지
        if: always()
        run: npm run test:hub

      # 마스코트는 「부위 그림 + 값」이라 조용히 죽는 길이 많다 — 아틀라스 좌표가
      # 틀어져도 칸은 그대로 있고, 조각 이름 오타는 「표정이 안 바뀔 뿐」으로 지나간다.
      - name: 마스코트가 살아 있는지
        if: always()
        run: npm run test:mascot

      # 스크립트를 실행하지 않는 크롤러의 눈. 지금은 설명이 정적으로 박혀 있어 읽히는데,
      # 그 성질이 깨지면 검색 유입이 조용히 사라진다.
      - name: 스크립트 없이도 읽히는지
        if: always()
        run: npm run test:nojs

      # 미리 그려 둔 화면에 **손이 달리는지**. 안 달리면 도구는 보이는데 죽어 있다 —
      # 화면은 멀쩡해 보여서 위의 검사들은 전부 통과한다 (TASK-KL-135).
      - name: 미리 그린 화면에 손이 달리는지
        if: always()
        run: npm run test:hydration

      # 대표 주소·구조화 데이터·제목 겹침. 틀려도 화면은 멀쩡해 보이고, 검색에서만 조용히 사라진다.
      - name: 실제 사이트에 있어야 하는 것이 있는지
        if: always()
        run: npm run audit:live
      - name: 놀이 셋이 성한지
        if: always()
        working-directory: apps/karmolab
        run: node ../play/scripts/smoke.mjs
      - name: 검색엔진이 읽는 머리가 성한지
        if: always()
        run: npm run audit:seo

      # 도구가 들어갈 자리를 미리 비워 두는데, 도구 내용이 바뀌면 그 값이 조용히 낡는다.
      # 낡으면 도구가 뜰 때 아래 글이 다시 밀린다 — 화면은 멀쩡해 보인다.
      # 이 스크립트만 기본 주소가 「내 컴퓨터」다(평소엔 로컬 사본을 재니까). 여기서는 실제 사이트를 본다.
      - name: 비워 둔 자리가 실제와 맞는지
        if: always()
        run: npm run audit:heights
        env:
          BASE: https://blog.mascari4615.com

      # 앱으로 설치할 때 쓰는 정보. 아이콘이 아예 없고 시작 주소가 어긋나 있던 적이 있는데,
      # 눈에 안 띄는 자리라 오래 몰랐다.
      - name: 설치 정보가 성한지
        if: always()
        run: npm run test:pwa

      - name: 값을 넣으면 답이 나오는지
        if: always()
        run: npm run test:answers

      # 기대값을 손으로 적지 않고 넓게 보는 쪽 — 글자를 넣으면 화면이 바뀌는가.
      - name: 글자를 넣으면 반응하는지
        if: always()
        run: npm run test:typing

      # 아래 셋은 손으로 돌리는 묶음(audit-all)에는 있었는데 **여기에만 없었다** —
      # 즉 실제 사이트에서는 영영 안 돌고 있었다(audit:scripts 가 이걸 잡아 준다).
      # 셋 다 기본 주소가 라이브라 배포 후 확인용으로 만들어진 것이고, 실제로 돌려 보니
      # 전부 초록이었다(2026-08-08). 배선만 빠져 있었다.
      - name: 화면 다섯이 넓은 화면·폰에서 안 넘치는지
        if: always()
        run: npm run test:platform

      - name: 판본 대조가 도는지
        if: always()
        run: npm run test:pdfdiff

      - name: 타자 대결 한 바퀴가 도는지
        if: always()
        run: npm run test:ghosttype

      # 화면낭독기가 입력칸 이름을 읽을 수 있는지. 기준치는 data/a11y-baseline.json 이 정본이고
      # 지금은 0 이라, 이름 없는 칸이 하나라도 새로 생기면 여기서 걸린다.
      - name: 입력칸에 이름이 이어져 있는지
        if: always()
        run: npm run audit:labels

      # 테마를 바꿨을 때 흰 바탕에 흰 글씨가 되는 자리를 찾는다.
      # 이 검사도 만들어만 두고 아무 데서도 안 돌고 있었다.
      - name: 밝은 테마·어두운 테마에서 글씨가 보이는지
        if: always()
        run: npm run test:contrast

      # 도구를 추가하고 카드를 안 찍으면 그 도구만 조용히 공용 카드로 나간다.
      # 카드는 글꼴이 있는 개발 머신에서만 만들 수 있으므로 여기서 막지 않고 이름만 알린다.
      - name: 도구마다 공유 카드가 있는지
        if: always()
        run: npm run audit:cards

      # 카드에는 제목과 소개가 그려져 있다. 문구만 고치고 다시 안 찍으면 옛 글이 나가는데,
      # 파일이 있는지만 보는 위 검사로는 안 잡힌다. 그림 없이 파일 비교만 하므로 여기서도 돈다.
      - name: 안 쓰는데 첫 화면을 막는 스타일
        if: always()
        run: npm run audit:blocking-css
      - name: 후원 자리가 규칙대로 뜨는지
        if: always()
        run: npm run audit:sponsor
      - name: 공유 카드가 지금 문구와 맞는지
        if: always()
        run: npm run audit:cards:fresh

      # 바뀐 주소를 검색엔진에 **알린다** (IndexNow).
      # 도구 127장을 만들어 뒀는데 30일 검색 유입이 2건이었다 — 페이지는 성한데 알림이 없었다.
      # 배포로 부른 회차에만 보낸다: 시계로 부른 회차마다 보내면 안 바뀐 것을 되풀이해 보내는
      # 소음이 된다. 실패해도 배포·점검을 망치지 않게 계속 진행한다.
      - name: 바뀐 주소를 검색엔진에 알린다
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        working-directory: .
        run: node scripts/indexnow-submit.mjs

      # 배포 자체가 사람에게 닿고 있나 (TASK-KL-160).
      #
      # 위 검사들은 전부 「지금 실사이트가 성한가」를 본다 — 그런데 **올린 것이 실사이트까지
      # 못 가고 있는** 상태는 그 어느 검사에도 안 걸린다. 옛 판이 멀쩡히 서빙되고 있으면
      # 전부 초록이다. 실제로 2026-08-08 에 번들 하나가 한 시간 넘게 못 나갔는데 이 점검은
      # 내내 초록이었다.
      #
      # 판정은 **마지막 성공 뒤에 또 일어난 것**만 센다 — 이미 고친 병의 시체까지 세면
      # 늘 빨간 경보가 되고, 늘 빨간 경보는 꺼진 경보다.
      # gh 를 못 쓰는 상황이면 스스로 「못 돌았다(2)」로 끝내므로 여기서도 그것만 통과시킨다.
      - name: 올린 것이 실제로 배포되고 있는지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/audit-deploy-health.mjs --hours=6 || code=$?
          if [ "${code:-0}" = "2" ]; then echo "못 돌았다 — 통과도 실패도 아니다"; exit 0; fi
          exit "${code:-0}"

      # 여기까지 하나라도 빨갛다면 알려야 한다. 배포를 막지 않도록 만들었기 때문에,
      # 알리지 않으면 아무도 모른 채 지나간다 — 그러면 검사를 만든 뜻이 없다.
      # 같은 제목의 이슈가 열려 있으면 새로 만들지 않고 댓글만 단다(같은 말이 쌓이지 않게).
      - name: 실패하면 이슈로 알린다
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'KarmoLab 라이브 점검 실패';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `배포 뒤 점검에서 실패한 단계가 있습니다.\n\n로그: ${url}\n\n어떤 검사인지는 로그의 단계 이름을 보세요 — 화면·관문·스크립트 없이·동작·입력칸 이름·테마 대비·공유 카드.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'karmolab-live-check'
            });
            const found = open.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['karmolab-live-check']
              });
            }
