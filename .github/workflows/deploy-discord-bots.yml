name: Deploy Discord Bots (yawnbot)

# TASK-YB-002-C — yawnbot prod 자동 deploy.
# master push 시 self-hosted runner (노트북) 가 build + .env 주입 + nssm restart.
# pull_request_target 절대 사용 X (포크 PR RCE 경로).

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/discord-bots/apps/yawnbot/**'
      - 'apps/discord-bots/packages/**'
      - 'apps/discord-bots/package.json'
      - 'apps/discord-bots/package-lock.json'
      - 'packages/karmolab-ai/**'
      - '.github/workflows/deploy-discord-bots.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-discord-bots
  cancel-in-progress: false

jobs:
  deploy-yawnbot:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 15

    # 노트북의 prod 폴더 직접 사용 — actions/checkout 의 _work 폴더 X.
    # NSSM 이 보는 폴더 = build 폴더 = runner working dir. 통일.
    env:
      REPO_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io'
      BOTS_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io\apps\discord-bots'
      YAWNBOT_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io\apps\discord-bots\apps\yawnbot'

    steps:
      - name: Sync to origin/master (force)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.REPO_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          # LocalSystem (NSSM runner) 가 사용자 masca 의 폴더 git 소유권 인식 못 함 — safe.directory 등록 (idempotent)
          $repoUnix = '${{ env.REPO_DIR }}' -replace '\\', '/'
          & git config --global --add safe.directory $repoUnix 2>&1 | Out-Null
          & git switch master 2>&1 | Out-Null
          # NSSM prod 폴더는 deploy 전용 (사용자 작업 영역 X — 작업은 .worktrees/* 에서). dirty state 는 항상 잔재 (line ending 변환 / 이전 deploy 잔재 / 잘못 복사 등) — 강제 동기화로 폐기.
          # git pull --ff-only 는 working tree dirty 면 fail (yawnbot-defaults.txt CRLF 변환 사고 2026-05-09).
          & git fetch origin master 2>&1
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed (exit $LASTEXITCODE)" }
          & git reset --hard origin/master 2>&1
          if ($LASTEXITCODE -ne 0) { throw "git reset --hard failed (exit $LASTEXITCODE)" }
          & git clean -fd 2>&1 | Out-Null
          & git rev-parse --short HEAD

      - name: Sync prod memo (안전 — reset 금지, 봇 런타임 보존)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: 'C:\Users\masca\repos\karmoddrine\memo'
        env:
          # github.io 는 public → 무인증 fetch OK. memo 는 private +
          # 러너=LocalSystem(사용자 자격증명 안 보임) → 인증 필수.
          # MEMO_GITHUB_PAT 은 *secret* (gh secret list 확인, 2026-05-14
          # 등록). kl-quality-loop 가 vars. 로 오참조해 latent 깨짐(최근
          # run 전부 failure) → 본 스텝은 secrets. 로 (그 버그 class fix).
          MEMO_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
          # 어떤 git op 도 절대 자격증명 프롬프트로 hang X (실패=즉시 skip).
          GIT_TERMINAL_PROMPT: '0'
        # 에이전트 코어·스킨·캐릭터 정본 = memo. prod 봇이 *이 체크아웃*을
        # 런타임에 읽고 .active.json·기억은 *써서* commitIfDirty 로 로컬
        # 커밋한다. github.io 식 reset --hard 절대 X (prod 런타임·미푸시
        # 봇 커밋 파괴). 인증 fetch → ff-only, 분기 시 merge-commit(히스토리
        # 보존, rebase X = 동시쓰기 안전), tracked-dirty/충돌/무인증 시 skip
        # (deploy 비차단·never hang). pull-only(outbound side-effect 0).
        # KAR-018-V — 신규 코어(echo)가 prod 에 도달하는 *유일 근본 경로*.
        # 자동 동기 부재 = "Atlas 밖에 없는데" 의 진짜 원인.
        run: |
          $ErrorActionPreference = 'Continue'
          $memoUnix = 'C:/Users/masca/repos/karmoddrine/memo'
          & git config --global --add safe.directory $memoUnix 2>&1 | Out-Null
          $branch = (& git rev-parse --abbrev-ref HEAD 2>$null)
          if ($branch -ne 'main') {
            Write-Warning "[memo-sync] 브랜치 '$branch' != main — skip (강제전환 X, prod 안전). deploy 계속."
            exit 0
          }
          if ([string]::IsNullOrEmpty($env:MEMO_PAT)) {
            Write-Warning '[memo-sync] vars.MEMO_GITHUB_PAT 미설정 — 인증 fetch 불가, skip (deploy 계속). github.io repo Variables 에 등록 필요.'
            exit 0
          }
          # 인증 URL fetch (토큰은 출력 안 함 — git fetch 는 URL 미인쇄).
          $authUrl = "https://x-access-token:$($env:MEMO_PAT)@github.com/Mascari4615/memo.git"
          & git fetch $authUrl main 2>&1 | ForEach-Object { $_ -replace [regex]::Escape($env:MEMO_PAT), '***' }
          if ($LASTEXITCODE -ne 0) { Write-Warning '[memo-sync] 인증 fetch 실패 — skip (deploy 계속, prod 보존)'; exit 0 }
          # NOTE(blanket dirty 가드 제거, 근본): 라이브 prod 봇은
          # characters/*/mood.json·relationship.json·.active.json 을
          # *상시* 써서 tracked 작업트리가 항상 dirty → blanket skip 은
          # echo 를 영영 차단했음(설계 버그). git merge 는 이미 원자적
          # 안전: 로컬 수정과 *충돌하는* 경로만 거부(부분적용 X), 무관
          # dirty(봇 런타임 ≠ 들어오는 agents/echo)는 보존하며 merge.
          # 충돌 시 아래 merge --abort + skip 이 처리. → git 시맨틱 신뢰.
          $local = (& git rev-parse HEAD 2>$null)
          $remote = (& git rev-parse FETCH_HEAD 2>$null)
          if ($local -eq $remote) { Write-Host "[memo-sync] 이미 최신 ($($local.Substring(0,7)))"; exit 0 }
          # KAR-018-Y: 구 task-claim 이 tracked TASK .md(status:active+
          # claimed_by) 를 더럽혀 merge 영구 차단했음. 이제 claim=gitignore
          # 원장(.md 미변경)이라 *TASK-*.md 의 로컬 수정 = stale 부패* →
          # 안전하게 discard 후 merge. .active.json·mood.json 등 prod 런타임
          # (패턴 불일치)·untracked 신규 = 보존(scope=TASK-*.md 만).
          #
          # KAR-018-Y 2차 근본: 직전 fix(`git diff`+`git checkout --`)는
          # *unstaged 만* 정리했다. 구 코드/워커가 `git add` 한 TASK .md 는
          # staged 부패로 남아 merge 영구 abort("local changes would be
          # overwritten" — KL-048..065/WM-101..134, 노트북 43-behind 의
          # 실근본, diag 25991435300 데이터 확정). `git diff`=unstaged 만,
          # `git checkout -- f`=index 에서 복원이라 staged 를 못 지웠음.
          # → `git checkout HEAD -- <pathspec>` 로 index+worktree 동시
          # 정본(HEAD) 복원: glob 직접 사용(staged/unstaged 무관, 매칭 0건
          # = no-op). TASK-*.md 만 scope → 봇 런타임 파일 무손상.
          & git checkout HEAD -- '*/tasks/TASK-*.md' 'tasks/TASK-*.md' 2>&1 | Out-Null
          Write-Host '[memo-sync] TASK-*.md staged+unstaged stale 부패 정본(HEAD) 강제 복원 (KAR-018-Y 2차)'
          & git merge --ff-only FETCH_HEAD 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Host "[memo-sync] ff -> $(& git rev-parse --short HEAD)"; exit 0 }
          # 분기 = 로컬 봇 .active.json 커밋 존재 → merge-commit (양측 보존)
          & git merge --no-edit FETCH_HEAD 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Host "[memo-sync] merge-commit -> $(& git rev-parse --short HEAD)"; exit 0 }
          # 충돌 → 절대 conflicted 상태로 두지 X. abort+skip, deploy 계속.
          & git merge --abort 2>&1 | Out-Null
          Write-Warning '[memo-sync] merge 충돌 — abort+skip (prod 보존, deploy 계속). 수동 해소 필요.'
          exit 0

      - name: Write prod .env (UTF-8 no BOM, secrets 분리 조립)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.YAWNBOT_DIR }}
        # ③ 진짜 비밀 + 준-비밀 (TASK-YB-028: 21→5 축소). 비밀 아닌 env별 값 = ② config/yawnbot.prod.txt(커밋).
        # 새 *비밀* 추가 시에만 아래 env 매핑 + $keys 갱신. 채널/길드/유저 ID = ② 프로파일 편집.
        # VERTEX_PROJECT_ID = credential 아니나 GCP 프로젝트 노출 정찰정보 → public 커밋 X, secret 유지(준-비밀 경계, 사용자 결정 2026-05-17).
        env:
          YB_PROD_DISCORD_TOKEN: ${{ secrets.YB_PROD_DISCORD_TOKEN }}
          YB_PROD_GEMINI_API_KEY: ${{ secrets.YB_PROD_GEMINI_API_KEY }}
          YB_PROD_VERTEX_API_KEY: ${{ secrets.YB_PROD_VERTEX_API_KEY }}
          YB_PROD_VERTEX_PROJECT_ID: ${{ secrets.YB_PROD_VERTEX_PROJECT_ID }}
          YB_PROD_DISCORD_SUMMARY_WEBHOOK_URL: ${{ secrets.YB_PROD_DISCORD_SUMMARY_WEBHOOK_URL }}
          # KAR-004: digest-webhook 이 private memo digest 본문 fetch (인증). 없으면 송신0.
          # TASK-YB-021: heartbeat sender 도 이 동일 PAT 으로 memo 기록 (새 secret 불요).
          YB_PROD_MEMO_GITHUB_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
          # KAR-018-Y: agentic 워커 push/PR 자격. 데이터 체인:
          # ① MEMO_GITHUB_PAT=memo-scope → github.io denied(06:52 KST)
          # ② "App 재사용"(사용자 결정 05-18)=불가 — gh secret list 결과
          #    GH_APP_ID/GH_APP_PRIVATE_KEY *부재*(App 미생성, KL-048 미완,
          #    resolve-merge-token 줄곧 PAT 폴백). 전제 데이터 반증.
          # ③ 정답 = PAT_FOR_AUTO_MERGE — github.io 실재 secret, auto-merge/
          #    autopilot-graduate 가 그걸로 github.io PR 머지 중 = github.io
          #    write 확정. 머지=push 자격 정체 일치. 새 secret 0.
          # GH_APP_* 주입 보존 = KL-048 App 생성 시 getInstallationToken
          # 자동승격(없으면 null→GH_TOKEN 폴백, 무중단 additive).
          YB_PROD_GH_TOKEN: ${{ secrets.PAT_FOR_AUTO_MERGE }}
          YB_PROD_GH_APP_ID: ${{ secrets.GH_APP_ID }}
          YB_PROD_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # KAR-018-Y: wm-worker → Witch-Mendokusai push 자격(별 repo,
          # PAT_FOR_AUTO_MERGE=github.io-scope 라 403). 사용자 발급·등록
          # 시 wm-worker 가 우선 사용. 미등록=빈값→기존 폴백(현 동작·회귀0).
          YB_PROD_WM_GITHUB_PAT: ${{ secrets.WM_GITHUB_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'

          # ③ 비밀+준-비밀 키 list. 빈 secret 라인 skip (.env load 가 빈값=undefined 라 정합).
          $keys = @(
            'DISCORD_TOKEN', 'GEMINI_API_KEY', 'VERTEX_API_KEY', 'VERTEX_PROJECT_ID', 'DISCORD_SUMMARY_WEBHOOK_URL', 'MEMO_GITHUB_PAT', 'GH_TOKEN', 'GH_APP_ID', 'GH_APP_PRIVATE_KEY', 'WM_GITHUB_PAT'
          )

          # 필수 검증 — DISCORD_TOKEN 없으면 deploy fail (CLIENT_ID 등은 이제 ② 프로파일 소관)
          if ([string]::IsNullOrEmpty($env:YB_PROD_DISCORD_TOKEN)) {
            throw "필수 secret YB_PROD_DISCORD_TOKEN 누락 — GitHub Actions secrets 확인"
          }

          # ④ .env = YAWNBOT_ENV=prod 리터럴(비밀 아님, ② prod 프로파일 선택용) + ③ 주입 비밀.
          # 비밀 아닌 채널/길드/ID 는 .env 에 안 씀 — ② config/yawnbot.prod.txt 가 정본.
          $lines = @('YAWNBOT_ENV=prod')
          $missing = @()
          foreach ($key in $keys) {
            $envName = "YB_PROD_$key"
            $value = (Get-Item -Path "Env:$envName" -ErrorAction SilentlyContinue).Value
            if ($value) {
              # 멀티라인 PEM(GH_APP_PRIVATE_KEY) = 개행을 리터럴 \n 으로
              # (1줄 .env 정합). github-app-token.ts 가 런타임 un-escape.
              if ($key -eq 'GH_APP_PRIVATE_KEY') {
                $value = ($value -replace "`r?`n", '\n')
              }
              $lines += "$key=$value"
            } else {
              $missing += $key
            }
          }

          $envContent = ($lines -join "`n") + "`n"
          $envPath = Join-Path $PWD '.env'
          [System.IO.File]::WriteAllText($envPath, $envContent, [System.Text.UTF8Encoding]::new($false))

          Write-Host "[Write prod .env] secrets set=$($lines.Count - 1) missing=$($missing.Count) (+ YAWNBOT_ENV=prod)"
          if ($missing.Count -gt 0) {
            Write-Host "  missing (skip): $($missing -join ', ')" -ForegroundColor DarkGray
          }
          # 주입 검증 — 토큰·키는 마스킹
          Get-Content $envPath | Select-String -Pattern '^(DISCORD_TOKEN|YAWNBOT_ENV)=' | ForEach-Object {
            $line = $_ -replace '(DISCORD_TOKEN=.{15}).*','$1***MASKED***'
            Write-Host $line
          }

      - name: npm install + build:yawnbot
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          & npm install --prefer-offline --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          & npm run build:yawnbot
          if ($LASTEXITCODE -ne 0) { throw "build:yawnbot failed" }

      - name: Deploy slash commands
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          & npm run deploy:yawnbot
          if ($LASTEXITCODE -ne 0) { throw "deploy:yawnbot failed" }
        # ops-self-report 의 reportDeploy 가 운영 채널에 임베드 발송

      - name: NSSM restart yawnbot-prod
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          # nssm 이 LocalSystem PATH 에 없을 수 있음 (winget 가 사용자 LOCALAPPDATA 에 설치).
          # Get-Command 우선 + 일반 fallback path 들 (사용자 masca 고정 — 노트북 한정 self-hosted runner).
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:ProgramData\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "C:\ProgramData\chocolatey\bin\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { throw "nssm.exe 못 찾음 — sub-A Phase A 의 winget install NSSM.NSSM 확인 또는 system PATH 에 추가" }
          Write-Host "Using nssm: $nssm"
          & $nssm restart yawnbot-prod 2>&1
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            & $nssm start yawnbot-prod 2>&1
            if ($LASTEXITCODE -ne 0) { throw "nssm restart/start yawnbot-prod failed" }
          }
          # ops-self-report 의 reportShutdown → reportStartup 두 임베드가 운영 채널에 도착
          Write-Host "yawnbot-prod restarted at $(Get-Date -Format 'yyyy-MM-ddTHH:mm:sszzz')"

      - name: Upsert GitHub webhooks (production URL)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        env:
          YAWNBOT_WEBHOOK_URL: 'https://yawnbot.mascari4615.com/webhook/github'
          GH_TOKEN: ${{ secrets.YB_PROD_GH_WEBHOOK_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) {
            Write-Warning "YB_PROD_GH_WEBHOOK_TOKEN 누락 — webhook upsert skip (deploy 자체는 성공). secret 등록 후 다음 deploy 부터 작동 (TASK-YB-005)."
            exit 0
          }
          & npm run webhook:upsert
          if ($LASTEXITCODE -ne 0) { Write-Warning "webhook upsert 실패 (deploy 자체는 성공) — gh auth / token scope 확인 필요" }
          # cloudflared named tunnel (yawnbot.mascari4615.com) 은 별도 영구 service (KarmoLab Server Monitor 의 yawnbot-tunnel-prod 카드 또는 NSSM)
