name: Deploy Discord Bots (yawnbot)

# TASK-YB-002-C — yawnbot prod 자동 deploy.
# master push 시 self-hosted runner (노트북) 가 build + .env 주입 + nssm restart.
# pull_request_target 절대 사용 X (포크 PR RCE 경로).

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/discord-bots/apps/yawnbot/**'
      - 'apps/discord-bots/packages/**'
      - 'apps/discord-bots/package.json'
      - 'apps/discord-bots/package-lock.json'
      - 'packages/karmolab-ai/**'
      - '.github/workflows/deploy-discord-bots.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-discord-bots
  cancel-in-progress: false

jobs:
  deploy-yawnbot:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 15

    # 노트북의 prod 폴더 직접 사용 — actions/checkout 의 _work 폴더 X.
    # NSSM 이 보는 폴더 = build 폴더 = runner working dir. 통일.
    env:
      REPO_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io'
      BOTS_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io\apps\discord-bots'
      YAWNBOT_DIR: 'C:\Users\masca\repos\karmoddrine\Mascari4615.github.io\apps\discord-bots\apps\yawnbot'

    steps:
      - name: Sync to origin/master (force)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.REPO_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          # LocalSystem (NSSM runner) 가 사용자 masca 의 폴더 git 소유권 인식 못 함 — safe.directory 등록 (idempotent)
          $repoUnix = '${{ env.REPO_DIR }}' -replace '\\', '/'
          & git config --global --add safe.directory $repoUnix 2>&1 | Out-Null
          & git switch master 2>&1 | Out-Null
          # NSSM prod 폴더는 deploy 전용 (사용자 작업 영역 X — 작업은 .worktrees/* 에서). dirty state 는 항상 잔재 (line ending 변환 / 이전 deploy 잔재 / 잘못 복사 등) — 강제 동기화로 폐기.
          # git pull --ff-only 는 working tree dirty 면 fail (yawnbot-defaults.txt CRLF 변환 사고 2026-05-09).
          & git fetch origin master 2>&1
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed (exit $LASTEXITCODE)" }
          & git reset --hard origin/master 2>&1
          if ($LASTEXITCODE -ne 0) { throw "git reset --hard failed (exit $LASTEXITCODE)" }
          & git clean -fd 2>&1 | Out-Null
          & git rev-parse --short HEAD

      - name: Sync prod memo (결정화 — fetch + reset --hard, 런타임 untracked 보존)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: 'C:\Users\masca\repos\karmoddrine\memo'
        env:
          # github.io 는 public → 무인증 fetch OK. memo 는 private +
          # 러너=LocalSystem(사용자 자격증명 안 보임) → 인증 필수.
          # MEMO_GITHUB_PAT 은 *secret* (gh secret list 확인, 2026-05-14 등록).
          MEMO_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
          # 같은 머신(노트북)에서 도는 yawnbot express 인그레스로 ops 알림.
          # LOCAL_WEBHOOK_SECRET 미설정 시 dev bypass (local-webhook.ts) —
          # 동일 머신 신뢰 모델. 설정돼 있으면 X-Yawnbot-Secret 헤더로 전달.
          YB_LOCAL_WEBHOOK_SECRET: ${{ secrets.LOCAL_WEBHOOK_SECRET }}
          # 어떤 git op 도 절대 자격증명 프롬프트로 hang X (실패=즉시 skip).
          GIT_TERMINAL_PROMPT: '0'
        # 에이전트 코어·스킨·캐릭터 *정의* 정본 = memo. prod 봇이 이 체크아웃을
        # 런타임에 읽는다. 봇이 *쓰는* 파일(.active.json·characters/*/memory/*·
        # relationship.json·image-cache/*) 은 TASK-KAR-MEMOSYNC 에서 .gitignore
        # 처리됨(yawnbot src commitIfDirty/commitToGit no-op 화) → 더는 tracked
        # 정본을 mutate 안 함 → origin divergence 가 *구조적으로 불가능*.
        # 그래서 merge 댄스(ff-only→merge--no-edit→abort, KAR-018-Y) 폐기 →
        # `git fetch <auth> main` + `git reset --hard FETCH_HEAD` 결정화:
        # tracked 는 origin 과 항상 byte-identical, untracked 런타임은
        # reset --hard 가 *안 건드림*(생존). 영영 abort/diverge 불가.
        # 헤드리스 재현 증명 = apps/discord-bots/apps/yawnbot/scripts/
        # memo-sync-divergence-repro.sh (#1 divergence 불가 / #2 reset 보존 /
        # #3 대조: tracked 면 reset 이 런타임 파괴 = part2 가 고침 입증).
        # ⚠ part2(런타임 untrack, memo 레포) 와 *동시 착륙 필수* — 분리 착륙
        # 시 (untrack 없이 reset --hard) prod 봇 런타임 origin 으로 파괴.
        run: |
          $ErrorActionPreference = 'Continue'
          $memoUnix = 'C:/Users/masca/repos/karmoddrine/memo'
          & git config --global --add safe.directory $memoUnix 2>&1 | Out-Null
          # LOUD skip — silent Write-Warning 단독 = prod memo 동결 무관측
          # 근본(2026-05-18 KAR-018-ESC). 같은 머신 yawnbot 인그레스로 #ops
          # 알림 + Actions ::warning:: + exit 0 (bot-code deploy 는 계속).
          # 직전 YB_OPS_WEBHOOK=secrets.YB_PROD_DISCORD_SUMMARY_WEBHOOK_URL 은
          # 404 였음(deploy 26037374635 "ops alert 송신 실패 404" 실증) —
          # 그 secret 은 raw Discord webhook 아님. 봇은 같은 노트북에서
          # WEBHOOK_PORT(기본 4615) express 로 POST /webhook/local 을 이미
          # 서빙(local-webhook.ts, TASK-WM-087) → 그게 올바른 ops 경로.
          function Skip-Loud($reason) {
            $msg = "🧊 [memo-sync] prod memo 동기 skip — $reason (prod memo 동결 가능, 수동 해소 필요. host=$env:COMPUTERNAME)"
            Write-Warning $msg
            Write-Output "::warning title=memo-sync skip::$msg"
            $port = if ($env:WEBHOOK_PORT) { $env:WEBHOOK_PORT } else { '4615' }
            $headers = @{}
            if (-not [string]::IsNullOrEmpty($env:YB_LOCAL_WEBHOOK_SECRET)) {
              $headers['X-Yawnbot-Secret'] = $env:YB_LOCAL_WEBHOOK_SECRET
            }
            $body = @{
              kind    = 'memo-sync'
              source  = 'deploy-discord-bots/Sync prod memo'
              title   = '🧊 prod memo 동기 skip'
              summary = $msg
              level   = 'error'
            } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:$port/webhook/local" -Method Post `
                -ContentType 'application/json; charset=utf-8' -Headers $headers `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 15 | Out-Null
            } catch { Write-Warning "[memo-sync] ops alert 송신 실패(비차단): $($_.Exception.Message)" }
            exit 0
          }
          $branch = (& git rev-parse --abbrev-ref HEAD 2>$null)
          if ($branch -ne 'main') {
            Skip-Loud "브랜치 '$branch' != main (강제전환 X, prod 안전)"
          }
          if ([string]::IsNullOrEmpty($env:MEMO_PAT)) {
            Skip-Loud 'MEMO_GITHUB_PAT secret 미설정 — 인증 fetch 불가 (github.io repo secret 등록 필요)'
          }
          # 인증 URL fetch (토큰은 출력 안 함 — git fetch 는 URL 미인쇄).
          $authUrl = "https://x-access-token:$($env:MEMO_PAT)@github.com/Mascari4615/memo.git"
          & git fetch $authUrl main 2>&1 | ForEach-Object { $_ -replace [regex]::Escape($env:MEMO_PAT), '***' }
          if ($LASTEXITCODE -ne 0) { Skip-Loud '인증 fetch 실패 (토큰 만료/scope/네트워크 의심)' }
          $local  = (& git rev-parse HEAD 2>$null)
          $remote = (& git rev-parse FETCH_HEAD 2>$null)
          if ($local -eq $remote) { Write-Host "[memo-sync] 이미 최신 ($($local.Substring(0,7)))"; exit 0 }
          # 결정화: tracked 는 origin 과 항상 일치, untracked 런타임은 생존.
          # 봇이 tracked 정본을 mutate 안 하므로(part2) 영영 안전·결정적.
          & git reset --hard FETCH_HEAD 2>&1
          if ($LASTEXITCODE -ne 0) {
            Skip-Loud "git reset --hard 실패 (exit $LASTEXITCODE) — 인덱스 잠금/디스크 의심"
          }
          Write-Host "[memo-sync] reset --hard -> $(& git rev-parse --short HEAD) (prod==origin, 런타임 untracked 보존)"
          exit 0

      - name: Write prod .env (UTF-8 no BOM, secrets 분리 조립)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.YAWNBOT_DIR }}
        # ③ 진짜 비밀 + 준-비밀 (TASK-YB-028: 21→5 축소). 비밀 아닌 env별 값 = ② config/yawnbot.prod.txt(커밋).
        # 새 *비밀* 추가 시에만 아래 env 매핑 + $keys 갱신. 채널/길드/유저 ID = ② 프로파일 편집.
        # VERTEX_PROJECT_ID = credential 아니나 GCP 프로젝트 노출 정찰정보 → public 커밋 X, secret 유지(준-비밀 경계, 사용자 결정 2026-05-17).
        env:
          YB_PROD_DISCORD_TOKEN: ${{ secrets.YB_PROD_DISCORD_TOKEN }}
          YB_PROD_GEMINI_API_KEY: ${{ secrets.YB_PROD_GEMINI_API_KEY }}
          YB_PROD_VERTEX_API_KEY: ${{ secrets.YB_PROD_VERTEX_API_KEY }}
          YB_PROD_VERTEX_PROJECT_ID: ${{ secrets.YB_PROD_VERTEX_PROJECT_ID }}
          YB_PROD_DISCORD_SUMMARY_WEBHOOK_URL: ${{ secrets.YB_PROD_DISCORD_SUMMARY_WEBHOOK_URL }}
          # KAR-004: digest-webhook 이 private memo digest 본문 fetch (인증). 없으면 송신0.
          # TASK-YB-021: heartbeat sender 도 이 동일 PAT 으로 memo 기록 (새 secret 불요).
          YB_PROD_MEMO_GITHUB_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
          # KAR-018-Y: agentic 워커 push/PR 자격. 데이터 체인:
          # ① MEMO_GITHUB_PAT=memo-scope → github.io denied(06:52 KST)
          # ② "App 재사용"(사용자 결정 05-18)=불가 — gh secret list 결과
          #    GH_APP_ID/GH_APP_PRIVATE_KEY *부재*(App 미생성, KL-048 미완,
          #    resolve-merge-token 줄곧 PAT 폴백). 전제 데이터 반증.
          # ③ 정답 = PAT_FOR_AUTO_MERGE — github.io 실재 secret, auto-merge/
          #    autopilot-graduate 가 그걸로 github.io PR 머지 중 = github.io
          #    write 확정. 머지=push 자격 정체 일치. 새 secret 0.
          # GH_APP_* 주입 보존 = KL-048 App 생성 시 getInstallationToken
          # 자동승격(없으면 null→GH_TOKEN 폴백, 무중단 additive).
          YB_PROD_GH_TOKEN: ${{ secrets.PAT_FOR_AUTO_MERGE }}
          YB_PROD_GH_APP_ID: ${{ secrets.GH_APP_ID }}
          YB_PROD_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # KAR-018-Y: wm-worker → Witch-Mendokusai push 자격(별 repo,
          # PAT_FOR_AUTO_MERGE=github.io-scope 라 403). 사용자 발급·등록
          # 시 wm-worker 가 우선 사용. 미등록=빈값→기존 폴백(현 동작·회귀0).
          YB_PROD_WM_GITHUB_PAT: ${{ secrets.WM_GITHUB_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'

          # ③ 비밀+준-비밀 키 list. 빈 secret 라인 skip (.env load 가 빈값=undefined 라 정합).
          $keys = @(
            'DISCORD_TOKEN', 'GEMINI_API_KEY', 'VERTEX_API_KEY', 'VERTEX_PROJECT_ID', 'DISCORD_SUMMARY_WEBHOOK_URL', 'MEMO_GITHUB_PAT', 'GH_TOKEN', 'GH_APP_ID', 'GH_APP_PRIVATE_KEY', 'WM_GITHUB_PAT'
          )

          # 필수 검증 — DISCORD_TOKEN 없으면 deploy fail (CLIENT_ID 등은 이제 ② 프로파일 소관)
          if ([string]::IsNullOrEmpty($env:YB_PROD_DISCORD_TOKEN)) {
            throw "필수 secret YB_PROD_DISCORD_TOKEN 누락 — GitHub Actions secrets 확인"
          }

          # ④ .env = YAWNBOT_ENV=prod 리터럴(비밀 아님, ② prod 프로파일 선택용) + ③ 주입 비밀.
          # 비밀 아닌 채널/길드/ID 는 .env 에 안 씀 — ② config/yawnbot.prod.txt 가 정본.
          $lines = @('YAWNBOT_ENV=prod')
          $missing = @()
          foreach ($key in $keys) {
            $envName = "YB_PROD_$key"
            $value = (Get-Item -Path "Env:$envName" -ErrorAction SilentlyContinue).Value
            if ($value) {
              # 멀티라인 PEM(GH_APP_PRIVATE_KEY) = 개행을 리터럴 \n 으로
              # (1줄 .env 정합). github-app-token.ts 가 런타임 un-escape.
              if ($key -eq 'GH_APP_PRIVATE_KEY') {
                $value = ($value -replace "`r?`n", '\n')
              }
              $lines += "$key=$value"
            } else {
              $missing += $key
            }
          }

          $envContent = ($lines -join "`n") + "`n"
          $envPath = Join-Path $PWD '.env'
          [System.IO.File]::WriteAllText($envPath, $envContent, [System.Text.UTF8Encoding]::new($false))

          Write-Host "[Write prod .env] secrets set=$($lines.Count - 1) missing=$($missing.Count) (+ YAWNBOT_ENV=prod)"
          if ($missing.Count -gt 0) {
            Write-Host "  missing (skip): $($missing -join ', ')" -ForegroundColor DarkGray
          }
          # 주입 검증 — 토큰·키는 마스킹
          Get-Content $envPath | Select-String -Pattern '^(DISCORD_TOKEN|YAWNBOT_ENV)=' | ForEach-Object {
            $line = $_ -replace '(DISCORD_TOKEN=.{15}).*','$1***MASKED***'
            Write-Host $line
          }

      - name: npm install + build:yawnbot
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          & npm install --prefer-offline --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          & npm run build:yawnbot
          if ($LASTEXITCODE -ne 0) { throw "build:yawnbot failed" }

      - name: Deploy slash commands
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          & npm run deploy:yawnbot
          if ($LASTEXITCODE -ne 0) { throw "deploy:yawnbot failed" }
        # ops-self-report 의 reportDeploy 가 운영 채널에 임베드 발송

      - name: NSSM restart yawnbot-prod
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          # nssm 이 LocalSystem PATH 에 없을 수 있음 (winget 가 사용자 LOCALAPPDATA 에 설치).
          # Get-Command 우선 + 일반 fallback path 들 (사용자 masca 고정 — 노트북 한정 self-hosted runner).
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:ProgramData\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "C:\ProgramData\chocolatey\bin\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { throw "nssm.exe 못 찾음 — sub-A Phase A 의 winget install NSSM.NSSM 확인 또는 system PATH 에 추가" }
          Write-Host "Using nssm: $nssm"

          # === KAR-018 nssm 영구화 (2026-05-20 yawnbot-prod 12h silent fail 실증) ===
          # 본 서비스 ObjectName=LocalSystem default — 사용자 OAuth 자격
          # (C:\Users\masca\.claude\.credentials.json, plain JSON+ACL SYSTEM:(F)) 못 봄.
          # claude CLI 가 인증 에러 본문을 stderr 가 아닌 stdout 으로 박음 → 봇 spawn
          # 래퍼의 stderr.slice 빈 결과 → 디스코드 "종료 코드 1:" 휑 → 12h 진단 마비.
          # 정본 = memo/rules/quality.md § 환경트랩 — NSSM 서비스 LocalSystem default.
          # 본 step 의 nssm set 라인들은 idempotent — 매 deploy 재박힘 (drift 0).

          # ① stderr/stdout 로깅 영구화 (자식 출력 휘발 방지 — 미설정 = silent fail 12h+ trap)
          $logDir = 'C:\nssm-logs\yawnbot-prod'
          if (-not (Test-Path $logDir)) { New-Item -ItemType Directory -Force $logDir | Out-Null }
          & $nssm set yawnbot-prod AppStderr "$logDir\stderr.log" | Out-Null
          & $nssm set yawnbot-prod AppStdout "$logDir\stdout.log" | Out-Null
          & $nssm set yawnbot-prod AppRotateFiles 1 | Out-Null
          & $nssm set yawnbot-prod AppRotateBytes 10485760 | Out-Null

          # ② USERPROFILE 마스킹 — LocalSystem 컨텍스트가 사용자 자격 가시.
          # AppEnvironmentExtra 는 *전체 교체* 라 prod env + USERPROFILE 둘 다 명시.
          # 새 env 추가 시 이 라인에 추가 (별도 nssm set 호출 X — 마지막 호출이 전체 덮어씀).
          & $nssm set yawnbot-prod AppEnvironmentExtra 'YAWNBOT_ENV=prod' 'USERPROFILE=C:\Users\masca' | Out-Null

          # ③ safe.directory '*' — 봇이 USERPROFILE 마스킹 후 보는 사용자 gitconfig
          # (C:\Users\masca\.gitconfig). 미박으면 git fetch 시 'dubious ownership'
          # (LocalSystem ↔ 사용자 owned repo) fail. idempotent — 이미 있으면 add 가 no-op 처리.
          $userGitconfig = 'C:\Users\masca\.gitconfig'
          if (-not (Test-Path $userGitconfig)) { New-Item -ItemType File -Force $userGitconfig | Out-Null }
          $existing = & git config --file $userGitconfig --get-all safe.directory 2>$null
          if (-not ($existing -contains '*')) {
            & git config --file $userGitconfig --add safe.directory '*'
            Write-Host "[KAR-018] safe.directory '*' 추가됨 ($userGitconfig)"
          } else {
            Write-Host "[KAR-018] safe.directory '*' 이미 박혀있음 ($userGitconfig)"
          }

          Write-Host "[KAR-018] nssm 설정 영구화 완료: AppStderr/AppStdout + USERPROFILE 마스킹 + safe.directory"
          # === /KAR-018 nssm 영구화 ===

          & $nssm restart yawnbot-prod 2>&1
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            & $nssm start yawnbot-prod 2>&1
            if ($LASTEXITCODE -ne 0) { throw "nssm restart/start yawnbot-prod failed" }
          }
          # ops-self-report 의 reportShutdown → reportStartup 두 임베드가 운영 채널에 도착
          Write-Host "yawnbot-prod restarted at $(Get-Date -Format 'yyyy-MM-ddTHH:mm:sszzz')"

      # === TASK-KAR-096 Phase 1b: agent-orchestrator 빌드 + NSSM upsert + restart ===
      # 별 NSSM service `agent-orchestrator-prod` 가 cadence 호스트. yawnbot-prod 와 분리 process.
      # yawnbot-prod 의 AGENT_HOST=orchestrator env 가 cadence skip 신호 (이중 race 방지).
      # service 미존재 시 install (idempotent). 첫 deploy = install + start.
      - name: build agent-orchestrator
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          & npm run build:orchestrator
          if ($LASTEXITCODE -ne 0) { Write-Warning "build:orchestrator failed — orchestrator deploy skip (yawnbot 정상)"; exit 0 }

      - name: NSSM upsert + restart agent-orchestrator-prod
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:ProgramData\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { Write-Warning "nssm.exe 못 찾음 — orchestrator NSSM upsert skip (yawnbot 정상)"; exit 0 }

          $svc = 'agent-orchestrator-prod'
          $nodeExe = (Get-Command node.exe -ErrorAction SilentlyContinue).Source
          if (-not $nodeExe) { Write-Warning "node.exe 못 찾음 — orchestrator install skip"; exit 0 }
          $orchDir = Join-Path (Get-Location) 'apps\agent-orchestrator'
          $mainJs = Join-Path $orchDir 'dist\src\main.js'
          if (-not (Test-Path $mainJs)) { Write-Warning "orchestrator dist/src/main.js 없음 — build 실패 가능, skip"; exit 0 }

          # service 존재 확인 (status 호출 → 비-zero 면 미존재)
          & $nssm status $svc 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if (-not $exists) {
            Write-Host "[KAR-096] agent-orchestrator-prod NSSM install (첫 deploy)"
            & $nssm install $svc $nodeExe "`"$mainJs`"" | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Warning "nssm install agent-orchestrator-prod failed"; exit 0 }
            & $nssm set $svc AppDirectory $orchDir | Out-Null
            & $nssm set $svc Start SERVICE_AUTO_START | Out-Null
          }

          # 로깅 + USERPROFILE 마스킹 + AGENT_HOST=orchestrator + AGENT_CADENCE_ROLE=main
          # (Phase 2: 워커는 별 daemon 으로 분리 — 이 service 는 main loop 만)
          $logDir = 'C:\nssm-logs\agent-orchestrator-prod'
          if (-not (Test-Path $logDir)) { New-Item -ItemType Directory -Force $logDir | Out-Null }
          & $nssm set $svc AppStderr "$logDir\stderr.log" | Out-Null
          & $nssm set $svc AppStdout "$logDir\stdout.log" | Out-Null
          & $nssm set $svc AppRotateFiles 1 | Out-Null
          & $nssm set $svc AppRotateBytes 10485760 | Out-Null
          & $nssm set $svc AppEnvironmentExtra `
            'YAWNBOT_ENV=prod' `
            'AGENT_HOST=orchestrator' `
            'AGENT_CADENCE_ROLE=main' `
            'USERPROFILE=C:\Users\masca' | Out-Null

          # restart (or start)
          & $nssm restart $svc 2>&1
          if ($LASTEXITCODE -ne 0) {
            & $nssm start $svc 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Warning "nssm restart/start agent-orchestrator-prod failed (yawnbot 정상)"; exit 0 }
          }
          Write-Host "agent-orchestrator-prod restarted at $(Get-Date -Format 'yyyy-MM-ddTHH:mm:sszzz')"

      # === TASK-KAR-096 Phase 2: 4 worker daemon NSSM (같은 binary, env role 차이) ===
      # orchestrator 와 같은 dist/src/main.js 실행. AGENT_CADENCE_ROLE=worker-<core-id> env 로
      # 자기 코어만 처리. 각 워커 자기 코드 fix → 자기만 restart, 다른 워커·orchestrator·yawnbot 영향 0.
      - name: NSSM upsert + restart agent-worker-* daemons
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        working-directory: ${{ env.BOTS_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { Write-Warning "nssm.exe 못 찾음 — worker daemon skip"; exit 0 }
          $nodeExe = (Get-Command node.exe -ErrorAction SilentlyContinue).Source
          if (-not $nodeExe) { Write-Warning "node.exe 못 찾음 — worker daemon skip"; exit 0 }
          $orchDir = Join-Path (Get-Location) 'apps\agent-orchestrator'
          $mainJs = Join-Path $orchDir 'dist\src\main.js'
          if (-not (Test-Path $mainJs)) { Write-Warning "orchestrator dist 없음 — worker daemon skip"; exit 0 }

          $workers = @(
            @{ svc='agent-worker-kar-prod';        scope='kar-worker' },
            @{ svc='agent-worker-kl-prod';         scope='kl-worker' },
            @{ svc='agent-worker-wm-support-prod'; scope='wm-support' },
            @{ svc='agent-worker-wm-worker-prod';  scope='wm-worker' }
          )
          foreach ($w in $workers) {
            $svc = $w.svc
            $scope = $w.scope
            & $nssm status $svc 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[KAR-096 Phase 2] $svc install (scope=$scope)"
              & $nssm install $svc $nodeExe "`"$mainJs`"" | Out-Null
              if ($LASTEXITCODE -ne 0) { Write-Warning "nssm install $svc failed — skip"; continue }
              & $nssm set $svc AppDirectory $orchDir | Out-Null
              & $nssm set $svc Start SERVICE_AUTO_START | Out-Null
            }
            $logDir = "C:\nssm-logs\$svc"
            if (-not (Test-Path $logDir)) { New-Item -ItemType Directory -Force $logDir | Out-Null }
            & $nssm set $svc AppStderr "$logDir\stderr.log" | Out-Null
            & $nssm set $svc AppStdout "$logDir\stdout.log" | Out-Null
            & $nssm set $svc AppRotateFiles 1 | Out-Null
            & $nssm set $svc AppRotateBytes 10485760 | Out-Null
            & $nssm set $svc AppEnvironmentExtra `
              'YAWNBOT_ENV=prod' `
              'AGENT_HOST=orchestrator' `
              "AGENT_CADENCE_ROLE=worker-$scope" `
              'USERPROFILE=C:\Users\masca' | Out-Null
            & $nssm restart $svc 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              & $nssm start $svc 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { Write-Warning "$svc restart/start failed (다른 daemon 정상)"; continue }
            }
            Write-Host "$svc restarted at $(Get-Date -Format 'yyyy-MM-ddTHH:mm:sszzz')"
          }
      # === /KAR-096 Phase 2 ===

      - name: NSSM set yawnbot-prod AGENT_HOST=orchestrator
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { exit 0 }
          # yawnbot-prod 에 AGENT_HOST=orchestrator 추가 (cadence 호출 skip → orchestrator 가 인계)
          & $nssm set yawnbot-prod AppEnvironmentExtra `
            'YAWNBOT_ENV=prod' `
            'USERPROFILE=C:\Users\masca' `
            'AGENT_HOST=orchestrator' | Out-Null
          & $nssm restart yawnbot-prod | Out-Null
          Write-Host "yawnbot-prod env updated (AGENT_HOST=orchestrator) + restarted"
      # === /KAR-096 Phase 1b ===

