name: Record Agent Decision (KAR-018-Y)

# AI-driven ops 레버 — TASK 결정을 prod agent-decisions.jsonl 에 주입.
#
# 사유: 양방향 스레드 리스너는 *사용자(비-bot) 답글*만 캡처(워커 자기
#   포스트 오캡처 방지). 사용자가 "결정은 너가 알아서"(2026-05-18 위임)
#   라 했으므로, owner(Claude)가 위임 도메인(시스템·구현) 결정을 워커에
#   전달할 비-GUI 경로 필요 — 없으면 spec-decision task 에서 영구 정체.
#   GUI/사용자 인터럽트 떠넘기기 금지(process.md Ops 인터페이스) 충족.
# 안전: 결정 = gitignore 파생 런타임(agent-decisions.jsonl, agent-cadence
#   가 다음 pickup 에 임베드). 위임 도메인(코드·인프라·구현)만 — 비전·
#   디자인·비가역 외부액션은 사용자 영역(여기 X). 형식 = agent-decisions.ts
#   parseDecisionLine 정합 JSON 1줄.
# 정본: TASK-KAR-018-Y. 트리거 = workflow_dispatch (Claude owner 명시).

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'TASK id (예: TASK-KAR-006)'
        required: true
      decision:
        description: '결정 본문 (워커가 이대로 진행)'
        required: true
      by:
        description: '결정자 (기본 claude-owner)'
        required: false
        default: 'claude-owner'

jobs:
  record:
    runs-on: [self-hosted, windows]
    steps:
      - name: Append decision to prod agent-decisions.jsonl
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        env:
          TASK_ID: ${{ inputs.task_id }}
          DECISION: ${{ inputs.decision }}
          BY: ${{ inputs.by }}
        run: |
          $dir = 'C:\Users\masca\repos\karmoddrine\memo\.claude'
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force $dir | Out-Null }
          $f = Join-Path $dir 'agent-decisions.jsonl'
          $rec = [ordered]@{
            taskId = $env:TASK_ID
            text   = $env:DECISION
            by     = $env:BY
            ts     = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          }
          $line = ($rec | ConvertTo-Json -Compress)
          Add-Content -LiteralPath $f -Value $line -Encoding utf8
          Write-Host "[record-decision] $($env:TASK_ID) <- $($env:BY): $($env:DECISION.Substring(0,[Math]::Min(80,$env:DECISION.Length)))"
