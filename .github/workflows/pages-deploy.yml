name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    # allow-list: pages-deploy 가 실제 빌드 입력으로 쓰는 dir 만 트리거.
    # 새 sub-app / root 파일 추가돼도 기본 미트리거 (default safe).
    # 의존 누락 발견 시 본 목록 갱신 (TASK-KL-057).
    paths:
      - apps/blog/**
      - apps/karmolab/**
      - apps/karmolab-react-src/**
      - packages/karmolab-ai/**
      - .github/workflows/pages-deploy.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나. 단 **돌던 것을 끊지 않는다** —
# 여러 세션이 몇 분 간격으로 밀어 넣는데 배포가 5~10분이라, 끊는 설정에서는
# 배포가 끝까지 가는 일 자체가 드물었다 (실측: 연속 3건이 완주 못 하고 취소).
# 끊지 않으면 돌던 것은 끝나고, 대기 중이던 것만 최신 것으로 교체된다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 짧은 간격의 push 를 **하나로 합친다**. 여러 세션이 각자 몇 분 간격으로 올리면 배포가 겹치고,
    # 겹치면 GitHub 쪽 처리가 10분 상한을 넘겨 배포가 통째로 죽는다 (2026-08-06 실측:
    # 5연속 실패 → push 없는 창에서 한 번에 8분 완주). 상한은 못 늘리므로 겹침을 없앤다.
    # 아래 대기 중에 새 push 가 오면 이 빌드는 취소되고 새 것만 남는다 = 마지막 하나만 배포.
    # 사람이 「몰아서 올리자」를 기억할 필요가 없어야 한다 — 그래서 규율이 아니라 구조로 막는다.
    concurrency:
      group: "pages-build"
      cancel-in-progress: true
    env:
      HUSKY: "0"

    steps:
      - name: Coalesce rapid pushes
        run: sleep 180

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          working-directory: apps/blog

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/blog/package-lock.json

      - name: Install blog dependencies
        working-directory: apps/blog
        run: npm ci

      - name: Build theme assets (CSS and JS)
        working-directory: apps/blog
        run: npm run build

      - name: Build post graph data
        working-directory: apps/blog
        run: npm run build:graph

      - name: Build KarmoLab React App
        working-directory: apps/karmolab-react-src
        run: |
          npm ci
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build karmolab-ai (shared package — apps/karmolab dependency)
        working-directory: packages/karmolab-ai
        run: |
          npm ci
          npm run build

      # KarmoLab 빌드 관문에 브라우저로 도는 검사가 들어 있다 (GIF 압축·영상 자르기·녹음·PDF).
      # 러너에는 브라우저가 없어 이 줄이 없으면 빌드가 그 자리에서 죽는다 — 실제로 죽었다.
      # 검사를 빼는 대신 브라우저를 깔아 CI 에서도 같은 관문이 돌게 한다.
      - name: Install browser for KarmoLab checks
        working-directory: apps/karmolab
        run: npx --yes playwright install --with-deps chromium

      - name: Build KarmoLab JavaScript (TypeScript)
        working-directory: apps/karmolab
        run: |
          npm ci
          npm run build

      - name: Prepare KarmoLab Jekyll page
        run: |
          mkdir -p apps/blog/karmolab
          cp apps/karmolab/index.html apps/blog/karmolab/index.html
          # TASK-YB-042: 디스코드 봇 소개 페이지(/karmolab/bot/) — 봇 초대 입구.
          mkdir -p apps/blog/karmolab/bot
          cp apps/karmolab/bot/index.html apps/blog/karmolab/bot/index.html

      # TASK-KL-088: 도구별 정적 페이지(/karmolab/t/<id>/) + 허브(/karmolab/t/).
      # Jekyll 이 그대로 빌드하므로 jekyll-sitemap 이 자동 수집한다.
      - name: Generate KarmoLab tool pages
        working-directory: apps/karmolab
        run: npm run gen:tool-pages

      - name: Build site
        working-directory: apps/blog
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 글 속 사진 743MB 를 배포 꾸러미에서 뺀다. Pages 는 사이트 전체를 매번 통째로 올려 펼치므로,
      # 도구 파일 한 줄만 고쳐도 이 무게를 다시 물었다 — 배포 단계가 5분 → 10분 → 타임아웃으로 늘었다.
      # 사진은 `_config.yml` 의 cdn 주소(img.mascari4615.com)에서 나오므로 결과물에 있을 이유가 없다.
      # 저장소 원본은 그대로다. 되돌리려면 이 단계만 지우고 cdn 을 비우면 된다.
      # exclude 로는 안 된다 — 이 저장소가 자기 테마라 사진이 테마 파일로 복사된다(_config.yml 참고).
      - name: Drop post images from artifact (served from R2)
        run: |
          SITE="apps/blog/_site${{ steps.pages.outputs.base_path }}"
          # 빼기 전에, 화면이 아직 옛 경로를 가리키는 곳이 없는지 본다. 실제로 한 건 있었다 —
          # 글에 슬래시가 두 번 찍힌 오타가 있으면 테마가 외부 주소로 착각해 사진 주소를 안 붙이고,
          # 그 사진만 조용히 깨진다. 200 응답만 봐서는 절대 안 잡히므로 여기서 막는다.
          LEFT=$(grep -rl '"/assets/img/post' "$SITE" --include=*.html || true)
          if [ -n "$LEFT" ]; then
            echo "::error::사진 주소가 안 붙은 페이지가 있다 (빼면 깨진다):"; echo "$LEFT"; exit 1
          fi
          rm -rf "$SITE/assets/img/post"
          du -sh "$SITE"

      - name: Merge KarmoLab output to site
        run: |
          mkdir -p apps/blog/_site/apps/karmolab
          rsync -a --exclude 'node_modules' apps/karmolab/ apps/blog/_site/apps/karmolab/
          mkdir -p apps/blog/_site/apps/karmolab-react-src
          rsync -a --exclude 'node_modules' apps/karmolab-react-src/ apps/blog/_site/apps/karmolab-react-src/

      - name: Test site
        working-directory: apps/blog
        run: |
        #    bundle exec htmlproofer _site \
        #      \-\-disable-external \
        #      \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "apps/blog/_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # 대기 시간은 못 늘린다 — `timeout` 을 30분으로 줘 봤지만 이 액션이 10분을 최대치로
        # 못 박아 놔서 그대로 10분에 끊겼다(로그에 timeout: 1800000 이 찍히고도 정확히 10분).
        # 즉 GitHub 이 10분 안에 못 끝내면 방법이 없다. 우리가 줄일 수 있는 건 꾸러미뿐이라
        # 사진 743MB 를 뺐다(위 단계). 그래도 10분을 넘으면 GitHub 쪽 지연이니 재시도가 답이다.
        uses: actions/deploy-pages@v4
