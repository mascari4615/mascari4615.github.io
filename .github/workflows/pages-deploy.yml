name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    # allow-list: pages-deploy 가 실제 빌드 입력으로 쓰는 dir 만 트리거.
    # 새 sub-app / root 파일 추가돼도 기본 미트리거 (default safe).
    # 의존 누락 발견 시 본 목록 갱신 (TASK-KL-057).
    paths:
      - apps/blog/**
      - apps/karmolab/**
      - apps/karmolab-react-src/**
      - apps/daily/**
      - apps/higher/**
      - apps/quest/**
      - apps/play/**
      - packages/karmolab-ai/**
      - packages/badapple/**
      - .github/workflows/pages-deploy.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나. 단 **돌던 것을 끊지 않는다** —
# 여러 세션이 몇 분 간격으로 밀어 넣는데 배포가 5~10분이라, 끊는 설정에서는
# 배포가 끝까지 가는 일 자체가 드물었다 (실측: 연속 3건이 완주 못 하고 취소).
# 끊지 않으면 돌던 것은 끝나고, 대기 중이던 것만 최신 것으로 교체된다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # === KL-190: 밀린 판은 **일하지 않고 비킨다** ===
  #
  # 세션이 여섯이라 push 는 계속 들어온다(그게 전제다). 그런데 이 워크플로는 줄을 서므로
  # (`cancel-in-progress: false`), 다섯 번 push 하면 5분짜리 배포가 **다섯 번 차례로** 돈다.
  # 앞의 넷은 어차피 최신 판을 짓지도 않는데 뒤에 온 사람의 차례를 밀어낸다.
  #
  # 겹침은 위의 `concurrency: pages` 하나로 충분하다 — 돌던 것은 끝까지 가고, 대기는 최신
  # 하나만 남는다(깃허브가 오래된 대기를 스스로 지운다).
  #
  # ⚠ 예전에 그 위에 「시작할 때 내가 최신인지 묻고 아니면 비킨다」(tip 잡)를 얹었다가
  # **배포가 통째로 멈췄다** (2026-08-09 실측). 세션 여섯이 3분 간격으로 밀어서 **아무도 최신이
  # 못 됐고**, 그래서 모든 실행이 「성공」인데 build 는 skipped 였다 — 최근 성공 5건 전부
  # 그랬다. 실제로 올라간 판은 하루 종일 0. 로그는 초록이라 아무도 몰랐다.
  #
  # 「비키기」는 **누군가는 남는다**는 전제가 있어야 성립한다. 밀어대는 속도가 빌드보다 빠르면
  # 그 전제가 깨지고 전원이 비킨다. 그래서 뺐다 — 겹침 관리는 concurrency 한 곳에서만.

  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      # 예전에 여기 「3분 기다렸다 시작」 + 「기다리는 중이면 새 push 가 취소」가 있었다.
      # 겹치는 배포를 없애려던 것인데, 세션이 여섯이라 **3분이 한 번도 안 닫혔다** —
      # 기다리다 취소되고, 새 것이 다시 3분을 기다리고, 그 사이 또 push 가 온다.
      # 실측(2026-08-08): 40건 중 취소 22 · 성공 3, 취소된 것의 **21건이 200초를 못 넘겼고
      # 중앙값이 39초**였다. 내 번들이 한 시간 넘게 실사이트에 못 나갔다.
      #
      # 겹침을 막는 일은 위(run 단위) `concurrency: pages` 가 이미 한다 — 돌던 것은 끝까지
      # 가고, 대기는 **최신 하나만** 남는다(깃허브가 오래된 대기를 스스로 지운다).
      # 그래서 여기서 또 기다릴 이유가 없고, 기다리면 굶는다.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          working-directory: apps/blog

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/blog/package-lock.json

      - name: Install blog dependencies
        working-directory: apps/blog
        run: npm ci

      - name: Build theme assets (CSS and JS)
        working-directory: apps/blog
        run: npm run build

      - name: Build post graph data
        working-directory: apps/blog
        run: npm run build:graph

      - name: Build KarmoLab React App
        working-directory: apps/karmolab-react-src
        run: |
          npm ci
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build karmolab-ai (shared package — apps/karmolab dependency)
        working-directory: packages/karmolab-ai
        run: |
          npm ci
          npm run build

      # 이 꾸러미는 자기 개발 의존성도 잠금 파일도 없다 (`npm ci` 로는 못 짓는다).
      # 짓지 않으면 앱 쪽에서 「모듈을 못 찾는다」로 배포가 통째로 선다 — 실제로 섰다.
      - name: Build badapple (shared package - apps/karmolab dependency)
        working-directory: packages/badapple
        run: npx -y -p typescript@5 tsc -p tsconfig.json

      - name: Build KarmoLab JavaScript (TypeScript)
        working-directory: apps/karmolab
        # `npm run build` 안에는 **화면을 실제로 열어 보는 검사**가 여럿 있다(글판 마크다운·성능
        # 예산·커버리지·뒷정리 …). `npm ci` 는 playwright 꾸러미만 깔고 **브라우저는 안 깐다** —
        # 그래서 배포 잡에서 「Executable doesn't exist」로 통째로 섰다(2026-08-09 실측).
        # 검사 쪽에도 관문을 뒀지만(없으면 「못 돌림」으로 빠진다) 관문 없는 남의 검사가 더 많고,
        # 무엇보다 **여기서는 실제로 재는 편이 맞다** — 배포 직전이 마지막 그물이다.
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Prepare KarmoLab Jekyll page
        run: |
          mkdir -p apps/blog/karmolab
          cp apps/karmolab/index.html apps/blog/karmolab/index.html

      # TASK-KL-129: 봇 소개(/karmolab/bot/)·프로필(/karmolab/u/)을 **앱 셸에 얹어** 찍는다.
      # 예전에는 원본을 그대로 복사했다 — 그러면 도구를 쓰다 그리로 갈 때 머리띠도 옆줄도
      # 테마 단추도 ⌘K 도 없는 다른 집으로 떨어졌다. 내용의 주인은 여전히 원본 문서다.
      - name: Generate KarmoLab shell pages (bot · profile)
        working-directory: apps/karmolab
        run: npm run gen:shell-pages

      # TASK-KAR-202: 「오늘의 하나 맞히기」(/daily/) — 의존성 0, 번들러 0.
      # 규칙 시험이 먼저 돌고(npm test), 통과해야 페이지가 나온다.
      - name: Build daily guess game
        working-directory: apps/daily
        run: npm run build
      - name: Prepare daily Jekyll pages
        run: |
          mkdir -p apps/blog/daily
          cp -r apps/daily/dist/. apps/blog/daily/

      # TASK-KL-089: 놀이 둘 — 「높은 쪽 고르기」·「오늘의 문제」는 KarmoLab 앱 안으로 들어갔다
      # (`/karmolab/#higher` · `/karmolab/#quest`). 알맹이(위젯 js·문제 표)는 앱 빌드와
      # 아래 rsync 가 실어 나른다. 여기서는 이미 밖에 나가 있던 옛 주소만 살려 둔다 —
      # 두 파일 다 새 자리로 넘겨보내는 한 장짜리다.
      - name: Prepare moved-game redirects
        run: |
          mkdir -p apps/blog/higher apps/blog/quest apps/blog/play
          cp apps/higher/index.html apps/blog/higher/index.html
          cp apps/quest/index.html apps/blog/quest/index.html
          cp apps/play/base.css apps/blog/play/base.css

      # TASK-KL-088: 도구별 정적 페이지(/karmolab/t/<id>/) + 허브(/karmolab/t/).
      # Jekyll 이 그대로 빌드하므로 jekyll-sitemap 이 자동 수집한다.
      # TASK-KL-098: 커뮤니티 글의 정적 페이지(/karmolab/c/<글id>/).
      # 화면이 스크립트로 그리는 글은 검색엔진이 못 읽어 **하나도 색인되지 않는다**.
      # 서버(노트북)에 못 닿으면 그냥 건너뛴다 — 노트북이 꺼졌다고 사이트 배포가 막히면 안 된다.
      - name: Generate KarmoLab community pages
        working-directory: apps/karmolab
        run: npm run gen:community

      # TASK-KL-151 ⑪: 놀이마다 한 장씩 — 놀이는 앱 안 해시로만 살아서 검색에 걸릴 글이
      # 한 줄도 없었다. 사람은 「놀이터」가 아니라 「이상형 월드컵」으로 검색한다.
      # TASK-KL-151 ⑬: 「도구 월드컵」 표를 굽는다 — 남의 그림을 퍼다 심지 않으려고
      # **우리가 구운** 도구 공유 카드로만 만든다. 봇이 뜰 때 이 파일을 씨앗 표로 심는다.
      - name: Generate KarmoLab tools worldcup table
        working-directory: apps/karmolab
        run: npm run gen:worldcup-tools

      - name: Generate KarmoLab play pages
        working-directory: apps/karmolab
        run: npm run gen:play-pages

      - name: Generate KarmoLab tool pages
        working-directory: apps/karmolab
        run: npm run gen:tool-pages

      # TASK-KL-135: 도구 화면을 미리 그려 HTML 에 박는다 — 스크립트 없이도 도구가 보인다.
      # 화면을 실제로 열어 봐야 하므로 눌러 볼 서버를 잠깐 띄우고, 그 화면을 열 브라우저를 받는다.
      #
      # 2026-08-08: 이 단계는 **한 번도 실제로 돈 적이 없다**. 브라우저를 안 받아 둬서
      # `browserType.launch: Executable doesn't exist` 로 죽었는데 `|| true` 가 그걸 삼켰다.
      # 그래서 로컬에는 129장이 다 박혀 있는데 실제 사이트는 0장이었다 — 배포는 내내 초록.
      # 이제 브라우저를 명시적으로 받고, 실패는 배포를 세운다(조용히 넘어가는 길 없음).
      # (브라우저는 위 「Build KarmoLab JavaScript」 단계에서 이미 받았다 — 그 단계의 검사들도
      #  브라우저가 있어야 돌기 때문이다. 여기서 또 받을 필요 없다.)

      - name: Prerender KarmoLab tool pages
        working-directory: apps/karmolab
        run: |
          npm run serve:gzip &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8801/apps/blog/karmolab/t/ && break
            sleep 1
          done
          npm run prerender
          kill %1 || true

      # 도구 장의 **언어 판** (TASK-KL-203). 반드시 이 자리다:
      #  - `gen:tool-pages` 와 `prerender` **뒤** — 한국어 장을 입력으로 받아 옮기므로,
      #    앞에서 돌면 볼 것이 없어 조용히 0장을 찍는다(로컬엔 지난 산출물이 남아 초록으로 보인다).
      #  - `stamp` **앞** — 파일 이름에 지문을 박는 단계가 언어 장까지 함께 손봐야 한다.
      # 검사도 여기서 같이 돈다 — `npm run build` 안의 같은 검사는 장이 생기기 전이라 건너뛴다.
      - name: Generate KarmoLab tool pages (other languages)
        working-directory: apps/karmolab
        run: |
          npm run gen:tool-pages-locale
          npm run test:i18n:pages
          npm run test:widget-i18n

      # TASK-KL-128 ②③: 화면을 옮기는 길이 실제로 빠른가 (미리 실행·이어 붙이기·뒤로 가기).
      #
      # 2026-08-08: 이 검사가 `npm run build` 안에 있어서 **도구 페이지가 만들어지기도 전에**
      # 돌았다. 볼 화면이 없으니 늘 「링크를 못 찾았다」로 죽었고, 그 한 줄이 사이트 배포를
      # 통째로 세웠다(로컬은 지난 빌드 산출물이 남아 있어 초록이었다).
      # 이제 도구 페이지를 다 찍은 **뒤에** 돈다 — 재는 대상이 실제로 있는 자리.
      - name: Check KarmoLab navigation (prerender · view transitions · bfcache)
        working-directory: apps/karmolab
        run: npm run test:navigation

      # TASK-KL-128: 파일 이름에 내용 지문을 박고, 찍어 둔 화면들이 그 이름을 부르게 바꾼다.
      # 그래야 서비스 워커가 「한 번 받은 것은 영원히 그대로」로 둘 수 있다(재방문 = 네트워크 0).
      # 도구 페이지를 다 찍은 **뒤**에 돌아야 한다 — 바꿀 화면이 그때 생긴다.
      - name: Stamp KarmoLab assets with content hashes
        working-directory: apps/karmolab
        run: npm run stamp

      # 관문은 도구 페이지가 만들어진 **뒤에** 만든다 — 놀이가 그 페이지로 가므로,
      # 먼저 돌면 「그 자리에 파일이 없다」고 옳게 멈춘다(실제로 그렇게 배포가 섰다).
      - name: Build playground hub
        run: node apps/play/scripts/build.mjs
      - name: Copy playground hub
        run: |
          mkdir -p apps/blog/play
          cp apps/play/index.html apps/blog/play/index.html

      - name: Build site
        working-directory: apps/blog
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 글 속 사진 743MB 를 배포 꾸러미에서 뺀다. Pages 는 사이트 전체를 매번 통째로 올려 펼치므로,
      # 도구 파일 한 줄만 고쳐도 이 무게를 다시 물었다 — 배포 단계가 5분 → 10분 → 타임아웃으로 늘었다.
      # 사진은 `_config.yml` 의 cdn 주소(img.mascari4615.com)에서 나오므로 결과물에 있을 이유가 없다.
      # 저장소 원본은 그대로다. 되돌리려면 이 단계만 지우고 cdn 을 비우면 된다.
      # exclude 로는 안 된다 — 이 저장소가 자기 테마라 사진이 테마 파일로 복사된다(_config.yml 참고).
      - name: Drop post images from artifact (served from R2)
        run: |
          SITE="apps/blog/_site${{ steps.pages.outputs.base_path }}"
          # 빼기 전에, 화면이 아직 옛 경로를 가리키는 곳이 없는지 본다. 실제로 한 건 있었다 —
          # 글에 슬래시가 두 번 찍힌 오타가 있으면 테마가 외부 주소로 착각해 사진 주소를 안 붙이고,
          # 그 사진만 조용히 깨진다. 200 응답만 봐서는 절대 안 잡히므로 여기서 막는다.
          LEFT=$(grep -rl '"/assets/img/post' "$SITE" --include=*.html || true)
          if [ -n "$LEFT" ]; then
            echo "::error::사진 주소가 안 붙은 페이지가 있다 (빼면 깨진다):"; echo "$LEFT"; exit 1
          fi
          rm -rf "$SITE/assets/img/post"
          du -sh "$SITE"

      - name: Merge KarmoLab output to site
        run: |
          mkdir -p apps/blog/_site/apps/karmolab
          rsync -a --exclude 'node_modules' apps/karmolab/ apps/blog/_site/apps/karmolab/
          mkdir -p apps/blog/_site/apps/karmolab-react-src
          rsync -a --exclude 'node_modules' apps/karmolab-react-src/ apps/blog/_site/apps/karmolab-react-src/

      - name: Test site
        working-directory: apps/blog
        run: |
        #    bundle exec htmlproofer _site \
        #      \-\-disable-external \
        #      \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "apps/blog/_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # (같은 커밋에서 브라우저 설치 단계도 빠졌다 — 도구 동작 시험을 test:behavior 로 갈라낸 뒤
      #  이 배포 빌드에는 브라우저가 필요 없어졌다. 빌드 사슬 전수로 확인했다: 필요 0.)
      # 오래된 판이 새 판을 덮어쓰는 것을 막는다 (TASK-KL-088).
      # 배포는 사이트 전체를 통째로 바꾸므로, 뒤늦게 끝난 옛 커밋의 판이 나중에 배포되면
      # 방금 나간 것들이 도로 사라진다. 실제로 오늘 새벽 그 일이 나서 손으로 취소해 왔다.
      # 물러나는 조건은 아래 단계가 정한다 — 「이미 더 새 판이 배포했는가」 하나뿐이다.
      # (실패가 아니다. 여기서 붉은불을 켜면 진짜 고장과 구분이 안 된다.)
      - name: 나보다 새 판이 이미 배포했는가
        id: freshness
        # 이 게이트는 두 번 틀렸다. 기록해 둔다 (2026-08-07 실측).
        #
        # ① 「내가 master 의 끝인가」 — 빌드가 10분인데 push 간격이 그보다 짧으면 *모든* 판이
        #    물러난다. 그 새 커밋의 판도 도착할 때쯤엔 또 끝이 아니다. 아무도 배포 안 하는데
        #    다섯 판 연속 초록이었다.
        # ② 「나보다 새 판이 돌고 있는가」 — 같은 이유로 굶는다. 돌고 있는 판도 자기 차례엔
        #    또 다른 새 판을 보고 물러난다. 「앞으로 일어날 일」을 조건에 넣으면 줄이 안 끝난다.
        #
        # 그래서 **이미 일어난 일**만 본다: 나보다 새 판이 *실제로 배포에 성공했나?*
        # 그랬다면 내가 나가면 사이트가 뒤로 간다 → 물러난다 (KL-088 이 막으려던 그 사고).
        # 아니면 배포한다. 이 조건은 한 번 참이 되면 계속 참이라 굶지 않는다.
        run: |
          MINE=${{ github.run_number }}
          REPO=${{ github.repository }}
          NEWER=$(gh api "repos/$REPO/actions/workflows/pages-deploy.yml/runs?branch=master&status=completed&per_page=30"             --jq "[.workflow_runs[] | select(.run_number > $MINE) | .id] | .[]")
          DEPLOYED=0
          for id in $NEWER; do
            OK=$(gh api "repos/$REPO/actions/runs/$id/jobs"               --jq '[.jobs[] | select(.name == "deploy") | .steps[] | select(.name | startswith("Deploy")) | select(.conclusion == "success")] | length')
            if [ "${OK:-0}" -gt 0 ]; then DEPLOYED=1; echo "더 새 판 $id 가 이미 배포했다"; break; fi
          done
          if [ "$DEPLOYED" = "1" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::더 새 판이 이미 배포했다 — 물러난다 (나가면 사이트가 뒤로 간다)"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "::notice::나보다 새 판이 배포한 적 없다 — 배포한다"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 왜 죽었는지를 **배포가 스스로 적는다** (TASK-KL-161).
      #
      # 예전에는 건강 검사가 실패 이유를 알려고 실패한 판마다 로그를 통째로 내려받아 읽었다.
      # 한 건에 몇 초씩 걸려서, 실패가 잦은 날에는 재는 일 자체가 느려졌다.
      # 죽은 자리는 죽은 쪽이 제일 잘 안다 — 여기서 한 줄로 적어 두면 아무도 안 캐도 된다.
      # 실패한 단계 이름만으로 충분하다(무엇이 죽었나). 자세한 것은 그때 로그를 보면 된다.
      - name: 왜 죽었는지 남긴다
        if: failure()
        run: |
          # `join(steps.*.outcome, …)` 은 여기서 못 쓴다 — 워크플로가 **아예 안 뜬다**
          # (job 0개 · startup failure). 2026-08-08 배포가 4연속 그렇게 죽어 사이트 전체가 섰다.
          echo "::error::배포 실패 — 위 단계들 중 빨간 것을 봐라"
          echo "배포 실패 — 위 단계 목록에서 빨간 것을 확인" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.stale != 'true'
        id: deployment
        # 대기 시간은 못 늘린다 — `timeout` 을 30분으로 줘 봤지만 이 액션이 10분을 최대치로
        # 못 박아 놔서 그대로 10분에 끊겼다(로그에 timeout: 1800000 이 찍히고도 정확히 10분).
        # 즉 GitHub 이 10분 안에 못 끝내면 방법이 없다. 우리가 줄일 수 있는 건 꾸러미뿐이라
        # 사진 743MB 를 뺐다(위 단계). 그래도 10분을 넘으면 GitHub 쪽 지연이니 재시도가 답이다.
        uses: actions/deploy-pages@v4
