name: Decommission Laptop Autopilot (KAR-076)

# One-shot: TASK-KAR-076 a) — laptop scheduled autopilot decommission.
# Desktop session cannot touch laptop FS; run on the laptop self-hosted
# runner (same as deploy/diagnose) to Unregister ClaudeCode-Autopilot-*
# scheduled tasks. Read-only listing + targeted Unregister. ASCII-ONLY
# run block (GH Actions writes BOM-less .ps1; PS5.1 Korean Windows reads
# cp949 -> non-ASCII corrupts -> parse error).

on:
  workflow_dispatch:

jobs:
  decommission:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5
    steps:
      - name: List and unregister autopilot scheduled tasks
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "===== machine ====="
          Write-Host ("COMPUTER : " + $env:COMPUTERNAME)
          Write-Host ("WHOAMI   : " + (whoami))
          Write-Host ""
          Write-Host "===== autopilot scheduled tasks (before) ====="
          $tasks = Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'ClaudeCode-Autopilot|ClaudeCode-WM-night|autopilot' }
          if ($tasks) {
            $tasks | Select-Object TaskName,State | Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host "(none found - already clean)"
          }
          Write-Host ""
          Write-Host "===== unregister ====="
          if ($tasks) {
            foreach ($t in $tasks) {
              try {
                Unregister-ScheduledTask -TaskName $t.TaskName -Confirm:$false -ErrorAction Stop
                Write-Host ("unregistered: " + $t.TaskName)
              } catch {
                Write-Host ("FAILED " + $t.TaskName + " : " + $_.Exception.Message)
              }
            }
          } else {
            Write-Host "(nothing to unregister)"
          }
          Write-Host ""
          Write-Host "===== verify (after) ====="
          $rem = Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'ClaudeCode-Autopilot|ClaudeCode-WM-night|autopilot' }
          if ($rem) {
            $rem | Select-Object TaskName,State | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "RESULT: STILL PRESENT"
          } else {
            Write-Host "RESULT: CONFIRMED - no autopilot scheduled tasks on laptop"
          }
