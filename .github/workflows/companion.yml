name: "동반자 꾸러미 (packages/companion)"

# 왜 따로 있나 (2026-08-16, 실측)
#
# `verify.mjs` 는 `packages/companion/node_modules` 가 있을 때만 그 꾸러미의 build+test 를
# 돌린다 — 없으면 「skip」 한 줄 적고 지나간다. 그런데 **CI 는 이 꾸러미를 한 번도 안 깔았다.**
# 워크플로 전체를 뒤져도 `companion` 이라는 글자가 없었다. 즉 이 꾸러미의 검사는
# **내 자리에서만** 돌았고, 밀린 판에서는 매번 조용히 건너뛰어 왔다.
#
# 그렇다고 `verify` 에 설치를 얹지 않는다: 이 꾸러미는 `@huggingface/transformers` 를 쓰고
# 설치가 수십~수백 MB 다. 며칠에 한 번 바뀌는 것 때문에 **매 push 가 몇 분씩 길어지면**
# 그 값이 훨씬 비싸다(같은 이유로 Rust 도 「건드렸을 때만」이다 — `verify.yml` 참고).
#
# 그래서 **건드렸을 때만** 판정한다. 안 건드린 날은 안 돌고, 건드린 날은 반드시 돈다.

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/companion/**'
      - '.github/workflows/companion.yml'
  pull_request:
    paths:
      - 'packages/companion/**'
  workflow_dispatch:

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 동반자 꾸러미 build + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/companion/package-lock.json

      # 이 꾸러미는 옆 꾸러미(`karmolab-ai`)를 file: 로 가리킨다 — 그것부터 있어야 깔린다.
      - name: 옆 꾸러미부터
        run: cd packages/karmolab-ai && npm ci && npm run build

      - name: 깔기
        run: cd packages/companion && npm ci

      # 창 검사(`test/face-screen.test.mjs`)는 **진짜 브라우저**를 띄운다 — 글자 맞춰보기로는
      # 「창을 여는 것만으로 터지는」 종류(body3d TDZ)를 못 잡는다. 크로뮴이 없으면 그 검사는
      # 건너뛰지 않고 **실패한다**(조용히 안 도는 검사는 없는 검사다). 그래서 여기서 깐다.
      - name: 크로뮴 깔기 (창 검사용)
        # `--with-deps`(apt 로 시스템 라이브러리)는 2026-08-20 실측에서 15분을 넘겨 멎었다.
        # 우분투 러너엔 필요한 것이 대개 이미 있다. 없으면 창 검사가 **빨갛게 실패**하므로
        # (건너뛰지 않는다) 그때 `--with-deps` 로 되돌리면 된다.
        run: cd packages/companion && npx playwright install chromium
        timeout-minutes: 6

      - name: build + test
        run: cd packages/companion && npm test
