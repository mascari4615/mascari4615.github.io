name: "karmolab-mcp 발행"

# 왜 워크플로로 두는가 (TASK-KL-205)
#
# `npm publish` 를 사람 터미널에서 치면 2FA 때문에 **브라우저 승인**이 끼어든다. 그런데 우리가
# 명령을 돌리는 자리(에이전트 셸·CI)는 TTY 가 아니라서, npm 이 승인 URL 만 찍고 그대로 죽는다
# (2026-08-10 에 세 번 그랬다). 즉 발행이 **사람이 창 앞에 앉아 있는지**에 달려 있었다.
#
# 여기서는 그 의존을 끊는다. **비밀은 안 쓰는 쪽이 기본이다** — npm 의 Trusted Publishing
# (OIDC)을 쓰면 저장소에 토큰을 두지 않고도 발행된다. npm 이 이 저장소·이 워크플로를 신뢰하도록
# 한 번 등록해 두면, 그다음부터는 깃허브가 발급한 일회용 증명으로 올라간다.
# (npm 자신이 「bypass-2FA 토큰은 위험하니 Trusted Publishing 을 쓰라」고 안내한다.)
#
# 닭-달걀이 하나 있다: Trusted Publisher 는 **이미 있는 패키지**에 등록한다. 그래서 순서는
#   ① 첫 판만 사람이 진짜 터미널에서 발행 → ② npmjs.com 에서 이 워크플로를 신뢰 등록
#   → ③ 그 뒤로는 버튼. 그 전까지는 `NPM_TOKEN` 비밀이 있으면 그걸로도 돈다(임시 우회).
#
# 손으로만 돌린다(`workflow_dispatch`) — 태그·push 에 매달지 않는다. 발행은 되돌리기 어려우니
# **사람이 누르는 순간**이 있어야 한다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "진짜로 올리지 말고 흉내만 (기본: 흉내)"
        type: boolean
        default: true
      publish_registry:
        description: "공식 MCP 레지스트리에도 등재 (server.json) — 기본: 안 함"
        type: boolean
        default: false

concurrency:
  group: npm-publish-mcp
  cancel-in-progress: false

# OIDC 증명을 받으려면 이 권한이 있어야 한다. 없으면 Trusted Publishing 이 조용히 토큰
# 방식으로 떨어진다 — 그러면 「비밀 없이 된다」던 약속이 깨진 걸 아무도 모른다.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ★ `registry-url` 을 주지 **않는다.**
      #
      # 그 옵션을 주면 setup-node 가 `.npmrc` 에 `_authToken=${NODE_AUTH_TOKEN}` 를 박는다.
      # 토큰이 비어 있어도 npm 은 「인증 방법이 지정돼 있다」고 보고 **OIDC 를 시도조차 안 한다** —
      # 그래서 ENEEDAUTH 로 죽었다(2026-08-10 실측, 네 번째 튕김).
      # Trusted Publishing 을 쓰려면 이 자리를 비워 두는 게 맞다.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Trusted Publishing(OIDC)은 **npm 11.5.1+** 에만 있다. Node 20 이 데려오는 npm 10 으로는
      # 조용히 토큰 방식으로 떨어진다. 그래서 npm 만 올린다.
      #
      # `npm@latest` 를 쓰면 안 된다 — 지금 최신은 12.x 이고 **Node 22+ 를 요구한다**.
      # Node 20 위에서 그걸 깔면 EBADENGINE 으로 죽는다(2026-08-10 실측, 이 워크플로가 그렇게 섰다).
      # Node 를 22 로 올리는 방법도 있지만, 그러면 이 저장소의 다른 빌드와 판이 갈린다.
      # 필요한 것은 「최신」이 아니라 「OIDC 가 되는 판」이므로 11 계열로 못을 박는다.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@11
          npm --version

      # 알맹이는 화면 쪽 저장소에 있고, 빌드에 그쪽 esbuild 를 빌려 쓴다.
      - name: Install karmolab deps
        working-directory: apps/karmolab
        run: npm ci

      # 발행 전에 **남이 설치해서 쓸 수 있는지**까지 확인한다. 여기가 빨가면 올리지 않는다.
      # (이 검사는 npm 을 못 부르는 자리에서는 스스로 CANNOT-RUN 을 말하고 비켜선다.)
      - name: Verify package
        working-directory: apps/karmolab
        run: |
          node ../../packages/karmolab-mcp/build.mjs
          node scripts/smoke-mcp.mjs
          node scripts/smoke-mcp-install.mjs

      - name: Publish
        working-directory: packages/karmolab-mcp
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            # 토큰이 있으면 그걸 쓴다(임시 우회). 없으면 아무 것도 안 적고 OIDC 에 맡긴다 —
            # 빈 값으로라도 `.npmrc` 를 적으면 npm 이 OIDC 를 건너뛴다.
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "NPM_TOKEN 으로 발행한다 (임시 우회)."
          else
            echo "토큰 없음 — Trusted Publishing(OIDC)으로 발행한다. 이게 바라던 길이다."
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "흉내만 낸다 (dry_run=true). 진짜로 올리려면 다시 돌리며 체크를 끄면 된다."
            npm publish --access public --dry-run
            exit 0
          fi
          # 같은 판이 이미 올라가 있으면 npm 은 에러를 낸다. 그건 **고장이 아니라 「할 일 없음」**이다 —
          # 여기서 죽으면 뒤에 오는 레지스트리 등재까지 못 돈다(등재만 하려는 경우가 실제로 있다).
          version=$(node -p "require('./package.json').version")
          if npm view "karmolab-mcp@${version}" version > /dev/null 2>&1; then
            echo "karmolab-mcp@${version} 은 이미 올라가 있다 — npm 발행은 건너뛴다."
            echo "새 판을 올리려면 먼저 버전을 올려라: npm version patch"
            exit 0
          fi
          npm publish --access public

      - name: What landed
        if: ${{ inputs.dry_run == false }}
        run: |
          sleep 10
          npm view karmolab-mcp version dist.tarball

      # ── 공식 MCP 레지스트리 (registry.modelcontextprotocol.io)
      #
      # npm 은 「꾸러미가 어디 있나」, 레지스트리는 「이런 서버가 있다」를 맡는다. 둘 다 해야
      # 사람이 찾는다. 여기서도 **토큰을 안 쓴다** — 깃허브가 발급한 일회용 증명(OIDC)으로
      # 네임스페이스(`io.github.Mascari4615/…`) 소유를 증명한다. 공식 안내가 권하는 방식이다.
      #
      # 기본은 **안 함**이다. 등재는 바깥에 내보내는 행동이라, 누를 때 한 번 더 고르게 한다.
      - name: Publish to MCP Registry
        if: ${{ inputs.publish_registry && inputs.dry_run == false }}
        working-directory: packages/karmolab-mcp
        run: |
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
