name: "KarmoGraph 화면 검사"

# 왜 따로 있나 (TASK-KL-202 / 2026-08-12)
#
# 2026-08-12, KarmoGraph 는 **앱에서 열면 아무것도 안 뜨는 상태**로 master 에 얹혀 있었다.
# `packs.ts` 가 팩 라벨을 묶음 실행 시점에 `t()` 로 꺼냈고, 그 시점은 말 묶음이 오기 전이라
# `t()` 가 던졌다. 묶음이 통째로 죽어 `Toolbox.register` 까지 못 갔다. 그동안
# typecheck, `test:karmograph`(브라우저 없는 알맹이 시험), `audit-i18n-eager` 는 **전부 초록**이었다.
# 없는 것은 검사할 대상이 없고, 알맹이 시험은 화면을 안 띄우기 때문이다.
#
# 그 자리를 실제로 잡는 검사(`scripts/smoke-karmograph.mjs`, 항목 60여 개)는 이미 있었다.
# 다만 **아무 데서도 안 돌고 있었다**. 손으로 부를 때만 도는 검사는 없는 검사다. 그래서 여기 붙인다.
#
# 배포를 막지 않는다: 브라우저 설치가 배포를 느리게 하고, 배포 관문에 붙였다 빼낸 이력이 있다
# (daily-browser-check.yml 과 같은 판단). 여기가 빨개도 사이트는 나간다. 대신 반드시 보이게 둔다.

on:
  # ★ **push 마다 돌리지 않는다** (2026-08-12 에 push 트리거로 바꿔 봤다가 되돌린 자리).
  #   이 저장소는 몇 분 간격으로 push 가 들어오는데, 이 검사는 브라우저를 깔고 앱을 지어
  #   화면을 띄우느라 10분 대다. 러너 차례를 기다리는 판이 쌓이면서 **여섯 판 연속 판정이
  #   안 났다**. 초록도 빨강도 아닌 것은 신호가 아니다. 시계로 돌려서 반드시 끝나게 한다.
  #   (검사 자체를 고칠 때는 아래 push 트리거가 그 판을 바로 돌려 준다.)
  push:
    branches: [main]
    paths:
      - apps/karmolab/scripts/smoke-karmograph.mjs
      - .github/workflows/karmograph-browser-check.yml
  # 캔버스는 셸, 로더, i18n 바탕 위에 얹혀 있다. 그쪽이 바뀌어도 여기가 죽을 수 있으므로
  # 한 시간에 한 번 무조건 띄워 본다 (이번 사고도 캔버스 파일 밖에서 시작됐다).
  schedule:
    - cron: "23 * * * *"
    # ★ **흔들리는 판을 잡는 자의 집** (2026-08-16). 여러 판 돌려 한 번이라도 빨개진 항목을
    #   세는 검사는 16분이 걸린다. 한 시간짜리 라이브 판에 넣었더니 그 조각이 40분 지붕의
    #   71% 를 썼다(실측 28.3분). 흔들림 통계는 하루 한 번이면 충분하다. 이 줄이 그 자리다.
    - cron: "23 17 * * *"
  workflow_dispatch:

# ★ 앞 실행을 **취소하지 않는다** (2026-08-12).
#   이 검사는 브라우저를 깔고 화면을 띄우느라 20분 가까이 걸린다. 그런데 몇 분 간격으로
#   푸시가 들어오는 저장소라, 취소 규칙을 켜 두면 **끝까지 간 판이 한 번도 없다**. 실측:
#   최근 다섯 판이 전부 취소, 판정된 적 없음. 게이트 수명 검사가 이걸 방치로 집어냈다.
#   초록도 빨강도 아닌 것은 신호가 아니다. 몇 초짜리 idempotent 검사(memo 의 repo gates)와
#   달리, 여기서는 **늦게라도 한 판을 끝내는 쪽**이 옳다. 줄을 세운다.
concurrency:
  group: karmograph-browser-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/karmolab
    steps:
      - uses: actions/checkout@v4

      # ★ **짓기 전 채비는 한 곳에서** (2026-08-13, `.github/actions/setup-karmolab`).
      #   같은 목록을 워크플로 넷이 각자 들고 있었고, 한쪽만 고친 값이 25판 연속 빨강이었다.
      - uses: ./.github/actions/setup-karmolab
        with:
          chromium: 'true'

      # ★ **여는 절차는 `scripts/run-karmograph-live.mjs` 하나뿐이다** (2026-08-13).
      #   예전에는 이 자리에 말 묶음 짓기 → 앱 짓기 → 서버 띄우기 → 묶음이 200 될 때까지
      #   기다리기 → 검사가 손으로 적혀 있었다. 그래서 **내 컴퓨터에서 같은 것을 돌릴 방법이
      #   없었고**, 빨강 하나 볼 때마다 밀고 20분을 기다렸다. 이제 로컬도 여기도 같은 파일이다:
      #     cd apps/karmolab && npm run verify:karmograph
      #   (단계별 상한이 필요한 이유는 그대로다. 검사 안 STEP_LIMIT_MS 와 아래 timeout 이 그 몫.)
      - name: 캔버스를 실제로 띄워서 만져 본다 (로컬 = npm run verify:karmograph)
        timeout-minutes: 15
        run: npm run verify:karmograph


      # 하루 한 번만: 같은 화면을 세 판 돌려 **한 번이라도** 빨개진 항목을 센다.
      # 흔들린다를 진단으로 안 쓰려고 만든 자다. 2026-08-13 에 그렇게 재 보니 flaky 가
      # 아니라 제품 결함이었다(카드를 고르면 판이 튀어 손잡이가 도망갔다).
      - name: 판마다 흔들리는지 (하루 한 번)
        if: github.event.schedule == '23 17 * * *'
        working-directory: apps/karmolab
        run: npm run test:karmograph:repeat
      - name: 깨진 화면 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: karmograph-smoke-shots
          path: |
            apps/karmolab/*.png
            apps/karmolab/tmp/**
            /tmp/dev.log
          if-no-files-found: ignore
