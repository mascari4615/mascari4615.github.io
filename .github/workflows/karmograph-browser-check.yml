name: "KarmoGraph 화면 검사"

# 왜 따로 있나 (TASK-KL-202 / 2026-08-12)
#
# 2026-08-12, KarmoGraph 는 **앱에서 열면 아무것도 안 뜨는 상태**로 master 에 얹혀 있었다.
# `packs.ts` 가 팩 라벨을 묶음 실행 시점에 `t()` 로 꺼냈고, 그 시점은 말 묶음이 오기 전이라
# `t()` 가 던졌다 — 묶음이 통째로 죽어 `Toolbox.register` 까지 못 갔다. 그동안
# typecheck·`test:karmograph`(브라우저 없는 알맹이 시험)·`audit-i18n-eager` 는 **전부 초록**이었다.
# 「없는 것」은 검사할 대상이 없고, 알맹이 시험은 화면을 안 띄우기 때문이다.
#
# 그 자리를 실제로 잡는 검사(`scripts/smoke-karmograph.mjs`, 항목 60여 개)는 이미 있었다.
# 다만 **아무 데서도 안 돌고 있었다** — 손으로 부를 때만 도는 검사는 없는 검사다. 그래서 여기 붙인다.
#
# 배포를 막지 않는다: 브라우저 설치가 배포를 느리게 하고, 배포 관문에 붙였다 빼낸 이력이 있다
# (daily-browser-check.yml 과 같은 판단). 여기가 빨개도 사이트는 나간다 — 대신 반드시 보이게 둔다.

on:
  # ★ **push 마다 돌리지 않는다** (2026-08-12 에 push 트리거로 바꿔 봤다가 되돌린 자리).
  #   이 저장소는 몇 분 간격으로 push 가 들어오는데, 이 검사는 브라우저를 깔고 앱을 지어
  #   화면을 띄우느라 10분 대다. 러너 차례를 기다리는 판이 쌓이면서 **여섯 판 연속 판정이
  #   안 났다** — 초록도 빨강도 아닌 것은 신호가 아니다. 시계로 돌려서 반드시 끝나게 한다.
  #   (검사 자체를 고칠 때는 아래 push 트리거가 그 판을 바로 돌려 준다.)
  push:
    branches: [main, master]
    paths:
      - apps/karmolab/scripts/smoke-karmograph.mjs
      - .github/workflows/karmograph-browser-check.yml
  # 캔버스는 셸·로더·i18n 바탕 위에 얹혀 있다. 그쪽이 바뀌어도 여기가 죽을 수 있으므로
  # 한 시간에 한 번 무조건 띄워 본다 (이번 사고도 캔버스 파일 밖에서 시작됐다).
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# ★ 앞 실행을 **취소하지 않는다** (2026-08-12).
#   이 검사는 브라우저를 깔고 화면을 띄우느라 20분 가까이 걸린다. 그런데 몇 분 간격으로
#   푸시가 들어오는 저장소라, 취소 규칙을 켜 두면 **끝까지 간 판이 한 번도 없다** — 실측:
#   최근 다섯 판이 전부 취소, 「판정된 적 없음」. 게이트 수명 검사가 이걸 방치로 집어냈다.
#   초록도 빨강도 아닌 것은 신호가 아니다. 몇 초짜리 idempotent 검사(memo 의 repo gates)와
#   달리, 여기서는 **늦게라도 한 판을 끝내는 쪽**이 옳다. 줄을 세운다.
concurrency:
  group: karmograph-browser-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/karmolab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존 설치
        run: npm ci --no-audit --no-fund

      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/karmolab/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 브라우저 준비
        run: npx playwright install --with-deps chromium

      # 이 앱은 두 공용 꾸러미를 **타입으로** 물고 있다. 새 체크아웃엔 `dist` 가 없어서
      # 안 지으면 빌드가 「모듈을 못 찾겠다」로 선다 (karmolab-live-check.yml 이 같은 이유로
      # 25판 연속 빨갰던 자리다 — 전제를 따로 들면 반드시 갈라진다).
      - name: 공용 꾸러미 먼저 짓기 (karmolab-ai)
        working-directory: packages/karmolab-ai
        run: npm ci --no-audit --no-fund && npm run build

      - name: 공용 꾸러미 먼저 짓기 (badapple)
        working-directory: packages/badapple
        run: npm ci --no-audit --no-fund && npm run build

      - name: 말 묶음 짓기
        run: npm run build:i18n

      # ★ **먼저 짓고, 그 다음에 띄운다.** 예전에는 개발 서버(뜰 때 스스로 짓는다)에 맡겼는데,
      #   그 서버는 **짓는 도중에도 index.html 을 200 으로 준다** — 2초 만에 「준비됨」이 뜨고,
      #   검사는 아직 만들어지지 않은 위젯 묶음을 열다가 항목이 줄줄이 빨갛게 났다
      #   (실측 2026-08-12: 판정이 처음 나온 판이 통째로 그 이유였다). 짓기가 깨지면 여기서 선다.
      - name: 앱 짓기
        run: node build.mjs

      - name: 서버 띄우기
        run: |
          node scripts/dev.mjs 8813 > /tmp/dev.log 2>&1 &
          # index.html 이 아니라 **위젯 묶음**이 나올 때까지 본다 — 그게 검사가 실제로 여는 것이다.
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8813/apps/karmolab/js/widgets/karmograph/karmograph.js || true)
            if [ "$code" = "200" ]; then echo "위젯 묶음까지 준비됨 (${i}초)"; exit 0; fi
            sleep 1
          done
          echo "120초 안에 위젯 묶음이 안 나왔다"; cat /tmp/dev.log; exit 1

      # ★ 이 단계에 **따로 상한**을 둔다. 판정 없이 잘린 판이 있었다(2026-08-12: 한 항목에
      #   20분 넘게 매달려 있다가 job 째로 끊겼고, 로그는 단계가 끝나야 나와서 아무것도 못 봤다).
      #   검사 안에도 항목별 상한이 있으니(STEP_LIMIT_MS) 보통은 그쪽이 먼저 말해 준다.
      - name: 캔버스를 실제로 띄워서 만져 본다
        timeout-minutes: 12
        env:
          URL: http://127.0.0.1:8813/apps/karmolab/index.html
        run: node scripts/smoke-karmograph.mjs

      - name: 깨진 화면 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: karmograph-smoke-shots
          path: |
            apps/karmolab/*.png
            apps/karmolab/tmp/**
            /tmp/dev.log
          if-no-files-found: ignore
