name: Diagnose yawnbot tunnel (cloudflared origin 매핑)

# TASK-YB-006 sub-D2 — sub-B (F2-CLI) 후 봇 4615 listen 확인 + dashboard
# Public Hostname 박혀있는데도 외부 502. cloudflared origin 매핑 또는 ingress
# fetch 지연 의심.
#
# 4 step:
#   T1. localhost:4615 직접 curl — 봇 자체 응답 검증 (봇 OK = cloudflared origin issue)
#   T2. cloudflared service restart — dashboard 변경 즉시 fetch 강제
#   T3. cloudflared Application log 최근 2분 — Registered tunnel connection / origin 도달 시도
#   T4. 외부 (workflow runner → cloudflared edge) 도달 — 같은 머신 안 curl

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5

    steps:
      - name: T1. 봇 직접 도달 (localhost:4615)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== GET http://localhost:4615/webhook/github ==="
          try {
            $resp = Invoke-WebRequest -Uri 'http://localhost:4615/webhook/github' -Method GET -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
            Write-Host "Status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content.Substring(0, [Math]::Min(500, $resp.Content.Length)))"
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "Status: $($_.Exception.Response.StatusCode.value__)"
            }
          }

          Write-Host ""
          Write-Host "=== POST http://localhost:4615/webhook/github (ping) ==="
          try {
            $resp = Invoke-WebRequest -Uri 'http://localhost:4615/webhook/github' -Method POST `
              -Headers @{'Content-Type'='application/json'; 'X-GitHub-Event'='ping'} `
              -Body '{"zen":"diagnose"}' `
              -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
            Write-Host "Status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content.Substring(0, [Math]::Min(500, $resp.Content.Length)))"
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "Status: $($_.Exception.Response.StatusCode.value__)"
            }
          }

          Write-Host ""
          Write-Host "=== GET http://127.0.0.1:4615/webhook/github ==="
          try {
            $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:4615/webhook/github' -Method GET -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
            Write-Host "Status: $($resp.StatusCode)"
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "Status: $($_.Exception.Response.StatusCode.value__)"
            }
          }

      - name: T2. cloudflared service restart (dashboard 변경 즉시 fetch)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== sc.exe stop cloudflared ==="
          $stopOut = "$env:TEMP\sc-stop-cf.txt"
          $p = Start-Process -FilePath 'sc.exe' -ArgumentList 'stop','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stopOut
          if (Test-Path $stopOut) { Get-Content $stopOut | ForEach-Object { Write-Host $_ } }
          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== sc.exe start cloudflared ==="
          $startOut = "$env:TEMP\sc-start-cf.txt"
          $p = Start-Process -FilePath 'sc.exe' -ArgumentList 'start','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $startOut
          if (Test-Path $startOut) { Get-Content $startOut | ForEach-Object { Write-Host $_ } }
          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=== Service status ==="
          Get-Service cloudflared | Format-List Name,Status

      - name: T3. cloudflared Application log 최근 2분
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $since = (Get-Date).AddMinutes(-2)
          try {
            $events = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = $since
            } -ErrorAction Stop |
              Where-Object { $_.ProviderName -match 'cloudflared' -or $_.Message -match 'cloudflared' } |
              Select-Object -First 20
            if ($events) {
              foreach ($e in $events) {
                Write-Host "$($e.TimeCreated) [$($e.LevelDisplayName)] $($e.Message)"
              }
            } else {
              Write-Host "(매치 0)"
            }
          } catch {
            Write-Host "Get-WinEvent 실패: $($_.Exception.Message)"
          }

      - name: T4. 외부 도달 (cloudflared edge → tunnel → origin)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          # cloudflared restart 후 ingress fetch 까지 추가 대기
          Start-Sleep -Seconds 5

          Write-Host "=== GET https://yawnbot.mascari4615.com/webhook/github ==="
          try {
            $resp = Invoke-WebRequest -Uri 'https://yawnbot.mascari4615.com/webhook/github' -Method GET -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "Status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content.Substring(0, [Math]::Min(500, $resp.Content.Length)))"
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "Status: $($_.Exception.Response.StatusCode.value__)"
            }
          }

          Write-Host ""
          Write-Host "=== POST https://yawnbot.mascari4615.com/webhook/github (ping) ==="
          try {
            $resp = Invoke-WebRequest -Uri 'https://yawnbot.mascari4615.com/webhook/github' -Method POST `
              -Headers @{'Content-Type'='application/json'; 'X-GitHub-Event'='ping'} `
              -Body '{"zen":"diagnose-tunnel"}' `
              -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "Status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content.Substring(0, [Math]::Min(500, $resp.Content.Length)))"
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "Status: $($_.Exception.Response.StatusCode.value__)"
            }
          }
