name: KarmoLab Tauri Release

# 근본 (TASK-KL-064): 프론트(pages-deploy)는 master push 마다 자동 배포되나
# Tauri 바이너리는 옛날엔 manual/tag 만 → 새 #[tauri::command] 가 프론트에만
# 깔리고 앱엔 없어 "Command not found" 스큐 (alarm_list 사고). 이제 backend
# contract (src-tauri/**, package.json) 가 master 에 push 되면 자동 patch
# bump + build + release → 앱 auto-updater 가 받음. 프론트 자동배포와 대칭.
# 루프 가드: bump 스텝의 커밋 메시지에 [skip ci] (아래 line) → 그 version-bump
# push 는 paths 매칭돼도 GitHub Actions 가 run 자체를 skip. workflow_dispatch
# 는 수동 강제(escape hatch) 로 유지.
on:
  workflow_dispatch:
    inputs:
      bumpType:
        description: 'Version bump (실행 전에 tauri.conf.json·Cargo.toml·package.json·Cargo.lock 동시 패치 후 master에 푸시)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
  push:
    branches: [master, main]
    paths:
      - 'apps/karmolab-tauri/src-tauri/**'
      - 'apps/karmolab-tauri/package.json'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/karmolab-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version
        # push(backend contract 변경) = 자동 patch. workflow_dispatch = 선택 bump.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bumpType != 'none')
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            BUMP=patch
          else
            BUMP="${{ inputs.bumpType }}"
          fi
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS='.' read -r MA MI PA <<< "$CURRENT"
          case "$BUMP" in
            patch) PA=$((PA + 1)) ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            *) echo "알 수 없는 bump 종류: $BUMP" >&2; exit 1 ;;
          esac
          NEW="$MA.$MI.$PA"
          echo "Bump $CURRENT → $NEW"
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '$NEW';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"$NEW\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            // KL-052 워크스페이스 전환 후 단일 lock = 워크스페이스 루트
            // (apps/karmolab-tauri/Cargo.lock). 옛 'src-tauri/Cargo.lock'
            // 은 부재 → ENOENT 로 모든 bump-릴리스가 깨져 있었음 (KL-064 발견).
            let lock = fs.readFileSync('Cargo.lock', 'utf8');
            const replaced = lock.replace(/(name = \"karmolab-desktop\"\s+version = )\"[^\"]*\"/, '\$1\"$NEW\"');
            if (replaced === lock) throw new Error('Cargo.lock의 karmolab-desktop 버전 패턴을 찾지 못했습니다.');
            fs.writeFileSync('Cargo.lock', replaced);
          "
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/karmolab-tauri/package.json apps/karmolab-tauri/src-tauri/Cargo.toml apps/karmolab-tauri/Cargo.lock apps/karmolab-tauri/src-tauri/tauri.conf.json
          git commit -m "chore(karmolab-tauri): bump version $CURRENT → $NEW [skip ci]"
          git push origin HEAD:master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/karmolab-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/karmolab-tauri
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: karmolab-v__VERSION__
          releaseName: KarmoLab v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true