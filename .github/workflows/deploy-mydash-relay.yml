name: Deploy mydash Relay

# 개인 대시보드(mydash) 의 GitHub 기기 흐름 릴레이 Worker 를 push 로 배포
# deploy-files-worker.yml 과 같은 모양. 같은 저장소 Secret `CLOUDFLARE_API_TOKEN` 사용
#
# 이 Worker 에는 비밀 없음. GitHub App 기기 흐름은 client secret 미사용,
# Client ID 와 허용 origin 은 wrangler.toml 의 [vars] 에 공개 값
# 통과시키는 것은 기기 코드와 토큰 요청뿐. 저장소 데이터는 안 지남

on:
  push:
    branches: [main]
    paths:
      - 'apps/karmolab/relay/github-device-relay.mjs'
      - 'apps/karmolab/relay/wrangler.toml'
      - '.github/workflows/deploy-mydash-relay.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-mydash-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 없음. 저장소 Secret 에 넣어야 Worker 배포 가능"
            exit 1
          fi

      - name: Deploy worker
        working-directory: apps/karmolab/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # 배포 생존 확인. origin 없는 요청은 403 origin_not_allowed 가 정상
      #
      # 처음 배포한 주소는 DNS 가 아직 안 퍼져서 curl 이 exit 6 (호스트 못 찾음) 으로 죽는다.
      # 한 번 재고 실패로 적으면 멀쩡한 배포가 빨갛게 나온다. 10초 간격 6회까지 다시 잰다.
      # 마지막까지 000 (못 닿음) 이면 실패. 403 이 나오면 그 자리에서 통과.
      - name: Smoke
        run: |
          url=https://mydash-relay.mascari4615.com/device/code
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" || true)
            [ -n "$code" ] || code=000
            echo "try $i: no-origin -> $code"
            [ "$code" = "403" ] && break
            [ "$i" = "6" ] || sleep 10
          done
          [ "$code" = "403" ] || { echo "::error::릴레이 응답이 예상과 다름 ($code)"; exit 1; }

      # 거절만 확인하면 origin 허용 경로가 죽어도 못 잡는다. 허용 origin 을 붙여
      # 한 번 더 쳐서 실제로 기기 코드가 나오는지 본다. 기기 코드는 15분 뒤 소멸,
      # 아무도 못 쓰니 무해
      - name: Smoke (allowed origin)
        run: |
          url=https://mydash-relay.mascari4615.com/device/code
          body=$(curl -s -X POST "$url" -H 'Origin: https://blog.mascari4615.com')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" -H 'Origin: https://blog.mascari4615.com')
          echo "allowed-origin -> $code"
          echo "$body"
          [ "$code" = "200" ] || { echo "::error::허용 origin 요청이 200 이 아님 ($code)"; exit 1; }
          echo "$body" | grep -q 'user_code' || { echo "::error::응답 본문에 user_code 없음"; exit 1; }
