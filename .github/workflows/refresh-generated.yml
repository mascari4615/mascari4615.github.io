name: "굽고 커밋되는 파생물 새로 굽기"

# 왜 있나 (TASK-KL-312)
#
# 파생물 중에는 **커밋본이 곧 서비스본**인 것이 있다. 배포가 다시 굽지 않고 저장소에 든
# 파일 그대로 사람과 봇에게 나간다. 그런 파일은 소스가 바뀌어도 아무 데서도 안 걸린 채 낡는다.
#
# 실측 (2026-08-13):
#  , `data/devlog.json` (게임 개발 기록). 어디서도 안 구워졌다. 다시 구우니 267줄이 바뀌었다.
#     즉 지금 뭘 만들고 있나 자리에 며칠 전 소식이 걸려 있었다.
#
# 왜 사람이 아니라 여기인가: 이것은 **시간이 지나기만 해도 낡는다**(devlog 는 게임 저장소의
# 새 커밋). 사람이 기억해서 돌리는 일은 예외 없이 두 달 뒤에 멈춘다.
#
# 손으로도 돌릴 수 있다. Actions 에서 Run workflow(workflow_dispatch). 자동만 있고 수동이
# 없으면 고장났을 때 확인할 방법이 없다.
#
# 결정론 파생물(소스만으로 값이 정해지는 것)은 여기 말고 `npm run audit:generated` 가 본다.

on:
  schedule:
    # UTC 18:20 = 한국 시각 새벽 03:20 (배포, 야간 검사와 안 겹치는 자리)
    - cron: '20 18 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-generated
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # 개발 기록은 **게임 저장소의 커밋**에서 나온다. 그 저장소가 없으면 생성기는
      # 커밋된 산출을 그대로 두고 조용히 끝난다(= 영원히 안 갱신). 그래서 같이 받는다.
      - name: 게임 저장소도 받는다
        uses: actions/checkout@v6
        with:
          repository: Mascari4615/Witch-Mendokusai
          path: .wm-src
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # ★ **무엇을 굽나는 여기 안 적는다** (2026-08-14). 같은 목록이 감사기(`audit-generated`)에도
      #   있었다. 그래서 밤에 스스로 굽는다고 감사기가 약속해 놓고 여기엔 그 생성기가 없는
      #   상태가 조용히 생길 수 있었다(그 파일은 영원히 낡은 채 서비스된다). 이제 둘 다 한 표를
      #   읽는다: `apps/karmolab/scripts/lib/generated-artifacts.mjs`.
      # 생성기들은 node 기본 기능만 쓴다. 설치가 필요 없다(설치를 넣으면 느려지고, 느린 것은 꺼진다).
      - name: 밤에 굽는 것들을 다시 굽는다
        working-directory: apps/karmolab
        env:
          KARMODDRINE_WM_PATH: ${{ github.workspace }}/.wm-src
        run: |
          set -e
          node scripts/list-generated.mjs --nightly-scripts | while read -r s; do
            [ -z "$s" ] && continue
            echo "::group::$s"
            npm run --silent "$s"
            echo '::endgroup::'
          done

      - name: 바뀌었으면 넘긴다
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 무엇이 구워졌나도 같은 표에서 온다. 여기 손으로 적으면 새 파생물이 커밋에서 조용히 빠진다.
          TARGETS=$(cd apps/karmolab && node scripts/list-generated.mjs --nightly-outputs | xargs)
          if git diff --quiet -- $TARGETS; then
            # 초록인데 아무것도 안 바뀐 것 = 새 커밋도 새 도구도 없었다는 뜻이다. 그래도 한 줄 남긴다 . 
            # 아무 말 없음이 정상인지 안 돈 것인지 구분되어야 한다.
            echo '[refresh-generated] 그대로. 새 커밋, 새 도구 없음'
            exit 0
          fi
          git add $TARGETS
          git commit -m 'chore(karmolab): 굽고 커밋되는 파생물을 새로 구웠다 (자동)' -m '개발 기록(devlog)은 배포가 다시 굽지 않는다. 커밋된 파일이 그대로 사람에게 나간다. 매일 스스로 굽는다.'
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && { echo '[refresh-generated] 새로 구운 것을 밀었다'; exit 0; }
            echo "다시 시도 ${i}"
            sleep 5
          done
          echo '[refresh-generated] 세 번 다 밀려났다'
          exit 1
