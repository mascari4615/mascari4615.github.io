name: KarmoLab Quality Loop (Scheduled)

# 정본: memo/dotfiles/workflows/kl-quality-loop.yml (sync-workflows.ps1 로 배포).
# 본 파일 직접 편집 X — 정본에서 편집 후 `powershell -File memo/dotfiles/sync-workflows.ps1 -Apply`.
#
# 정기 코드 품질 개선 루틴 — 사용자 컴퓨터 꺼져 있어도 GitHub Actions 서버에서 실행.
#
# 동작:
#   1. 매시 30분 (UTC) 실행 — WM 정각과 30분 분리
#   2. Claude 가 TS/JS/SCSS/Rust 코드베이스 3가지 작업 수행:
#      (A) 자동 fix 가능 위반 → Edit 즉시 수정 → feature branch + PR 생성
#      (B) 자동 fix 불가 위반 → _memo/projects/karmolab/tasks/ 에 TASK 시드 생성
#      (C) STALE TASK status 감지 (git log 기반) → memo TASK frontmatter 갱신
#
# 무한 루프 가드:
#   - "chore(kl-quality-loop)" 제목 오픈 PR 존재 시 전체 skip
#
# github.io master 직접 push 금지 (branch protection) → 코드 fix 는 PR 경유.
# memo 직접 push 는 OK (branch protection X).
#
# 필요 credentials:
#   - CLAUDE_CODE_OAUTH_TOKEN: Claude API 인증 (secret)
#   - MEMO_GITHUB_PAT: memo 레포 write 권한 PAT (**secret** — secrets.MEMO_GITHUB_PAT)
#     → github.io repo Settings → Secrets → Actions → MEMO_GITHUB_PAT
#     (과거 vars. 오참조 = 빈 토큰 → 전 run failure. KAR-018-V 진단으로 fix.)

on:
  schedule:
    - cron: '30 * * * *'  # 매시 30분 (UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: kl-quality-loop
  cancel-in-progress: true

jobs:
  quality-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github.io
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout memo
        uses: actions/checkout@v4
        with:
          repository: Mascari4615/memo
          path: _memo
          token: ${{ secrets.MEMO_GITHUB_PAT }}
          fetch-depth: 0

      - name: Loop guard — 오픈 PR 중복 방지
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list --search "chore(kl-quality-loop) in:title" --state open --json number --jq length 2>/dev/null || echo 0)
          if [ "$OPEN_PR" -gt "0" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::kl-quality-loop PR 이미 오픈 중 — loop guard skip"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Claude CLI
        if: steps.guard.outputs.skip != 'yes'
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.local
            /usr/local/lib/node_modules/@anthropic-ai
          key: claude-code-cli-${{ runner.os }}-v1

      - name: Install Claude CLI (cache miss only)
        if: steps.guard.outputs.skip != 'yes'
        run: |
          if ! command -v claude &> /dev/null; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "claude cached at $(which claude)"
            claude --version
          fi

      - name: Verify Claude auth
        if: steps.guard.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          # TASK-KAR-013: quota/rate-limit ≠ auth 실패. 구분 안 하면 quota 부족
          # 시 이 pre-check 가 workflow 를 fail 처리 → false ❌ (WM Issue #140).
          # quota = 보류(exit 0, 다음 hourly 재시도) / 진짜 auth 실패만 exit 1.
          # (main scan step 은 이미 quota 시 exit 0 — 본 pre-check 만 잔존 갭.)
          set +e
          AUTH_OUT=$(claude --print "Reply with just OK." 2>&1)
          AUTH_EXIT=$?
          set -e
          if [ "$AUTH_EXIT" -eq 0 ]; then
            echo "Claude auth OK"
          elif echo "$AUTH_OUT" | grep -qiE '429|rate.?limit|quota|overloaded|too many requests|usage limit|capacity|503'; then
            echo "::warning::Claude quota/rate-limit at auth pre-check (exit=$AUTH_EXIT) — 보류, 다음 hourly 재시도 (workflow fail 아님, TASK-KAR-013)"
            echo "$AUTH_OUT"
            exit 0
          else
            echo "::error::Claude auth 실패 (genuine, exit=$AUTH_EXIT)"
            echo "$AUTH_OUT"
            exit 1
          fi

      - name: Claude scan + fix + seed + stale-sync
        if: steps.guard.outputs.skip != 'yes'
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT='# 임무: github.io quality-loop — 스캔 + fix + TASK 시드 + STALE sync

          ## 환경
          - github.io 레포 루트: 현재 작업 디렉토리
          - memo 레포: _memo/ 서브디렉토리 (TASK 파일: _memo/projects/karmolab/tasks/)

          ## 작업 A — TS/JS/SCSS 자동 fix
          스캔 범위:
          - JS/TS: apps/blog/_javascript/, apps/karmolab/src/, packages/karmolab-ai/src/
          - SCSS: apps/blog/_sass/
          - 우선순위: 최근 30일 수정 파일 (git log --since="30 days ago" --name-only | sort -u)
          - 본 실행당 최대 10 파일 fix

          정본 룰: Mascari4615.github.io/CLAUDE.md (§ Code Quality Configuration)
          본 프롬프트는 요약 — 정본 룰 우선.

          자동 fix 대상:
          1. SCSS lint 위반 — npm run lint:fix:scss 실행 후 변경사항 확인
          2. ESLint auto-fixable 위반 (formatting / import order 등)
          3. TypeScript 명시 타입 누락 (any 대신 proper type — 확실한 것만)
          4. 미사용 import 제거 (ESLint no-unused-vars 자동 fix 대상만)

          fix 후 반드시 검증: npm ci && npm run verify (master invariant 통과 확인)
          verify 실패 시: 해당 fix 전체 롤백 후 TASK 시드화 (B 로 이동)

          SKIP 대상 (fix X, 작업 B 에서 시드화):
          - 아키텍처·설계 변경 필요 (monorepo 구조 개편 등)
          - Tauri #[tauri::command] async spawn_blocking 누락 (IO heavy — CLAUDE.md KL-043 패턴)
          - ServerMonitor devProfiles 미등록 (신규 서버/봇)
          - Rust unsafe 패턴
          - 복잡한 타입 리팩터 (제네릭 재설계 등)
          - verify 통과 확신 없는 모든 변경

          ## 작업 B — SKIP 위반 → TASK 시드화
          작업 A 스캔 중 SKIP 위반 발견 시 _memo/projects/karmolab/tasks/ 에 TASK 시드 작성.

          중복 방지: _memo/projects/karmolab/tasks/TASK-KL-*.md Grep → 같은 위반 패턴 + status=seed/ready 기존 TASK 있으면 하단 추가 위반 섹션에 append. 없으면 신규 파일.

          신규 TASK ID: ls _memo/projects/karmolab/tasks/TASK-KL-*.md 최고 번호 +1

          신규 파일 (_memo/projects/karmolab/tasks/TASK-KL-NNN-<kebab>.md) 형식:
          frontmatter: id/status(seed)/priority(low)/path([karmolab,quality])/tags([quality-loop,<위반종류>])
          ## 목표 섹션: quality-loop 자동 감지 — 위반 패턴 요약
          ## 위반 목록 섹션: 파일/라인/내용 표

          ## 작업 C — STALE TASK status 감지 + 갱신
          git log 탐색: git log --oneline -50
          각 TASK-KL-NNN 에 대해 _memo/projects/karmolab/tasks/ 의 status 확인.
          status=seed/ready 이고 feat:/fix: 등 실질 구현 커밋 또는 머지 PR 있으면 → status: done 으로 갱신.
          불확실하면 skip.

          ## 출력 마커 (응답 마지막 3줄 — 반드시 이 형식)
          TS_FIX_RESULT: APPLIED|CLEAN
          TASK_SEED_RESULT: SEEDED:<N>|NONE
          STALE_SYNC_RESULT: SYNCED:<N>|NONE

          시작.'

          set +e
          OUTPUT=$(claude --print --permission-mode bypassPermissions "$PROMPT" 2>&1)
          CLAUDE_EXIT=$?
          set -e

          echo "=== Claude output ==="
          echo "$OUTPUT"
          echo "=== /output ==="

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::warning::Claude CLI 호출 실패 (exit=$CLAUDE_EXIT) — 다음 루프 재시도"
            echo "ts_applied=no" >> "$GITHUB_OUTPUT"
            echo "memo_changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # TS/JS/SCSS fix 결과 파싱
          if echo "$OUTPUT" | tail -5 | grep -q "TS_FIX_RESULT: APPLIED"; then
            if ! git diff --quiet; then
              git diff --stat > /tmp/kl_diff_stat.txt
              TS_COUNT=$(git diff --name-only | grep -cE '\.(ts|tsx|js|jsx|scss)$' || echo 0)
              echo "ts_applied=yes" >> "$GITHUB_OUTPUT"
              echo "ts_fixed=${TS_COUNT}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::TS_FIX_RESULT: APPLIED 이지만 실제 변경 없음 — 비정합"
              echo "ts_applied=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ts_applied=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLEAN — TS/JS/SCSS 위반 없음 또는 모두 SKIP 영역"
          fi

          # memo 변경 감지
          MEMO_DIRTY=$(git -C _memo status --porcelain 2>/dev/null | grep 'projects/karmolab/tasks/TASK-KL-' || true)
          if [ -n "$MEMO_DIRTY" ]; then
            echo "memo_changed=yes" >> "$GITHUB_OUTPUT"
            SEED_N=$(echo "$OUTPUT" | grep -oE 'SEEDED:[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)
            SYNC_N=$(echo "$OUTPUT" | grep -oE 'SYNCED:[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)
            echo "seed_count=${SEED_N}" >> "$GITHUB_OUTPUT"
            echo "sync_count=${SYNC_N}" >> "$GITHUB_OUTPUT"
          else
            echo "memo_changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch + PR for TS/JS fix
        if: steps.guard.outputs.skip != 'yes' && steps.claude.outputs.ts_applied == 'yes'
        id: kl_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # .ts/.tsx/.js/.jsx/.scss 만 staging
          git add -A -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.scss'

          # 비정합: Claude 가 예상 외 파일 만짐 → 거부
          EXTRA=$(git status --porcelain | grep -vE '^[AM]  .*\.(ts|tsx|js|jsx|scss)$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::warning::Claude 가 예상 외 파일 변경:"
            echo "$EXTRA"
            git reset --hard HEAD
            echo "pr_created=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGED=$(git status --porcelain | grep -E '^[AM]' || true)
          if [ -z "$STAGED" ]; then
            echo "::notice::staging 후 변경 없음"
            echo "pr_created=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TS_COUNT="${{ steps.claude.outputs.ts_fixed }}"
          DIFF_STAT=$(cat /tmp/kl_diff_stat.txt 2>/dev/null || echo "(없음)")
          BRANCH="fix/kl-quality-loop-$(date +%Y%m%d-%H%M)"

          git checkout -b "$BRANCH"
          git commit -m "chore(kl-quality-loop): Claude scan+fix ${TS_COUNT} files

          Auto-fix by Claude scheduled quality-loop (proactive scan).
          룰 정본: Mascari4615.github.io/CLAUDE.md (스캔+수정 통합).

          diff stat:
          ${DIFF_STAT}

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push origin "$BRANCH"

          gh pr create \
            --title "chore(kl-quality-loop): Claude scan+fix ${TS_COUNT} files" \
            --body "Auto-fix by Claude scheduled quality-loop (proactive scan).

          verify 통과 후 auto-merge.yml 이 머지합니다.

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base master \
            --head "$BRANCH"

          echo "pr_created=yes" >> "$GITHUB_OUTPUT"
          echo "pr_branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Commit + push memo (TASK 시드 / STALE sync)
        if: steps.guard.outputs.skip != 'yes' && steps.claude.outputs.memo_changed == 'yes'
        id: memo_commit
        env:
          MEMO_GITHUB_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
        run: |
          git -C _memo config user.name "github-actions[bot]"
          git -C _memo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # TASK-KL-*.md 만 staging
          git -C _memo add -- 'projects/karmolab/tasks/TASK-KL-*.md'

          STAGED=$(git -C _memo status --porcelain | grep -E '^[AM]' || true)
          if [ -z "$STAGED" ]; then
            echo "::notice::memo: staging 후 변경 없음"
            echo "memo_pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SEED="${{ steps.claude.outputs.seed_count }}"
          SYNC="${{ steps.claude.outputs.sync_count }}"

          git -C _memo commit -m "chore(kl-quality-loop): KL TASK 시드 ${SEED}개 + stale sync ${SYNC}개

          github.io quality-loop 자동 생성/갱신.
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PUSH_OK=no
          for attempt in 1 2 3; do
            git -C _memo fetch origin main
            if git -C _memo rebase origin/main; then
              if git -C _memo push "https://x-access-token:${MEMO_GITHUB_PAT}@github.com/Mascari4615/memo.git" main; then
                PUSH_OK=yes
                echo "memo_pushed=yes" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              git -C _memo rebase --abort
            fi
            echo "::warning::memo push attempt ${attempt} 실패 — retry"
            sleep 3
          done

          if [ "$PUSH_OK" = "no" ]; then
            echo "memo_pushed=no" >> "$GITHUB_OUTPUT"
            echo "::error::memo push 3회 실패"
          fi

      - name: Discord 알림
        if: steps.guard.outputs.skip != 'yes' && (steps.kl_pr.outputs.pr_created == 'yes' || steps.memo_commit.outputs.memo_pushed == 'yes')
        run: |
          PR_CREATED="${{ steps.kl_pr.outputs.pr_created }}"
          MEMO_PUSHED="${{ steps.memo_commit.outputs.memo_pushed }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::notice::kl-quality-loop 완료 — PR=${PR_CREATED}, memo=${MEMO_PUSHED}, run=${RUN_URL}"
