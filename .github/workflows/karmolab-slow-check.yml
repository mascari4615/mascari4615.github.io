# **느린 실주소 검사 — 여섯 시간에 한 번** (2026-08-14)
#
# 왜 따로 있나: 한 시간마다 도는 `karmolab-live-check` 이 16 → 20 → **40분** 으로 늘다가
# 워크플로 상한에 걸려 **끊겼다**. 끊긴 판은 빨강으로 보이지만 무엇이 빨간지는 아무도 모른다 —
# 쉰한 개를 재다 말았으니까. 그래서 제일 무거운 둘을 여기로 옮겼다.
#
#   · `smoke:tour`      368초(6분) — 둘러보기가 끝까지 도는가
#   · `smoke:arcadekeys` 160초(2.7분) — 오락실 자판이 도는가
#
# 이 둘은 자주 바뀌는 자리가 아니다. 여섯 시간에 한 번이면 「망가진 채 하루를 보내는」 일은 없다.
name: "karmolab 느린 실주소 검사"

# ⚠ **시계는 아직 안 켠다** (2026-08-14). 두 검사가 러너에서 아직 초록이 아니다:
#   · `smoke:tour` — 30초 기다림에서 선다
#   · `smoke:arcadekeys` — 30 → 60초로 올렸는데 **60초에서도 같은 자리에 선다**
#     (오늘의 규율: 두 한계에서 같은 자리에 서면 「느림」이 아니다 — 무엇을 기다렸는지 봐야 한다)
# 늘 빨간 시계 판은 아무도 안 보게 되므로, **둘이 초록이 되면** 아래 `schedule` 을 되살린다.
# 그때까지는 손으로만 부른다.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '37 */6 * * *'

permissions:
  contents: read

concurrency:
  group: karmolab-slow-check
  # 접지 않는다 — 접힌 판은 판정을 안 남기고, 판정 없는 검사는 없는 검사다.
  cancel-in-progress: false

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/karmolab
    steps:
      - uses: actions/checkout@v4

      # 짓기 전 채비는 한 곳에서 (`.github/actions/setup-karmolab`).
      - uses: ./.github/actions/setup-karmolab
        with:
          chromium: 'true'

      # ★ **이름을 그대로 적는다** (2026-08-14). 처음에는 `for s in smoke:tour …` 로 돌렸는데,
      #   그러면 `audit:orphans` 가 「아무 데서도 안 부른다」로 읽는다 — 그 감사는 워크플로에서
      #   `npm run <이름>` 을 글자로 찾기 때문이다. 셸 변수로 감추면 검사는 도는데 **아무도 도는 줄
      #   모른다.** 두 줄 늘어나는 값으로 그 눈을 되찾는다.
      # 한 놈이 빨개도 나머지는 끝까지 본다 — 「무엇이 빨간지」가 한 판에 다 보여야 한다.
      - name: 둘러보기가 끝까지 도는지
        id: tour
        continue-on-error: true
        run: npm run --silent smoke:tour

      - name: 오락실 자판이 도는지
        id: keys
        continue-on-error: true
        run: npm run --silent smoke:arcadekeys

      - name: 하나라도 빨갛면 이 판은 빨강
        run: |
          fail=0
          [ "${{ steps.tour.outcome }}" = "failure" ] && { echo "✘ smoke:tour"; fail=1; }
          [ "${{ steps.keys.outcome }}" = "failure" ] && { echo "✘ smoke:arcadekeys"; fail=1; }
          exit $fail
