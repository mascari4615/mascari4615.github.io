name: Migrate cloudflared-prod to named tunnel

# TASK-YB-005 ζ — TASK-YB-002-E 의 quick tunnel 흐름 (NSSM cloudflared-prod + tunnel-launcher.mjs)
# 폐기. cloudflared 공식 service install 으로 named tunnel (yawnbot.mascari4615.com) 마이그레이션.
#
# 근거: NSSM + cloudflared.exe (LocalSystem) 직접 호출 시 사용자 home `~/.cloudflared/`
# 못 봐 cert.pem 없음 → cloudflared 즉시 exit → SERVICE_PAUSED. cloudflared 공식 service
# 는 ProgramData\Cloudflare\cloudflared\ 자동 검색 + LocalSystem 정합.
#
# Runner: 노트북 self-hosted (label: yawnbot).
# Idempotent: 재 trigger 시 cert/cred/config overwrite + service uninstall + reinstall.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5

    steps:
      - name: Setup ProgramData cloudflared dir + secrets reconstruct
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        env:
          CF_CERT_PEM: ${{ secrets.YB_PROD_CF_CERT_PEM }}
          CF_CREDENTIALS_JSON: ${{ secrets.YB_PROD_CF_CREDENTIALS_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfDir = "C:\ProgramData\Cloudflare\cloudflared"
          New-Item -Path $cfDir -ItemType Directory -Force | Out-Null

          # UTF-8 no BOM (cloudflared parser strict)
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::WriteAllText("$cfDir\cert.pem", $env:CF_CERT_PEM, $utf8)
          [System.IO.File]::WriteAllText("$cfDir\67fcd09d-05b0-468d-b797-b0c08e5be7f2.json", $env:CF_CREDENTIALS_JSON, $utf8)

          $config = @"
tunnel: 67fcd09d-05b0-468d-b797-b0c08e5be7f2
credentials-file: $cfDir\67fcd09d-05b0-468d-b797-b0c08e5be7f2.json

ingress:
  - hostname: yawnbot.mascari4615.com
    service: http://localhost:4615
  - service: http_status:404
"@
          [System.IO.File]::WriteAllText("$cfDir\config.yml", $config, $utf8)

          Write-Host "Files written to ${cfDir}:"
          Get-ChildItem $cfDir | Format-Table Name,Length -AutoSize

      - name: Remove existing NSSM cloudflared-prod
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }

          $svc = Get-Service -Name cloudflared-prod -ErrorAction SilentlyContinue
          if ($svc) {
            Write-Host "Existing cloudflared-prod service 발견 — stop + remove"
            sc.exe stop cloudflared-prod | Out-Host
            Start-Sleep -Seconds 5
            Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            if ($nssm) {
              & $nssm remove cloudflared-prod confirm 2>&1 | Out-Host
              Write-Host "NSSM cloudflared-prod removed"
            } else {
              sc.exe delete cloudflared-prod | Out-Host
            }
            Start-Sleep -Seconds 3
          } else {
            Write-Host "cloudflared-prod NSSM service 없음 — skip"
          }

      - name: cloudflared service install (idempotent reinstall)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'
          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) { throw "cloudflared.exe 못 찾음" }

          $existing = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "기존 cloudflared service 발견 — uninstall 후 reinstall"
            sc.exe stop cloudflared | Out-Host
            Start-Sleep -Seconds 3
            Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            & $cf service uninstall 2>&1 | Out-Host
            Start-Sleep -Seconds 3
          }

          # service install — config 절대경로 명시
          $cfDir = "C:\ProgramData\Cloudflare\cloudflared"
          & $cf --config "$cfDir\config.yml" service install 2>&1 | Out-Host

          # auto start + start (service install 자체가 시작 안 할 수도)
          sc.exe config cloudflared start= auto | Out-Host
          sc.exe start cloudflared | Out-Host
          Start-Sleep -Seconds 8

      - name: Verify
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $svc = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if (-not $svc) { throw "cloudflared service not found after install" }
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') {
            # 한 번 더 retry (service install 후 START_PENDING 가능)
            Start-Sleep -Seconds 5
            $svc = Get-Service -Name cloudflared
            if ($svc.Status -ne 'Running') { throw "cloudflared service status = $($svc.Status), expected Running" }
          }

          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          Write-Host "=== tunnel info yawnbot-prod ==="
          & $cf tunnel info yawnbot-prod 2>&1 | Out-Host
