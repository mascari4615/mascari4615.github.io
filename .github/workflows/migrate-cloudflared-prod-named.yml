name: Migrate cloudflared-prod to named tunnel

# TASK-YB-005 ζ — TASK-YB-002-E 의 quick tunnel 흐름 (tunnel-launcher.mjs + GITHUB_TOKEN env)
# 폐기 후 named tunnel (yawnbot.mascari4615.com) 으로 마이그레이션. 1회 실행 workflow.
#
# Runner: 노트북 self-hosted (label: yawnbot). 노트북에 NSSM 서비스 cloudflared-prod
# 박혀있어야 함 (TASK-YB-002-A done 가정).
#
# 검증 후 본 workflow archive 또는 삭제.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5

    steps:
      - name: Locate nssm + cloudflared
        id: locate
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'

          # nssm 위치 (deploy-discord-bots.yml 의 fallback 와 동일)
          $nssmCmd = Get-Command nssm.exe -ErrorAction SilentlyContinue
          $nssm = if ($nssmCmd) { $nssmCmd.Source } else { $null }
          if (-not $nssm) {
            $candidates = @(
              "C:\Users\masca\AppData\Local\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "$env:ProgramData\Microsoft\WinGet\Packages\NSSM.NSSM_*\nssm*\win64\nssm.exe",
              "C:\ProgramData\chocolatey\bin\nssm.exe"
            )
            foreach ($pat in $candidates) {
              $found = Get-Item $pat -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $nssm = $found.FullName; break }
            }
          }
          if (-not $nssm) { throw "nssm.exe 못 찾음" }

          # cloudflared 위치
          $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
          $cf = if ($cfCmd) { $cfCmd.Source } else { "C:\Program Files (x86)\cloudflared\cloudflared.exe" }
          if (-not (Test-Path $cf)) { throw "cloudflared.exe 못 찾음 ($cf)" }

          $cfDir = Split-Path -Parent $cf

          Write-Host "nssm: $nssm"
          Write-Host "cloudflared: $cf"
          Write-Host "cloudflared dir: $cfDir"

          # GitHub Actions output 으로 export
          "nssm=$nssm" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cf=$cf" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cfDir=$cfDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Backup current cloudflared-prod config
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $nssm = "${{ steps.locate.outputs.nssm }}"
          Write-Host "=== 현재 config (backup 로그) ==="
          Write-Host "Application: $(& $nssm get cloudflared-prod Application 2>&1)"
          Write-Host "AppParameters: $(& $nssm get cloudflared-prod AppParameters 2>&1)"
          Write-Host "AppDirectory: $(& $nssm get cloudflared-prod AppDirectory 2>&1)"
          Write-Host "AppEnvironmentExtra: (마스킹 — GITHUB_TOKEN 박혀있을 수 있음)"

      - name: Migrate to named tunnel
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          $nssm = "${{ steps.locate.outputs.nssm }}"
          $cf = "${{ steps.locate.outputs.cf }}"
          $cfDir = "${{ steps.locate.outputs.cfDir }}"

          # cloudflared 직접 호출로 변경 (node + tunnel-launcher.mjs 폐기)
          & $nssm set cloudflared-prod Application $cf
          if ($LASTEXITCODE -ne 0) { throw "nssm set Application failed" }

          & $nssm set cloudflared-prod AppParameters "tunnel run yawnbot-prod"
          if ($LASTEXITCODE -ne 0) { throw "nssm set AppParameters failed" }

          & $nssm set cloudflared-prod AppDirectory $cfDir
          if ($LASTEXITCODE -ne 0) { throw "nssm set AppDirectory failed" }

          # GITHUB_TOKEN env 제거 (named tunnel 은 cert.pem 자체 인증 — PAT 무관)
          & $nssm reset cloudflared-prod AppEnvironmentExtra
          if ($LASTEXITCODE -ne 0) { Write-Warning "nssm reset AppEnvironmentExtra exit $LASTEXITCODE (이미 비어있을 수 있음)" }

          Write-Host "=== 갱신 후 config ==="
          Write-Host "Application: $(& $nssm get cloudflared-prod Application 2>&1)"
          Write-Host "AppParameters: $(& $nssm get cloudflared-prod AppParameters 2>&1)"
          Write-Host "AppDirectory: $(& $nssm get cloudflared-prod AppDirectory 2>&1)"

          # restart — stop → sleep → start retry (SERVICE_PAUSED race 회피)
          & $nssm stop cloudflared-prod 2>&1
          Start-Sleep -Seconds 5

          $started = $false
          for ($i = 0; $i -lt 5; $i++) {
            & $nssm start cloudflared-prod 2>&1
            if ($LASTEXITCODE -eq 0) { $started = $true; break }
            Write-Host "start attempt $($i+1) failed (exit $LASTEXITCODE) — wait 3s"
            Start-Sleep -Seconds 3
          }
          if (-not $started) { throw "nssm start cloudflared-prod failed after 5 attempts" }
          Write-Host "cloudflared-prod restarted at $(Get-Date -Format 'yyyy-MM-ddTHH:mm:sszzz')"

      - name: Verify named tunnel connector
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $cf = "${{ steps.locate.outputs.cf }}"
          # connector 등록까지 ~5-10s
          Start-Sleep -Seconds 8
          Write-Host "=== cloudflared tunnel info yawnbot-prod ==="
          & $cf tunnel info yawnbot-prod 2>&1
