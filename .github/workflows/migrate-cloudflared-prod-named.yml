name: Migrate cloudflared-prod to named tunnel (token-based)

# TASK-YB-006 sub-B (F2-CLI) — Token-based cloudflared service install,
# token CLI 자동 추출.
#
# 근거: TASK-YB-006 sub-A 진단 결과 (run #25608844861), `cloudflared service install`
# (no-arg 형) 이 ImagePath 에 tunnel run / --config args 박지 않음 → service 시작 후
# subcommand 없이 즉시 exit (WIN32_EXIT_CODE 1067) → 무한 재시작 사이클.
#
# 진단 axis A5 의 dry run 으로 cert/cred/config 자체는 정상 검증됨 (LocalSystem
# 컨텍스트, --config <path> tunnel run yawnbot-prod 명시 시 connector 등록 OK).
# 즉 근본 = service 등록 args 누락. cert encoding / ACL / 버전 / connector lock /
# 파일 권한 5 의심 후보 다 폐기.
#
# F2-CLI fix = Cloudflare 공식 token-based install + token CLI 자동 추출.
# `cloudflared tunnel token <TUNNEL>` 가 cert.pem 있는 컨텍스트에서 token 추출.
# Runner = LocalSystem, USERPROFILE = C:\Windows\System32\config\systemprofile,
# 거기 .cloudflared\cert.pem 박혀있음 (sub-A axis A2 검증) → workflow 안에서 직접
# token 추출 가능 → secret 박을 필요 X + dashboard UI 변경 무관.
#
# Token 에 tunnel ID / cert / credentials 다 인코딩됨 — service install 후 cert.pem /
# credentials.json / config.yml 파일 흐름 미사용. dashboard 가 ingress / DNS /
# connector 자동 관리. 단 cert.pem 자체는 token 발급용으로 1회 사용 — 보존.
#
# 폐기 secret: YB_PROD_CF_CERT_PEM, YB_PROD_CF_CREDENTIALS_JSON.
# 새 secret: 없음 (token CLI 자동 추출).
#
# Runner: 노트북 self-hosted (label: yawnbot, LocalSystem 컨텍스트).
# Idempotent: 재 trigger 시 기존 service uninstall + reinstall.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: [self-hosted, windows, laptop, yawnbot]
    timeout-minutes: 5

    steps:
      - name: Mirror cert.pem (사용자 home → LocalSystem home)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'

          # cloudflared tunnel login 은 사용자 home (C:\Users\masca\.cloudflared\) 에
          # cert.pem 박음. 단 본 workflow runner = LocalSystem 컨텍스트 → home =
          # SystemProfile. cloudflared tunnel token 명령은 home/.cloudflared/cert.pem
          # 자동 검색 → SystemProfile 에 cert.pem 없으면 token 추출 fail.
          #
          # 사용자 손 0 path: Mirror 사용자 home cert.pem → SystemProfile.
          # cert.pem 5년 만료 (Cloudflare 표준) 까지 영구 자동.

          $userCert = "C:\Users\masca\.cloudflared\cert.pem"
          $sysHome = "C:\Windows\System32\config\systemprofile\.cloudflared"
          $sysCert = "$sysHome\cert.pem"

          if (-not (Test-Path $userCert)) {
            throw "사용자 home 에 cert.pem 없음 ($userCert). 사용자 노트북에서 `cloudflared tunnel login` 먼저 실행 (브라우저 OAuth)"
          }
          $userSize = (Get-Item $userCert).Length
          Write-Host "사용자 cert.pem 발견: $userCert ($userSize bytes)"

          if (-not (Test-Path $sysHome)) {
            New-Item -Path $sysHome -ItemType Directory -Force | Out-Null
          }

          Copy-Item $userCert $sysCert -Force
          $sysSize = (Get-Item $sysCert).Length
          Write-Host "Mirror 완료: $sysCert ($sysSize bytes)"

      - name: Extract tunnel token (CLI, cert.pem 컨텍스트)
        id: token
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'

          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) { throw "cloudflared.exe 못 찾음" }

          # cert.pem 위치 검증 — 이전 step 에서 SystemProfile 로 mirror 됐어야
          $sysHome = "C:\Windows\System32\config\systemprofile\.cloudflared"
          $certPem = "$sysHome\cert.pem"
          if (-not (Test-Path $certPem)) {
            throw "cert.pem 못 찾음 ($certPem). 이전 Mirror step 실패 확인"
          }
          Write-Host "cert.pem 발견: $certPem ($((Get-Item $certPem).Length) bytes)"

          # token 추출 — stdout 으로 raw token 출력
          $tokenOut = "$env:TEMP\cf-token-stdout.txt"
          $tokenErr = "$env:TEMP\cf-token-stderr.txt"
          $p = Start-Process -FilePath $cf -ArgumentList 'tunnel','token','yawnbot-prod' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $tokenOut -RedirectStandardError $tokenErr
          if ($p.ExitCode -ne 0) {
            Write-Host "stdout:"
            if (Test-Path $tokenOut) { Get-Content $tokenOut | ForEach-Object { Write-Host "  $_" } }
            Write-Host "stderr:"
            if (Test-Path $tokenErr) { Get-Content $tokenErr | ForEach-Object { Write-Host "  $_" } }
            throw "cloudflared tunnel token failed (exit $($p.ExitCode))"
          }
          $token = (Get-Content $tokenOut -Raw).Trim()
          if ([string]::IsNullOrEmpty($token)) { throw "token 추출 결과 비어있음" }

          # GitHub Actions add-mask — 이 step 이후 모든 log 에서 token 자동 *** 처리
          Write-Host "::add-mask::$token"
          Write-Host "Token 추출 성공 (length: $($token.Length) chars, masked)"

          # 다음 step 으로 token 전달 — Set-Content 로 GITHUB_OUTPUT 에 박음.
          # 단 GITHUB_OUTPUT 도 log 에 노출 가능 — add-mask 후라 안전.
          # token 안 == 또는 특수문자 escape 필요 — masking 으로 방어.
          # 또 outputs 은 log 에 안 박힘 (GitHub Actions 가 자동 mask).
          Add-Content -Path $env:GITHUB_OUTPUT -Value "token=$token"

      - name: Uninstall existing cloudflared service
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) { throw "cloudflared.exe 못 찾음" }

          $existing = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "기존 cloudflared service 발견 — uninstall (clean state)"
            sc.exe stop cloudflared | Out-Host
            Start-Sleep -Seconds 3
            Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            & $cf service uninstall 2>&1 | Out-Host
            Start-Sleep -Seconds 3
          } else {
            Write-Host "cloudflared service 없음 — skip"
          }

          # cert.pem / credentials.json / config.yml 정리는 token-based install 후
          # 미사용이지만 cert.pem 자체는 token 발급에 매번 필요 (재 trigger 가능성).
          # → 정리 X. 그대로 둠. ProgramData 의 잔재도 보존 (LocalSystem 권한 동일).

      - name: cloudflared service install (token CLI)
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        env:
          CF_TUNNEL_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $cf = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cfCmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cfCmd) { $cf = $cfCmd.Source }
          }
          if (-not (Test-Path $cf)) { throw "cloudflared.exe 못 찾음" }

          if ([string]::IsNullOrEmpty($env:CF_TUNNEL_TOKEN)) {
            throw "token output 비어있음 — 이전 step (Extract tunnel token) 실패 의심"
          }

          Write-Host "service install (token, length: $($env:CF_TUNNEL_TOKEN.Length)):"
          # cloudflared 가 token 을 ImagePath 에 그대로 박음 → SCM start 시
          # cloudflared.exe service tunnel run --token <TOKEN> 실행
          & $cf service install $env:CF_TUNNEL_TOKEN 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "service install failed (exit $LASTEXITCODE)" }
          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "service ImagePath (검증 — args 박혔는지, sub-A 의 ImagePath 0-args 회귀 검증):"
          $qcOut = "$env:TEMP\sc-qc-install.txt"
          $p = Start-Process -FilePath 'sc.exe' -ArgumentList 'qc','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $qcOut
          if (Test-Path $qcOut) { Get-Content $qcOut | ForEach-Object { Write-Host $_ } }

          # service install 가 자동 start 함. exit 1056 = ALREADY RUNNING = 성공 신호
          Write-Host ""
          Write-Host "ensure auto + ensure started (idempotent):"
          sc.exe config cloudflared start= auto | Out-Host
          $startOut = "$env:TEMP\sc-start-install.txt"
          $startErr = "$env:TEMP\sc-start-install.err"
          $sp = Start-Process -FilePath 'sc.exe' -ArgumentList 'start','cloudflared' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $startOut -RedirectStandardError $startErr
          if (Test-Path $startOut) { Get-Content $startOut | ForEach-Object { Write-Host $_ } }
          $startExit = $sp.ExitCode
          if ($startExit -ne 0 -and $startExit -ne 1056) {
            if (Test-Path $startErr) { Get-Content $startErr | ForEach-Object { Write-Host $_ } }
            throw "sc start cloudflared failed (exit $startExit)"
          }
          Start-Sleep -Seconds 8

      - name: Verify
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Continue'

          $svc = Get-Service -Name cloudflared -ErrorAction SilentlyContinue
          if (-not $svc) { throw "cloudflared service not found after install" }
          Write-Host "Service status: $($svc.Status)"

          # cloudflared 프로세스 (service start 후 살아있는지 — sub-A 의 1067 패턴 회귀 검증)
          Write-Host ""
          Write-Host "=== cloudflared processes ==="
          $procs = Get-Process cloudflared -ErrorAction SilentlyContinue
          if ($procs) {
            $procs | Format-Table Id,ProcessName,StartTime -AutoSize
          } else {
            Write-Host "(none — child exit cycle 의심, A4 Event Log 확인 필요)"
          }

          # connector active — Application log 의 cloudflared provider 가
          # "Registered tunnel connection" 박는지 (sub-A 의 dry run 패턴)
          Write-Host ""
          Write-Host "=== Application log: cloudflared, 최근 2분 ==="
          $since = (Get-Date).AddMinutes(-2)
          try {
            $events = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = $since
            } -ErrorAction Stop |
              Where-Object { $_.ProviderName -match 'cloudflared' -or $_.Message -match 'cloudflared' } |
              Select-Object -First 10
            if ($events) {
              foreach ($e in $events) {
                Write-Host "$($e.TimeCreated) [$($e.LevelDisplayName)] $($e.Message)"
              }
            } else {
              Write-Host "(매치 0)"
            }
          } catch {
            Write-Host "Get-WinEvent 실패: $($_.Exception.Message)"
          }

          if ($svc.Status -ne 'Running') {
            throw "cloudflared service status = $($svc.Status), expected Running"
          }
          Write-Host ""
          Write-Host "✅ cloudflared service Running. tunnel connector 등록 = curl https://yawnbot.mascari4615.com/webhook/github 으로 외부 검증."
