name: Auto Draft PR (KAR-018-Y)

# 워커가 push 한 feature/autopilot-task-* 브랜치 → Draft PR 자동 생성.
#
# 토큰 = PAT_FOR_AUTO_MERGE (KAR-081 근본 — 2026-05-19).
#   GITHUB_TOKEN 차선책(과거)은 anti-recursion 으로 GITHUB_TOKEN 생성 PR
#   이 on:pull_request workflow(verify·claude-pr-review) 를 미트리거 →
#   autopilot-graduate 가드3·4 영영 미충족 → Draft 18개 데드락 적재.
#   진짜 근본 = PAT 에 PR 생성권 부재였던 것. PAT 가 PR 을 만들면 일반
#   PAT 이벤트라 anti-recursion 자체가 없음 → verify·claude-pr-review·
#   graduate 4가드 전부 자연 충족(KAR-073 원설계 그대로 작동, graduate.yml
#   무변경). 증상 우회(가드 면제·디스패치) 전부 불요.
# ⚠ 전제: PAT_FOR_AUTO_MERGE fine-grained scope 에 "Pull requests: write"
#   필수(사용자 GitHub 설정 — KAR-081, 2026-05-19 적용). 없으면 GraphQL
#   "Resource not accessible by personal access token (createPullRequest)"
#   → PR 0(무음). 선례 = 2026-05-18 사용자가 같은 PAT 에 WM contents+PR
#   write 추가(새 토큰·secret 0, 토큰값 불변=재배포 불요).
#   부수 견고성: PAT 경로는 "Allow GitHub Actions to create PR" repo 토글
#   (KAR-077, GITHUB_TOKEN 전용) 의존 제거 — 그 토글 OFF 회귀에 면역.
# 멱등: 동일 head 브랜치 PR 이미 있으면 skip.
# 정본: TASK-KAR-081 (KAR-073 계보·회귀) / TASK-KAR-018-Y.

on:
  push:
    branches:
      - 'feature/autopilot-task-**'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft PR if absent
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_AUTO_MERGE }}
          GH_REPO: ${{ github.repository }}
          BR: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BR" --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "[auto-draft-pr] PR already open for $BR — skip"
            exit 0
          fi
          # no-diff 가드 (KAR-018-Y): 워커가 no-op task(기머지/진단만)에서
          # 브랜치만 push 하면 base 대비 0 commit → 빈 PR=노이즈(리뷰·
          # graduate 낭비). compare API 의 ahead_by==0 이면 PR 미생성.
          ahead=$(gh api "repos/$GH_REPO/compare/master...$BR" --jq '.ahead_by' 2>/dev/null || echo "err")
          if [ "$ahead" = "0" ]; then
            echo "[auto-draft-pr] $BR ahead_by=0 (no diff vs master) — PR 미생성 skip (빈 PR 방지)"
            exit 0
          fi
          if [ "$ahead" = "err" ]; then
            echo "[auto-draft-pr] compare 조회 실패 — 보수적으로 생성 시도"
          fi
          title="autopilot: ${BR#feature/autopilot-task-}"
          gh pr create --draft --head "$BR" --base master \
            --title "$title" \
            --body "🤖 KAR-018-Y autopilot 워커 산출. 브랜치 \`$BR\`. 리뷰 대기 (verify 수동 트리거/리뷰 후 graduate)." \
            && echo "[auto-draft-pr] Draft PR created for $BR" \
            || echo "[auto-draft-pr] gh pr create failed for $BR (branch may equal base = no diff)"
